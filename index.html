  <div id="app"><div class="p-10 text-center text-slate-400">A carregar…</div></div>

  <script>
  // =====================================================================
  //  Cliente Supabase
  // =====================================================================
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const state = { session: null, user: null };
  const sleep = (ms)=> new Promise(r=>setTimeout(r,ms));
  const ehRede = (e)=> /load failed|failed to fetch|networkerror|network error|timeout|fetch/i.test((e&&e.message)||String(e||''));
  // Repete apenas em falhas de rede momentâneas (o "Load failed" do iOS).
  async function comRetry(fn, tentativas=2){
    for(let i=0;i<tentativas;i++){
      try{ const r=await fn(); if(r&&r.error&&ehRede(r.error)&&i<tentativas-1){ await sleep(500); continue; } return r; }
      catch(e){ if(ehRede(e)&&i<tentativas-1){ await sleep(500); continue; } return {error:e}; }
    }
  }
  let membroEmEdicao = null;
  let ajustarAberto = false;
  let fichaVista = 'calendario';
  let relVista = 'mensal';
  let relDesde = null, relAte = null;

  // =====================================================================
  //  Utilitários
  // =====================================================================
  const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtHoras = (min) => (min/60).toFixed(1).replace('.', ',') + " h";
  function fmtDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function duracaoTurnoMin(hi, hf){ const [a,b]=hi.split(':').map(Number),[c,d]=hf.split(':').map(Number); let ini=a*60+b, fim=c*60+d; if(fim<=ini) fim+=1440; return fim-ini; }
  function atravessaMeiaNoite(hi, hf){ const [a,b]=hi.split(':').map(Number),[c,d]=hf.split(':').map(Number); return (c*60+d)<=(a*60+b); }
  function ehNoturno(hi){ const h=Number(hi.split(':')[0]); return h>=22 || h<6; }

  // =====================================================================
  //  Catálogo de regras (dados) — igual ao motor do backend
  // =====================================================================
  const CATALOGO_REGRAS = [
    { tipo:"MAX_HORAS", etiqueta:"Número máximo de horas", descricao:"Limite de horas atribuídas no período indicado.", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"periodo",etiqueta:"Período",tipo:"select",omissao:"mes",opcoes:[{valor:"mes",etiqueta:"Mês"},{valor:"semana",etiqueta:"Semana"}]},
               {chave:"limite",etiqueta:"Limite",tipo:"number",sufixo:"h",omissao:160} ] },
    { tipo:"MIN_HORAS", etiqueta:"Número mínimo de horas", descricao:"Mínimo de horas atribuídas no período indicado.", categoriaSugerida:"PREFERENCIAL",
      campos:[ {chave:"periodo",etiqueta:"Período",tipo:"select",omissao:"mes",opcoes:[{valor:"mes",etiqueta:"Mês"},{valor:"semana",etiqueta:"Semana"}]},
               {chave:"limite",etiqueta:"Limite",tipo:"number",sufixo:"h",omissao:120} ] },
    { tipo:"DESCANSO_ENTRE_TURNOS", etiqueta:"Descanso mínimo entre turnos", descricao:"Horas mínimas de descanso entre o fim de um turno e o início do seguinte.", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"min_horas",etiqueta:"Horas mínimas",tipo:"number",sufixo:"h",omissao:11} ] },
    { tipo:"MAX_DIAS_CONSECUTIVOS", etiqueta:"Máximo de dias consecutivos", descricao:"Número máximo de dias seguidos com turno atribuído.", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"max_dias",etiqueta:"Dias",tipo:"number",omissao:6} ] },
    { tipo:"MIN_FOLGAS", etiqueta:"Número mínimo de folgas", descricao:"Folgas mínimas no mês (dias sem qualquer turno).", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"min_folgas",etiqueta:"Folgas por mês",tipo:"number",omissao:8} ] },
    { tipo:"FIM_SEMANA_COMPLETO", etiqueta:"Fim de semana completo de descanso", descricao:"Pelo menos um sábado + domingo consecutivos sem turno, por mês.", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"min_por_mes",etiqueta:"Fins de semana por mês",tipo:"number",omissao:1} ] },
    { tipo:"MAX_TURNOS_NOTURNOS", etiqueta:"Máximo de turnos noturnos", descricao:"Limite de turnos noturnos no mês.", categoriaSugerida:"PREFERENCIAL",
      campos:[ {chave:"max",etiqueta:"Máximo por mês",tipo:"number",omissao:8} ] },
    { tipo:"NECESSIDADES_MINIMAS", etiqueta:"Necessidades mínimas por turno", descricao:"Número mínimo de trabalhadores em cada ocorrência do turno.", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"min_trabalhadores",etiqueta:"Trabalhadores por turno",tipo:"number",omissao:1} ] },
  ];
  const tipoRegra = (t) => CATALOGO_REGRAS.find(r => r.tipo === t);

  // =====================================================================
  //  Motor de regras (validação)
  // =====================================================================
  function porMembro(ctx){ const m=new Map(); for(const a of ctx.atribuicoes){ if(!m.has(a.membroId)) m.set(a.membroId,[]); m.get(a.membroId).push(a);} for(const arr of m.values()) arr.sort((x,y)=>x.data.localeCompare(y.data)); return m; }
  const sev = (r) => r.categoria === "OBRIGATORIA" ? "ERRO" : "AVISO";
  function fmtD(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

  const avaliadores = {
    MAX_HORAS(regra, ctx){ const lim=Number(regra.parametros?.limite??0), out=[]; for(const [,arr] of porMembro(ctx)){ const h=arr.reduce((s,a)=>s+a.duracaoMin,0)/60; if(lim && h>lim) out.push({regra:regra.nome,severidade:sev(regra),membroNome:arr[0].membroNome,mensagem:`${h.toFixed(1)}h atribuídas excedem o máximo de ${lim}h.`}); } return out; },
    MIN_HORAS(regra, ctx){ const lim=Number(regra.parametros?.limite??0), out=[]; for(const [,arr] of porMembro(ctx)){ const h=arr.reduce((s,a)=>s+a.duracaoMin,0)/60; if(lim && h<lim) out.push({regra:regra.nome,severidade:sev(regra),membroNome:arr[0].membroNome,mensagem:`${h.toFixed(1)}h atribuídas abaixo do mínimo de ${lim}h.`}); } return out; },
    DESCANSO_ENTRE_TURNOS(regra, ctx){ const minH=Number(regra.parametros?.min_horas??0), out=[]; for(const [,arr0] of porMembro(ctx)){ const arr=[...arr0].sort((a,b)=> a.data.localeCompare(b.data) || a.horaInicio.localeCompare(b.horaInicio)); for(let i=1;i<arr.length;i++){ const p=arr[i-1],c=arr[i]; const fimP=new Date(`${p.data}T${p.horaInicio}:00`).getTime()+p.duracaoMin*60000; const iniC=new Date(`${c.data}T${c.horaInicio}:00`).getTime(); if(iniC<fimP){ if(ctx.linked&&ctx.linked.has(p.turnoId+'|'+c.turnoId)) continue; out.push({regra:regra.nome,severidade:sev(regra),membroNome:c.membroNome,mensagem:`Sobreposição de turnos em ${c.data} (não pode estar em dois sítios ao mesmo tempo).`}); continue; } if(p.data!==c.data){ const desc=(iniC-fimP)/3600000; if(desc<minH) out.push({regra:regra.nome,severidade:sev(regra),membroNome:c.membroNome,mensagem:`Apenas ${desc.toFixed(1)}h de descanso entre ${p.data} e ${c.data} (mín. ${minH}h).`}); } } } return out; },
    MAX_DIAS_CONSECUTIVOS(regra, ctx){ const max=Number(regra.parametros?.max_dias??0), out=[]; for(const [,arr] of porMembro(ctx)){ const dias=[...new Set(arr.map(a=>a.data))].sort(); let seq=dias.length?1:0,mx=seq; for(let i=1;i<dias.length;i++){ const d1=new Date(dias[i-1]).getTime(),d2=new Date(dias[i]).getTime(); seq=(d2-d1===86400000)?seq+1:1; mx=Math.max(mx,seq);} if(max && mx>max) out.push({regra:regra.nome,severidade:sev(regra),membroNome:arr[0].membroNome,mensagem:`${mx} dias consecutivos excedem o máximo de ${max}.`}); } return out; },
    FIM_SEMANA_COMPLETO(regra, ctx){ const min=Number(regra.parametros?.min_por_mes??1), out=[]; for(const [,arr] of porMembro(ctx)){ const trab=new Set(arr.map(a=>a.data)); let livres=0; for(let dia=1;dia<=31;dia++){ const d=new Date(ctx.ano,ctx.mes-1,dia); if(d.getMonth()!==ctx.mes-1) break; if(d.getDay()===6){ const sab=fmtD(d); const dom=fmtD(new Date(ctx.ano,ctx.mes-1,dia+1)); if(!trab.has(sab)&&!trab.has(dom)) livres++; } } if(livres<min) out.push({regra:regra.nome,severidade:sev(regra),membroNome:arr[0].membroNome,mensagem:`${livres} fim(ns) de semana completo(s) livre(s); exigido(s) ${min}.`}); } return out; },
    MAX_TURNOS_NOTURNOS(regra, ctx){ const max=Number(regra.parametros?.max??0), out=[]; for(const [,arr] of porMembro(ctx)){ const n=arr.filter(a=>a.noturno).length; if(max && n>max) out.push({regra:regra.nome,severidade:sev(regra),membroNome:arr[0].membroNome,mensagem:`${n} turnos noturnos excedem o máximo de ${max}.`}); } return out; },
    NECESSIDADES_MINIMAS(regra, ctx){ const min=Number(regra.parametros?.min_trabalhadores??1), out=[], mapa=new Map(); for(const a of ctx.atribuicoes){ const k=`${a.data}|${a.turnoId}`; mapa.set(k,(mapa.get(k)??0)+1);} for(const [k,nn] of mapa){ if(nn<min){ const [data,turnoId]=k.split('|'); const nome=ctx.atribuicoes.find(a=>a.turnoId===turnoId)?.turnoNome??turnoId; out.push({regra:regra.nome,severidade:sev(regra),mensagem:`${data}: turno "${nome}" com ${nn} trabalhador(es), mínimo ${min}.`}); } } return out; },
  };
  function validarEscala(regras, ctx){ const out=[]; for(const r of regras){ const fn=avaliadores[r.tipo]; if(fn) out.push(...fn(r,ctx)); } return out; }

  // =====================================================================
  //  Gerador automático de escalas
  //  Estratégia: guloso, dia a dia, turno a turno. Para cada lugar escolhe o
  //  trabalhador elegível (que não quebra regras obrigatórias) com menor carga
  //  relativa. As regras são lidas do serviço — nada é específico de vigilância.
  // =====================================================================
  function extrairConfig(regras){
    const cfg = { need:1, minDescanso:0, maxDias:Infinity, maxHorasMin:Infinity, maxNoites:Infinity, maxNoitesHard:false, minFolgas:0 };
    for(const r of regras){
      if(!r.ativa) continue;
      const p = r.parametros || {};
      if(r.tipo==='NECESSIDADES_MINIMAS') cfg.need = Number(p.min_trabalhadores)||1;
      else if(r.tipo==='DESCANSO_ENTRE_TURNOS') cfg.minDescanso = Number(p.min_horas)||0;
      else if(r.tipo==='MAX_DIAS_CONSECUTIVOS') cfg.maxDias = Number(p.max_dias)||Infinity;
      else if(r.tipo==='MAX_HORAS' && (p.periodo||'mes')==='mes') cfg.maxHorasMin = (Number(p.limite)||Infinity)*60;
      else if(r.tipo==='MAX_TURNOS_NOTURNOS'){ cfg.maxNoites = Number(p.max)||Infinity; cfg.maxNoitesHard = (r.categoria==='OBRIGATORIA'); }
      else if(r.tipo==='MIN_FOLGAS') cfg.minFolgas = Number(p.min_folgas)||0;
    }
    return cfg;
  }
  function cmpScore(a,b){ for(let i=0;i<a.length;i++){ if(a[i]<b[i]) return -1; if(a[i]>b[i]) return 1; } return 0; }

  // Planeamento puro (sem rede) — testável isoladamente.
  // Histórico do serviço até (exclusive) à escala atual: por trabalhador,
  // total de fins de semana livres e média de noites por mês. Serve para a
  // justiça entre meses (quem teve menos FDS livres tem prioridade; noites
  // equilibradas ao longo do tempo).
  function historicoServico(atrs, turnos, escalas, escalaAtual){
    const tById=Object.fromEntries(turnos.map(t=>[t.id,t]));
    const prior = escalas.filter(e=> e.id!==escalaAtual.id && e.data_inicio < escalaAtual.data_inicio);
    const hist={};
    for(const e of prior){
      const di=new Date(e.data_inicio+'T12:00:00'); const ano=di.getFullYear(), mes=di.getMonth(); const diasNoMes=new Date(ano,mes+1,0).getDate();
      const byM={};
      for(const a of atrs){ if(a.escala_id!==e.id) continue; (byM[a.membro_id]=byM[a.membro_id]||{dias:new Set(),noites:0}); byM[a.membro_id].dias.add(a.data); if(tById[a.turno_id]?.noturno) byM[a.membro_id].noites++; }
      for(const mid in byM){
        const dias=byM[mid].dias; let fds=0;
        for(let d=1;d<=diasNoMes;d++){ const dd=new Date(ano,mes,d); if(dd.getDay()===6){ const sab=fmtDate(new Date(ano,mes,d)); const domDate=new Date(ano,mes,d+1); const dom=domDate.getMonth()===mes?fmtDate(domDate):null; if(!dias.has(sab)&&!(dom&&dias.has(dom))) fds++; } }
        hist[mid]=hist[mid]||{fdsLivres:0,noitesTot:0,meses:0}; hist[mid].fdsLivres+=fds; hist[mid].noitesTot+=byM[mid].noites; hist[mid].meses++;
      }
    }
    for(const mid in hist){ hist[mid].noitesMedia = hist[mid].meses? hist[mid].noitesTot/hist[mid].meses : 0; }
    return hist;
  }

  function planearEscala(turnos, membros, regras, ausencias, escala, hist){
    hist = hist || {};
    const cfg = extrairConfig(regras);
    const st = new Map(membros.map(m=>[m.id, { minutos:0, noites:0, streak:0, lastWorked:null, endInstant:null, target:(Number(m.horas_dia)? diasUteisMes(new Date(escala.data_inicio+'T12:00:00').getFullYear(), new Date(escala.data_inicio+'T12:00:00').getMonth()+1)*Number(m.horas_dia)*60 : (Number(m.horas_contratadas_mes)||0)*60) }]));
    const ausente = (mid,dstr)=> ausencias.some(a=> a.membro_id===mid && dstr>=a.data_inicio && dstr<=a.data_fim);
    const startInstant = (dstr,hi)=> new Date(`${dstr}T${hi}:00`).getTime();
    const dayMs = 86400000;
    // Âncora ao meio-dia: somar 24h a partir do meio-dia nunca troca de dia de
    // calendário, mesmo no dia da mudança da hora (25h/23h). Evita duplicar ou
    // saltar dias em outubro/março.
    const inicio = new Date(escala.data_inicio+'T12:00:00');
    const fim = new Date(escala.data_fim+'T12:00:00');
    const novas = []; let uncovered = 0; let dcount = 0;
    // Turnos "associados": feitos por quem faz o turno-pai, no mesmo dia.
    const ligadosPorPai = {}; for(const t of turnos){ if(t.segue_turno_id){ (ligadosPorPai[t.segue_turno_id]=ligadosPorPai[t.segue_turno_id]||[]).push(t); } }

    // Reservar fins de semana completos de descanso (regra FIM_SEMANA_COMPLETO).
    // Só é possível se houver folga suficiente (mais trabalhadores do que lugares/dia).
    const forcedOff = new Set();
    const turnosSabado = turnos.filter(t=>!t.segue_turno_id && (turnoAtivo(t,6)||turnoAtivo(t,0)));
    const lugaresPorDia = cfg.need * turnosSabado.length;
    if(lugaresPorDia < membros.length){
      const capPorFDS = membros.length - lugaresPorDia;   // quantos podem ter FDS completo em cada fim de semana
      const weekends = [];
      for(let d=new Date(inicio); d<=fim; d=new Date(d.getTime()+dayMs)){
        if(d.getDay()===6){ const dom=new Date(d.getTime()+dayMs); if(dom<=fim) weekends.push([fmtDate(d), fmtDate(dom)]); }
      }
      if(weekends.length>0){
        // Justiça entre meses: quem teve MENOS fins de semana livres no passado
        // escolhe primeiro. Empate ao acaso.
        const ordem = [...membros].sort((a,b)=> ((hist[a.id]?.fdsLivres||0)-(hist[b.id]?.fdsLivres||0)) || (Math.random()-0.5));
        const cont = weekends.map(()=>0); let wi=0;
        for(const m of ordem){
          for(let tent=0; tent<weekends.length; tent++){
            const idx = wi % weekends.length; wi++;
            if(cont[idx] < capPorFDS){ cont[idx]++; forcedOff.add(m.id+'|'+weekends[idx][0]); forcedOff.add(m.id+'|'+weekends[idx][1]); break; }
          }
        }
      }
    }

    for(let d=new Date(inicio); d<=fim; d=new Date(d.getTime()+dayMs)){
      const dstr = fmtDate(d);
      const ontem = fmtDate(new Date(d.getTime()-dayMs));
      const usados = new Set();
      const shift = dcount % turnos.length;                 // roda a ordem para variar quem apanha a noite
      const rot = turnos.slice(shift).concat(turnos.slice(0, shift));
      for(const t of rot){
        if(t.segue_turno_id) continue;               // turnos associados são preenchidos com o turno-pai
        if(!turnoAtivo(t, d.getDay())) continue;   // turno só corre nos seus dias da semana
        for(let slot=0; slot<cfg.need; slot++){
          // 2 passagens: a 1ª respeita a reserva de fim de semana; se ninguém
          // couber, a 2ª ignora essa reserva (mas nunca as regras rígidas) para
          // não deixar o turno por cobrir.
          let best=null, bestScore=null;
          for(let passe=0; passe<2 && !best; passe++){
            for(const m of membros){
              const s = st.get(m.id);
              if(usados.has(m.id)) continue;                                 // um turno por dia por pessoa
              if(ausente(m.id, dstr)) continue;                             // ausências
              if(passe===0 && forcedOff.has(m.id+'|'+dstr)) continue;       // fim de semana reservado (só na 1ª passagem)
              if(s.minutos + t.duracao_min > cfg.maxHorasMin) continue;     // máx. horas/mês
              if(t.noturno && cfg.maxNoitesHard && s.noites+1 > cfg.maxNoites) continue;
              const trabalhouOntem = s.lastWorked===ontem;
              const novaStreak = trabalhouOntem ? s.streak+1 : 1;
              if(novaStreak > cfg.maxDias) continue;                        // máx. dias seguidos
              if(s.endInstant!=null){
                const gap = (startInstant(dstr, t.hora_inicio) - s.endInstant)/3600000;
                if(gap < cfg.minDescanso) continue;                        // descanso entre turnos (e sobreposição)
              }
              const alvo = s.target>0 ? s.target : (cfg.maxHorasMin!==Infinity ? cfg.maxHorasMin : 9600);
              const ratio = s.minutos/alvo;                                 // preencher primeiro quem está mais longe do alvo
              const gapDias = s.lastWorked ? (new Date(dstr) - new Date(s.lastWorked))/dayMs : 99;
              // equilibrar noites, contando também o histórico de meses anteriores
              const penNoite = t.noturno ? (s.noites + (hist[m.id]?.noitesMedia||0)) : 0;
              const score = [ratio, penNoite, -gapDias, Math.random()];
              if(bestScore==null || cmpScore(score, bestScore) < 0){ bestScore=score; best=m; }
            }
          }
          if(!best){ uncovered++; continue; }
          const s = st.get(best.id);
          novas.push({ membro_id:best.id, turno_id:t.id, data:dstr });
          s.streak = (s.lastWorked===ontem) ? s.streak+1 : 1;
          s.minutos += t.duracao_min;
          if(t.noturno) s.noites++;
          s.lastWorked = dstr;
          s.endInstant = startInstant(dstr, t.hora_inicio) + t.duracao_min*60000;
          for(const L of (ligadosPorPai[t.id]||[])){ if(turnoAtivo(L, d.getDay())){ novas.push({ membro_id:best.id, turno_id:L.id, data:dstr }); s.minutos += L.duracao_min; if(L.noturno) s.noites++; const fimL=startInstant(dstr, L.hora_inicio)+L.duracao_min*60000; if(fimL>s.endInstant) s.endInstant=fimL; } }
          usados.add(best.id);
        }
      }
      dcount++;
    }
    return { novas, uncovered, st, ano:inicio.getFullYear(), mes:inicio.getMonth()+1 };
  }

  // Conta erros (regras obrigatórias) de um plano, para comparar tentativas.
  function contarErros(novas, turnos, membros, regras, escala){
    const tmap = Object.fromEntries(turnos.map(t=>[t.id,t]));
    const mmap = Object.fromEntries(membros.map(m=>[m.id,m]));
    const dd = new Date(escala.data_inicio+'T00:00:00');
    const ctx = { ano:dd.getFullYear(), mes:dd.getMonth()+1, atribuicoes: novas.map(n=>({
      membroId:n.membro_id, membroNome:mmap[n.membro_id]?.trabalhadores?.nome||'', data:n.data,
      turnoId:n.turno_id, turnoNome:tmap[n.turno_id]?.nome||'', duracaoMin:tmap[n.turno_id]?.duracao_min||0,
      noturno:!!tmap[n.turno_id]?.noturno, horaInicio:tmap[n.turno_id]?.hora_inicio||'00:00', atravessaMeiaNoite:!!tmap[n.turno_id]?.atravessa_meia_noite })), linked: linkedTurnos(turnos) };
    const rc = regras.filter(r=>r.ativa).map(r=>({tipo:r.tipo,nome:r.nome,categoria:r.categoria,parametros:r.parametros}));
    return validarEscala(rc, ctx).filter(x=>x.severidade==='ERRO').length;
  }

  // Multi-arranque: corre o planeamento várias vezes e fica com o melhor.
  // Mede o desequilíbrio de uma escala: dispersão de horas (h²) + noites entre
  // trabalhadores. Menor = mais justo.
  function metricaEquilibrio(novas, turnos, membros){
    const tById=Object.fromEntries(turnos.map(t=>[t.id,t]));
    const min={}, noites={};
    for(const m of membros){ min[m.id]=0; noites[m.id]=0; }
    for(const n of novas){ const t=tById[n.turno_id]; if(!t) continue; min[n.membro_id]=(min[n.membro_id]||0)+t.duracao_min; if(t.noturno) noites[n.membro_id]=(noites[n.membro_id]||0)+1; }
    const arrH=membros.map(m=>min[m.id]||0), arrN=membros.map(m=>noites[m.id]||0);
    const varOf=(arr)=>{ if(!arr.length) return 0; const mean=arr.reduce((a,b)=>a+b,0)/arr.length; return arr.reduce((s,x)=>s+(x-mean)*(x-mean),0)/arr.length; };
    return varOf(arrH)/3600 + varOf(arrN)*40; // horas em h² + peso nas noites
  }
  const cmpArr=(a,b)=>{ for(let i=0;i<a.length;i++){ if(a[i]<b[i]) return -1; if(a[i]>b[i]) return 1; } return 0; };

  function planearEscalaMulti(turnos, membros, regras, ausencias, escala, tentativas, hist){
    let best=null, bestKey=[Infinity,Infinity,Infinity];
    const N=(tentativas||12);
    for(let i=0; i<N; i++){
      const r = planearEscala(turnos, membros, regras, ausencias, escala, hist);
      const erros = contarErros(r.novas, turnos, membros, regras, escala);
      const eq = metricaEquilibrio(r.novas, turnos, membros);
      const key=[r.uncovered, erros, eq];
      if(cmpArr(key, bestKey) < 0){ best=r; bestKey=key; }
    }
    return best;
  }

  // Reparador focado: tenta dar um fim de semana completo a quem tem 0,
  // passando os turnos de fim de semana dessa pessoa a colegas elegíveis que
  // continuem a ter o seu próprio fim de semana livre. Nunca piora as regras.
  function repararEscala(turnos, membros, regras, ausencias, escala, atrs, hist){
    hist = hist || {};
    const cfg = extrairConfig(regras);
    const fdsReq = (()=>{ const r=regras.find(x=>x.tipo==='FIM_SEMANA_COMPLETO'&&x.ativa!==false); return r?Number(r.parametros?.min_por_mes||1):0; })();
    if(fdsReq<=0) return atrs;
    const tById = Object.fromEntries(turnos.map(t=>[t.id,t]));
    const di=new Date(escala.data_inicio+'T12:00:00'); const ano=di.getFullYear(), mes=di.getMonth();
    const diasNoMes=new Date(ano,mes+1,0).getDate();
    const ausente=(mid,ds)=>ausencias.some(a=>a.membro_id===mid&&ds>=a.data_inicio&&ds<=a.data_fim);
    const dstrOf=(dia)=>`${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const startInst=(ds,hi)=>new Date(`${ds}T${hi}:00`).getTime();

    let byMD={}, mDays={};
    const rebuild=()=>{ byMD={}; mDays={}; for(const a of atrs){ byMD[a.membro_id+'|'+a.data]=a; (mDays[a.membro_id]=mDays[a.membro_id]||new Set()).add(a.data); } };
    rebuild();
    const worksDay=(mid,ds)=>!!byMD[mid+'|'+ds];
    const minutosDe=(mid)=>[...(mDays[mid]||[])].reduce((s,ds)=>s+(tById[byMD[mid+'|'+ds].turno_id]?.duracao_min||0),0);
    const noitesDe=(mid)=>[...(mDays[mid]||[])].filter(ds=>tById[byMD[mid+'|'+ds].turno_id]?.noturno).length;
    const fdsLivres=(diasSet)=>{ let c=0; for(let dia=1;dia<=diasNoMes;dia++){ const d=new Date(ano,mes,dia); if(d.getDay()===6){ const sab=dstrOf(dia); const domD=new Date(ano,mes,dia+1); const dom=domD.getMonth()===mes?dstrOf(dia+1):null; if(!diasSet.has(sab)&&!(dom&&diasSet.has(dom))) c++; } } return c; };
    const descansoOK=(mid,ds,turnoId)=>{ const t=tById[turnoId]; const s=startInst(ds,t.hora_inicio), e=s+t.duracao_min*60000; for(const off of [-1,1]){ const d2=new Date(ds+'T12:00:00'); d2.setDate(d2.getDate()+off); const ds2=fmtDate(d2); const a2=byMD[mid+'|'+ds2]; if(!a2) continue; const t2=tById[a2.turno_id]; const s2=startInst(ds2,t2.hora_inicio), e2=s2+t2.duracao_min*60000; const gap= off<0?(s-e2)/3600000:(s2-e)/3600000; if(gap<cfg.minDescanso) return false; } return true; };
    const consecutivosOK=(mid,ds)=>{ const dias=new Set(mDays[mid]||[]); dias.add(ds); const arr=[...dias].sort(); let seq=1,mx=1; for(let i=1;i<arr.length;i++){ const a=new Date(arr[i-1]).getTime(),b=new Date(arr[i]).getTime(); seq=(b-a===86400000)?seq+1:1; mx=Math.max(mx,seq);} return mx<=cfg.maxDias; };
    const podeAssumir=(mid,ds,turnoId)=>{ if(worksDay(mid,ds)||ausente(mid,ds)) return false; const t=tById[turnoId]; if(minutosDe(mid)+t.duracao_min>cfg.maxHorasMin) return false; if(t.noturno&&cfg.maxNoitesHard&&noitesDe(mid)+1>cfg.maxNoites) return false; if(!consecutivosOK(mid,ds)) return false; if(!descansoOK(mid,ds,turnoId)) return false; const futuro=new Set(mDays[mid]||[]); futuro.add(ds); return fdsLivres(futuro)>=fdsReq; };

    const ordemRep = [...membros].sort((a,b)=> ((hist[a.id]?.fdsLivres||0)-(hist[b.id]?.fdsLivres||0)) || (Math.random()-0.5));
    for(const m of ordemRep){
      if(fdsLivres(mDays[m.id]||new Set())>=fdsReq) continue;
      for(let dia=1; dia<=diasNoMes; dia++){
        const d=new Date(ano,mes,dia); if(d.getDay()!==6) continue;
        const sab=dstrOf(dia); const domD=new Date(ano,mes,dia+1); const dom=domD.getMonth()===mes?dstrOf(dia+1):null;
        const shifts=[]; if(worksDay(m.id,sab)) shifts.push(sab); if(dom&&worksDay(m.id,dom)) shifts.push(dom);
        if(shifts.length===0) continue;
        const plano=[]; const usados=new Set(); let ok=true;
        for(const ds of shifts){ const a=byMD[m.id+'|'+ds]; let repl=null; for(const x of membros){ if(x.id===m.id||usados.has(x.id+'|'+ds)) continue; if(podeAssumir(x.id,ds,a.turno_id)){ repl=x.id; break; } } if(!repl){ ok=false; break; } plano.push({ds,to:repl,from:m.id}); usados.add(repl+'|'+ds); }
        if(ok && plano.length===shifts.length){ for(const p of plano){ byMD[p.from+'|'+p.ds].membro_id=p.to; } rebuild(); break; }
      }
    }
    return atrs;
  }

  async function corrigirEscala(sid, eid, escala){
    const [{data:turnosRaw=[]},{data:membrosRaw=[]},{data:regrasRaw=[]},{data:ausencias=[]},{data:atrRaw=[]},{data:escalasAll=[]},{data:atrAll=[]}] = await Promise.all([
      DB.turnos(sid), DB.membros(sid), DB.regras(sid), sb.from('ausencias').select('*').eq('servico_id',sid), sb.from('atribuicoes').select('*').eq('escala_id',eid),
      DB.escalas(sid), sb.from('atribuicoes').select('*').eq('servico_id',sid)
    ]);
    const turnos=turnosRaw.filter(t=>t.ativo!==false);
    const membros=membrosRaw.filter(m=>m.ativo!==false && !m.substituto);
    const regras=regrasRaw.filter(r=>r.ativa);
    const hist=historicoServico(atrAll, turnos, escalasAll, escala);
    const errosDe=(novas)=>contarErros(novas, turnos, membros, regras, escala);

    let melhor = atrRaw.map(a=>({membro_id:a.membro_id, turno_id:a.turno_id, data:a.data}));
    let melhorErros = errosDe(melhor);

    const candidatos = [];
    candidatos.push(repararEscala(turnos, membros, regras, ausencias, escala, melhor.map(a=>({...a})), hist));
    const fresh = planearEscalaMulti(turnos, membros, regras, ausencias, escala, 50, hist);
    if(fresh){ candidatos.push(fresh.novas.map(a=>({...a}))); candidatos.push(repararEscala(turnos, membros, regras, ausencias, escala, fresh.novas.map(a=>({...a})), hist)); }
    for(const c of candidatos){ const e=errosDe(c); if(e<melhorErros){ melhor=c; melhorErros=e; } }

    const del = await sb.from('atribuicoes').delete().eq('escala_id', eid);
    if(del.error){ alert(del.error.message); return; }
    const rows = melhor.map(n=>({servico_id:sid, escala_id:eid, membro_id:n.membro_id, turno_id:n.turno_id, data:n.data, estado:'PLANEADO', origem:'AUTO'}));
    for(let i=0;i<rows.length;i+=400){ const {error}=await sb.from('atribuicoes').insert(rows.slice(i,i+400)); if(error){ alert(error.message); return; } }
    return { erros: melhorErros };
  }

  async function recontabilizar(sid, eid, escala, linhas, membros){
    const di=new Date(escala.data_inicio+'T12:00:00'); const ano=di.getFullYear(), mes=di.getMonth()+1;
    const min={}; for(const l of linhas){ min[l.membroId]=(min[l.membroId]||0)+l.duracaoMin; }
    const rows=membros.map(m=>({ servico_id:sid, membro_id:m.id, ano, mes, horas_previstas:+(((min[m.id]||0)/60).toFixed(2)), estado:'ABERTO' }));
    if(rows.length) await sb.from('registos_horas').upsert(rows, { onConflict:'membro_id,ano,mes' });
  }

  async function gerarEscalaAuto(sid, eid, escala){
    const [{data:turnosRaw=[]},{data:membrosRaw=[]},{data:regrasRaw=[]},{data:ausencias=[]},{data:escalasAll=[]},{data:atrAll=[]}] = await Promise.all([
      DB.turnos(sid), DB.membros(sid), DB.regras(sid), sb.from('ausencias').select('*').eq('servico_id', sid),
      DB.escalas(sid), sb.from('atribuicoes').select('*').eq('servico_id', sid)
    ]);
    const turnos = turnosRaw.filter(t=>t.ativo!==false);
    const membros = membrosRaw.filter(m=>m.ativo!==false && !m.substituto);
    const regras = regrasRaw.filter(r=>r.ativa);
    if(turnos.length===0 || membros.length===0){ alert('Precisas de pelo menos um turno e um trabalhador (não substituto) neste serviço.'); return; }
    const hist = historicoServico(atrAll, turnos, escalasAll, escala);

    const { novas, uncovered, st, ano, mes } = planearEscalaMulti(turnos, membros, regras, ausencias, escala, 30, hist);

    const del = await sb.from('atribuicoes').delete().eq('escala_id', eid);
    if(del.error){ alert(del.error.message); return; }
    const rowsA = novas.map(n=>({ servico_id:sid, escala_id:eid, membro_id:n.membro_id, turno_id:n.turno_id, data:n.data, estado:'PLANEADO', origem:'AUTO' }));
    for(let i=0;i<rowsA.length;i+=400){
      const { error } = await sb.from('atribuicoes').insert(rowsA.slice(i,i+400));
      if(error){ alert(error.message); return; }
    }
    const rows = [...st.entries()].map(([mid,s])=>({ servico_id:sid, membro_id:mid, ano, mes, horas_previstas:+(s.minutos/60).toFixed(2), estado:'ABERTO' }));
    if(rows.length) await sb.from('registos_horas').upsert(rows, { onConflict:'membro_id,ano,mes' });

    return { total:novas.length, uncovered };
  }

  function gerarICS(nome, atrs){
    const pad=n=>String(n).padStart(2,'0');
    const dt=(dstr,hhmm,addMin)=>{ const [Y,M,D]=dstr.split('-').map(Number); const [h,mi]=hhmm.split(':').map(Number); const b=new Date(Y,M-1,D,h,mi); if(addMin) b.setMinutes(b.getMinutes()+addMin); return b.getFullYear()+pad(b.getMonth()+1)+pad(b.getDate())+'T'+pad(b.getHours())+pad(b.getMinutes())+'00'; };
    let out='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//GestaoEscalas//PT\r\nCALSCALE:GREGORIAN\r\n';
    for(const a of atrs){ const t=a.turnos||{}; out+='BEGIN:VEVENT\r\nUID:'+a.id+'@escalas\r\nDTSTART:'+dt(a.data,t.hora_inicio||'00:00')+'\r\nDTEND:'+dt(a.data,t.hora_inicio||'00:00',t.duracao_min||0)+'\r\nSUMMARY:'+((t.nome||'Turno')+' — '+nome)+'\r\nEND:VEVENT\r\n'; }
    out+='END:VCALENDAR';
    return out;
  }
  function descarregar(nomeFich, conteudo, mime){

    const a=document.createElement('a'); a.href=url; a.download=nomeFich; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }

  async function viewTrabalhadorFicha(el, sid, membroId, escalaId){
    const [{data:membro},{data:turnos=[]},{data:escalas=[]},{data:atrs=[]},{data:ausencias=[]},{data:horasExt=[]}] = await Promise.all([
      sb.from('membros').select('*, trabalhadores(*)').eq('id', membroId).single(),
      DB.turnos(sid), DB.escalas(sid),
      sb.from('atribuicoes').select('*, turnos(*)').eq('membro_id', membroId),
      sb.from('ausencias').select('*').eq('membro_id', membroId),
      sb.from('horas_externas').select('*').eq('membro_id', membroId),
    ]);
    if(!membro){ el.innerHTML = empty('Trabalhador não encontrado'); return; }
    const nome = membro.trabalhadores?.nome || '';
    const contratada = Number(membro.horas_contratadas_mes)||0;
    const horasDia = Number(membro.horas_dia)||0;
    const temNorma = horasDia>0 || contratada>0;
    const extMesMin=(ano,mes)=> horasExt.filter(h=>{ const d=new Date(h.data+'T12:00:00'); return d.getFullYear()===ano&&d.getMonth()+1===mes; }).reduce((s,h)=>s+Number(h.horas||0)*60,0);
    const escalasAsc = [...escalas].sort((a,b)=>a.data_inicio.localeCompare(b.data_inicio));
    const escalasDesc = [...escalasAsc].reverse();
    const escalaSel = escalas.find(e=>e.id===escalaId) || escalasDesc[0] || null;
    const horasDeEscala = (eid)=> atrs.filter(a=>a.escala_id===eid).reduce((s,a)=>s+(a.turnos?.duracao_min||0),0)/60;
    const wd = (d)=> new Date(d+'T12:00:00').getDay();
    const fmt1 = (x)=> x.toFixed(1).replace('.',',');

    // Saldo acumulado até ao mês selecionado (inclusive)
    const ateSel = escalaSel ? escalasAsc.filter(e=>e.data_inicio<=escalaSel.data_inicio) : [];
    let acum=0; const acumRows=[];
    for(const e of ateSel){ const dE=new Date(e.data_inicio+'T12:00:00'); const ano=dE.getFullYear(), mes=dE.getMonth()+1; const realizado=horasDeEscala(e.id)+extMesMin(ano,mes)/60; const esp=esperadoAjustado(membro,ano,mes,ausencias); const sMes=temNorma? realizado-esp : null; if(sMes!=null) acum+=sMes; acumRows.push({nome:e.nome, h:realizado, esp, sMes, acum: temNorma? acum : null}); }
    const saldoFinal = temNorma? acum : null;
    let headline;
    if(saldoFinal==null) headline = `<span class="text-slate-500">Defina as horas por dia do trabalhador para calcular o saldo.</span>`;
    else if(saldoFinal < -0.05) headline = `<span class="text-3xl font-bold text-red-600">Deve ${fmt1(Math.abs(saldoFinal))} h</span><span class="ml-2 text-sm text-slate-400">acumulado até ${esc(escalaSel.nome)}</span>`;

          ${stat("Escalas",String(escalas.length))}${stat("Horas / dia",horasDia?fmt1(horasDia)+" h":(contratada?fmt1(contratada)+" h/mês":"—"))}

        <div class="mt-4 grid gap-4 lg:grid-cols-2"><div>${tiposHtml}</div><div>${semanaHtml}</div></div>

  async function viewRelatorios(el, sid, escalaId){

    const [{data:membros=[]},{data:turnos=[]},{data:escalas=[]},{data:atrs=[]},{data:ext=[]},{data:ausencias=[]}] = await Promise.all([
      DB.membros(sid), DB.turnos(sid), DB.escalas(sid),
      sb.from('atribuicoes').select('*, turnos(*)').eq('servico_id', sid),
      sb.from('horas_externas').select('*').eq('servico_id', sid),
      sb.from('ausencias').select('*').eq('servico_id', sid),
    ]);
    const escalasAsc=[...escalas].sort((a,b)=>a.data_inicio.localeCompare(b.data_inicio));
    const escalasDesc=[...escalasAsc].reverse();
    const escalaSel = escalas.find(e=>e.id===escalaId) || escalasDesc[0] || null;
    const fmt1=(x)=>x.toFixed(1).replace('.',',');
    const tById=Object.fromEntries(turnos.map(t=>[t.id,t]));
    const wd=(d)=>new Date(d+'T12:00:00').getDay();
    const emMes=(dstr,ano,mes)=>{ const d=new Date(dstr+'T12:00:00'); return d.getFullYear()===ano&&d.getMonth()+1===mes; };
    const extMesMin=(mid,ano,mes)=> ext.filter(h=>h.membro_id===mid&&emMes(h.data,ano,mes)).reduce((s,h)=>s+Number(h.horas||0)*60,0);
    const contaAusMes=(mid,ano,mes,tipo)=>{ const diasNoMes=new Date(ano,mes,0).getDate(); let c=0; for(let d=1;d<=diasNoMes;d++){ const ds=`${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`; if(ausencias.some(a=>a.membro_id===mid&&(!tipo||a.tipo===tipo)&&ds>=a.data_inicio&&ds<=a.data_fim)) c++; } return c; };
    const temAtividade=(mid)=> atrs.some(a=>a.membro_id===mid)||ext.some(h=>h.membro_id===mid);
    const lista = membros.filter(m=>!m.substituto || temAtividade(m.id));

    const sc=(v)=> v==null?'text-slate-400':v<-0.05?'text-red-600':v>0.05?'text-emerald-600':'text-slate-600';
    const sinal=(v)=> v==null?'—':(v>0?'+':'')+fmt1(v);

    // ---- MENSAL ----
    let mensalHtml='<p class="text-sm text-slate-400">Este serviço ainda não tem escalas.</p>';
    if(escalaSel){
      const di=new Date(escalaSel.data_inicio+'T12:00:00'); const ano=di.getFullYear(), mes=di.getMonth()+1; const diasNoMes=new Date(ano,mes,0).getDate();
      const rows=lista.map(m=>{
        const atrM=atrs.filter(a=>a.membro_id===m.id&&a.escala_id===escalaSel.id);
        const schedMin=atrM.reduce((s,a)=>s+(tById[a.turno_id]?.duracao_min||0),0);
        const extMin=extMesMin(m.id,ano,mes);
        const hd=Number(m.horas_dia)||0; const temN = hd>0 || (Number(m.horas_contratadas_mes)||0)>0;
        const esp=esperadoAjustado(m,ano,mes,ausencias); const totalH=(schedMin+extMin)/60;
        const diasTrab=new Set(atrM.map(a=>a.data));
        return { nome:m.trabalhadores?.nome||'', subst:m.substituto, turnos:atrM.length, schedH:schedMin/60, extH:extMin/60, totalH, esp:temN?esp:null, saldo:temN?totalH-esp:null,
          noites:atrM.filter(a=>tById[a.turno_id]?.noturno).length, sab:atrM.filter(a=>wd(a.data)===6).length, dom:atrM.filter(a=>wd(a.data)===0).length,
          folgas:Math.max(0,diasNoMes-diasTrab.size-contaAusMes(m.id,ano,mes,null)), feriasN:contaAusMes(m.id,ano,mes,'FERIAS') };

      mensalHtml = `<h3 class="mb-2 text-sm font-semibold text-slate-700">Relatório mensal · ${esc(escalaSel.nome)} <span class="font-normal text-slate-400">(${diasUteisMes(ano,mes)} dias úteis)</span></h3>${card(`<table class="w-full text-sm"><thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-400"><tr>

        <p class="mt-2 text-xs text-slate-400">Esperado = dias úteis × horas/dia, descontadas as férias/baixa (a que o trabalhador tem direito) · Saldo = Total − Esperado.</p>`;
    }

    // ---- ACUMULADO ----
    // Intervalo de meses escolhido
    const desdeE = escalasAsc.find(e=>e.id===relDesde) || escalasAsc[0] || null;

    const turnosCols = [...turnos].filter(t=>t.ativo!==false).sort((a,b)=>a.ordem-b.ordem);
    const fdsLivresMes=(diasSet,ano,mes)=>{ const dim=new Date(ano,mes,0).getDate(); let c=0; for(let d=1;d<=dim;d++){ const dd=new Date(ano,mes-1,d); if(dd.getDay()===6){ const sab=`${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const domD=new Date(ano,mes-1,d+1); const dom=domD.getMonth()===mes-1?`${ano}-${String(mes).padStart(2,'0')}-${String(d+1).padStart(2,'0')}`:null; if(!diasSet.has(sab)&&!(dom&&diasSet.has(dom))) c++; } } return c; };

        sMinAll+=sMin; eMinAll+=eMin; horasMes[e.id]=(sMin+eMin)/60; fdsL+=fdsLivresMes(diasSet,ano,mes);
        if(temN) acum += (sMin+eMin)/60 - esperadoAjustado(m,ano,mes,ausencias);
      }
      return { id:m.id, nome:m.trabalhadores?.nome||'', subst:m.substituto, turnos:turnosN, totalH:(sMinAll+eMinAll)/60, extH:eMinAll/60, sab, dom, noites, fdsL, porTipo, porTipoFDS, horasMes, acum:temN?acum:null };

    // Tabela B — turnos por tipo (e quantos ao fim de semana)

      <th class="px-3 py-2.5">Trabalhador</th>${turnosCols.map(t=>`<th class="px-2 py-2.5 text-center" title="${esc((eqById[t.equipamento_id]?.nome||'')+' · '+t.nome)}">${esc(t.nome)}<br><span class="text-[9px] font-normal normal-case text-slate-400">${esc(t.hora_inicio)}</span></th>`).join('')}</tr></thead>
      <tbody class="divide-y divide-slate-100">${dadosAc.map(r=>`<tr><td class="px-3 py-2 font-medium text-slate-800">${esc(r.nome)}</td>${turnosCols.map(t=>{ const tot=r.porTipo[t.id]||0; const f=r.porTipoFDS[t.id]||0; return `<td class="px-2 py-2 text-center text-slate-600">${tot||'—'}${f?` <span class="text-[10px] text-amber-600">(${f} FDS)</span>`:''}</td>`; }).join('')}</tr>`).join('')||`<tr><td colspan="${turnosCols.length+1}" class="px-3 py-4 text-center text-slate-400">Sem dados.</td></tr>`}</tbody></table>`;

    // Tabela C — horas por mês + total
    const tabHoras = `<table class="w-full text-sm"><thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-400"><tr>
      <th class="px-3 py-2.5">Trabalhador</th>${escalasRange.map(e=>`<th class="px-2 py-2.5 text-center">${esc(e.nome)}</th>`).join('')}${cab('Total')}</tr></thead>
      <tbody class="divide-y divide-slate-100">${dadosAc.map(r=>`<tr><td class="px-3 py-2 font-medium text-slate-800">${esc(r.nome)}</td>${escalasRange.map(e=>`<td class="px-2 py-2 text-center text-slate-600">${r.horasMes[e.id]?fmt1(r.horasMes[e.id]):'—'}</td>`).join('')}<td class="px-2 py-2 text-center font-semibold text-slate-800">${fmt1(r.totalH)}</td></tr>`).join('')||`<tr><td colspan="${escalasRange.length+2}" class="px-3 py-4 text-center text-slate-400">Sem dados.</td></tr>`}</tbody></table>`;

    const acumHtml = `

    el.innerHTML = html + servicoTabs(sid,"relatorios") + `<div class="report">

  async function viewRelatoriosPlaceholder(){}
  const primeiroNome = (n)=> (n||"").trim().split(/\s+/)[0] || "";
  const DIAS_SEMANA = [['1','Seg'],['2','Ter'],['3','Qua'],['4','Qui'],['5','Sex'],['6','Sáb'],['0','Dom']];
  function turnoAtivo(t, dow){ if(!t || !t.dias_semana) return true; return t.dias_semana.split(',').map(Number).includes(Number(dow)); }
  function linkedTurnos(turnos){ const s=new Set(); for(const t of turnos){ if(t.segue_turno_id){ s.add(t.id+'|'+t.segue_turno_id); s.add(t.segue_turno_id+'|'+t.id); } } return s; }
  function descreveDias(ds){ if(!ds) return 'todos os dias'; const set=ds.split(',').map(Number); if([0,1,2,3,4,5,6].every(x=>set.includes(x))) return 'todos os dias'; if([1,2,3,4,5].every(x=>set.includes(x))&&!set.includes(0)&&!set.includes(6)) return 'dias úteis'; return DIAS_SEMANA.filter(([n])=>set.includes(Number(n))).map(([,l])=>l).join(', '); }

  // --- Cálculo do esperado mensal e crédito de ausências ---
  function diasUteisMes(ano, mes){ const n=new Date(ano,mes,0).getDate(); let c=0; for(let d=1;d<=n;d++){ const w=new Date(ano,mes-1,d).getDay(); if(w!==0&&w!==6) c++; } return c; }
  function esperadoMes(membro, ano, mes){ const hd=Number(membro.horas_dia)||0; if(hd>0) return diasUteisMes(ano,mes)*hd; return Number(membro.horas_contratadas_mes)||0; }
  // dias úteis em que o trabalhador está de férias/doença/baixa × horas/dia (têm direito às horas)
  function creditoAusencias(membroId, ano, mes, ausencias, horasDia){ if(!horasDia) return 0; const n=new Date(ano,mes,0).getDate(); let dias=0; for(let d=1;d<=n;d++){ const w=new Date(ano,mes-1,d).getDay(); if(w===0||w===6) continue; const ds=`${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`; if(ausencias.some(a=>a.membro_id===membroId&&(a.tipo==='FERIAS'||a.tipo==='DOENCA'||a.tipo==='BAIXA')&&ds>=a.data_inicio&&ds<=a.data_fim)) dias++; } return dias*horasDia; }
  function esperadoAjustado(membro, ano, mes, ausencias){ const hd=Number(membro.horas_dia)||0; return esperadoMes(membro,ano,mes) - creditoAusencias(membro.id||membro.membroId, ano, mes, ausencias, hd); }

  // Grelha de calendário do mês da escala
  function renderCalendario(escala, turnos, linhas, membros, ausencias){
    membros = membros || []; ausencias = ausencias || [];
    const di = new Date(escala.data_inicio+'T00:00:00');
    const ano = di.getFullYear(), mes = di.getMonth();
    const diasNoMes = new Date(ano, mes+1, 0).getDate();
    const turnosOrd = [...turnos].sort((a,b)=>a.ordem-b.ordem);
    const porData = {};
    for(const l of linhas){ (porData[l.data] = porData[l.data] || []).push(l); }
    const ausenciaDe = (mid,dstr,tipo)=> ausencias.some(a=> a.membro_id===mid && dstr>=a.data_inicio && dstr<=a.data_fim && (!tipo || a.tipo===tipo));
    const primeiro = new Date(ano, mes, 1);
    const offset = (primeiro.getDay()+6)%7; // 0 = segunda-feira
    const nomesDias = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

    let cells = '';
    for(let i=0;i<offset;i++) cells += `<div></div>`;
    for(let dia=1; dia<=diasNoMes; dia++){
      const dstr = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
      const dow = new Date(ano, mes, dia).getDay();
      const fds = (dow===0 || dow===6);
      const doDia = porData[dstr] || [];
      const trabalham = new Set(doDia.map(l=>l.membroId));
      const linhasTurno = turnosOrd.filter(t=>turnoAtivo(t,dow)).map(t=>{
        const gente = doDia.filter(l=>l.turnoId===t.id);
        if(gente.length===0){ if(t.segue_turno_id) return ''; return `<div class="flex items-center gap-1 text-[11px] text-red-400"><span class="h-1.5 w-1.5 rounded-full bg-red-300"></span><span class="truncate">${esc(t.nome)}: falta</span></div>`; }
        return gente.map(g=>`<div class="flex items-start gap-1 text-[11px] leading-tight" title="${esc(t.nome)} ${esc(t.hora_inicio)}–${esc(t.hora_fim)} — ${esc(g.membroNome)}"><span class="mt-1 h-1.5 w-1.5 rounded-full shrink-0" style="background:${esc(t.cor)}"></span><span class="text-slate-700"><span class="text-slate-400">${esc(t.hora_inicio)}–${esc(t.hora_fim)}</span> ${esc(g.membroNome)}</span></div>`).join('');
      }).join('');
      // Férias e folgas (distintos de quem trabalha)
      const feriasHoje = membros.filter(m=> !m.substituto && ausenciaDe(m.id,dstr,'FERIAS'));
      const outraAusHoje = membros.filter(m=> !m.substituto && !ausenciaDe(m.id,dstr,'FERIAS') && ausenciaDe(m.id,dstr));
      const folgaHoje = membros.filter(m=> !m.substituto && !trabalham.has(m.id) && !ausenciaDe(m.id,dstr));
      const extras =
        feriasHoje.map(m=>`<div class="flex items-center gap-1 text-[11px] text-amber-600" title="Férias — ${esc(m.trabalhadores?.nome||'')}"><span class="shrink-0">🏖️</span><span class="truncate">${esc(m.trabalhadores?.nome||'')}</span></div>`).join('')
      + outraAusHoje.map(m=>`<div class="flex items-center gap-1 text-[11px] text-rose-500" title="Ausência — ${esc(m.trabalhadores?.nome||'')}"><span class="shrink-0">✖</span><span class="truncate">${esc(m.trabalhadores?.nome||'')}</span></div>`).join('')
      + folgaHoje.map(m=>`<div class="flex items-center gap-1 text-[11px] text-slate-400" title="Folga — ${esc(m.trabalhadores?.nome||'')}"><span class="h-1.5 w-1.5 rounded-full border border-slate-300 shrink-0"></span><span class="truncate italic">${esc(m.trabalhadores?.nome||'')}</span></div>`).join('');
      cells += `<div class="rounded-lg border ${fds?'border-slate-200 bg-slate-50':'border-slate-100 bg-white'} p-1.5 min-h-[96px]">
        <div class="mb-1 text-xs font-semibold ${fds?'text-slate-400':'text-slate-500'}">${dia}</div>
        <div class="space-y-0.5">${linhasTurno}${extras?`<div class="my-1 border-t border-dashed border-slate-200"></div>${extras}`:''}</div></div>`;
    }
    const legenda = turnosOrd.map(t=>`<span class="inline-flex items-center gap-1 text-xs text-slate-500"><span class="h-2 w-2 rounded-full" style="background:${esc(t.cor)}"></span>${esc(t.nome)} <span class="text-slate-400">${esc(t.hora_inicio)}–${esc(t.hora_fim)}</span></span>`).join('');
    return card(`<div class="p-4 print-block">
      <div class="mb-3 flex flex-wrap items-center gap-x-4 gap-y-1">${legenda}
        <span class="inline-flex items-center gap-1 text-xs text-amber-600">🏖️ férias</span>
        <span class="inline-flex items-center gap-1 text-xs text-slate-400"><span class="h-2 w-2 rounded-full border border-slate-300"></span>folga</span>
        <span class="inline-flex items-center gap-1 text-xs text-red-400"><span class="h-2 w-2 rounded-full bg-red-300"></span>turno por cobrir</span></div>
      <div class="overflow-x-auto cal-scroll"><div class="min-w-[720px] cal-grid">
        <div class="mb-1 grid grid-cols-7 gap-1">${nomesDias.map(d=>`<div class="text-center text-xs font-medium text-slate-400">${d}</div>`).join('')}</div>
        <div class="grid grid-cols-7 gap-1">${cells}</div>
      </div></div>
    </div>`);
  }

  // Resumo por trabalhador (turnos, horas, saldo, noites, folgas, férias, FDS livres)
  function renderResumoEscala(escala, membros, turnos, linhas, ausencias){
    ausencias = ausencias || [];
    const di = new Date(escala.data_inicio+'T00:00:00');
    const ano = di.getFullYear(), mes = di.getMonth();
    const diasNoMes = new Date(ano, mes+1, 0).getDate();
    const tById = Object.fromEntries(turnos.map(t=>[t.id,t]));
    const membrosMostrar = membros.filter(m=>!m.substituto || linhas.some(l=>l.membroId===m.id));
    const mById = Object.fromEntries(membrosMostrar.map(m=>[m.id,m]));
    const stats = new Map(membrosMostrar.map(m=>[m.id, { nome:m.trabalhadores?.nome||"", min:0, noites:0, turnos:0, dias:new Set() }]));
    for(const l of linhas){ const s=stats.get(l.membroId); if(!s) continue; s.min+=l.duracaoMin; s.turnos++; s.dias.add(l.data); if(tById[l.turnoId]?.noturno) s.noites++; }
    const contarAus = (mid,tipo)=>{ let c=0; for(let dia=1;dia<=diasNoMes;dia++){ const dstr=`${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`; if(ausencias.some(a=>a.membro_id===mid && (!tipo||a.tipo===tipo) && dstr>=a.data_inicio && dstr<=a.data_fim)) c++; } return c; };
    const fdsLivres = (diasSet)=>{ let c=0; for(let dia=1;dia<=diasNoMes;dia++){ const d=new Date(ano,mes,dia); if(d.getDay()===6){ const sab=fmtDate(d), dom=fmtDate(new Date(ano,mes,dia+1)); if(!diasSet.has(sab)&&!diasSet.has(dom)) c++; } } return c; };
    const rows = [...stats.entries()].map(([mid,s])=>{
      const m=mById[mid]; const temN=(Number(m.horas_dia)||0)>0 || (Number(m.horas_contratadas_mes)||0)>0;
      const esp = esperadoAjustado(m, ano, mes+1, ausencias);
      const horas=s.min/60, ferias=contarAus(mid,'FERIAS'), folgas=diasNoMes-s.dias.size-contarAus(mid,null), saldo=temN?horas-esp:null;
      const saldoCls = saldo==null?'text-slate-400':saldo>0.05?'text-emerald-600':saldo<-0.05?'text-red-600':'text-slate-600';
      const fmt1=(x)=>x.toFixed(1).replace('.',',');
      return `<tr>
        <td class="px-4 py-2.5 font-medium text-slate-800">${esc(s.nome)}</td>
        <td class="px-4 py-2.5 text-center text-slate-600">${s.turnos}</td>
        <td class="px-4 py-2.5 text-center text-slate-600">${fmt1(horas)} h</td>
        <td class="px-4 py-2.5 text-center text-slate-500">${temN?fmt1(esp)+' h':'—'}</td>
        <td class="px-4 py-2.5 text-center font-medium ${saldoCls}">${saldo==null?'—':(saldo>0?'+':'')+fmt1(saldo)+' h'}</td>
        <td class="px-4 py-2.5 text-center text-slate-600">${s.noites}</td>
        <td class="px-4 py-2.5 text-center text-slate-600">${Math.max(0,folgas)}</td>
        <td class="px-4 py-2.5 text-center ${ferias?'text-amber-600 font-medium':'text-slate-400'}">${ferias||'—'}</td>
        <td class="px-4 py-2.5 text-center text-slate-600">${fdsLivres(s.dias)}</td>
      </tr>`;
    }).join('');
    return card(`<div class="print-block">${`<table class="w-full text-sm"><thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-400">
      <tr><th class="px-4 py-3">Trabalhador</th><th class="px-4 py-3 text-center">Turnos</th><th class="px-4 py-3 text-center">Horas</th><th class="px-4 py-3 text-center">Esperado</th><th class="px-4 py-3 text-center">Saldo</th><th class="px-4 py-3 text-center">Noites</th><th class="px-4 py-3 text-center">Folgas</th><th class="px-4 py-3 text-center">Férias</th><th class="px-4 py-3 text-center">FDS livres</th></tr>
      </thead><tbody class="divide-y divide-slate-100">${rows}</tbody></table>`}</div>`,"overflow-hidden");
  }

  // Exportar a escala do mês para Excel (.xlsx): matriz + resumo
  function exportarExcel(escala, membros, turnos, linhas, ausencias){
    ausencias = ausencias || [];
    const XLSX = window.XLSX;
    if(!XLSX){ alert('Biblioteca de Excel não carregou. Verifica a ligação à internet.'); return; }
    const di = new Date(escala.data_inicio+'T00:00:00');
    const ano = di.getFullYear(), mes = di.getMonth();
    const diasNoMes = new Date(ano, mes+1, 0).getDate();
    const tById = Object.fromEntries(turnos.map(t=>[t.id,t]));
    const turnosOrd = [...turnos].sort((a,b)=>a.ordem-b.ordem);
    const abbr = (nome)=> (nome||'').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,3);
    const work = {}; for(const l of linhas){ work[l.membroId+'|'+l.data] = tById[l.turnoId]?.nome || l.turnoNome; }
    const linhasSet = new Set(linhas.map(l=>l.membroId));
    const membrosMostrar = membros.filter(m=>!m.substituto || linhasSet.has(m.id));
    const ausDe = (mid,dstr,tipo)=> ausencias.some(a=> a.membro_id===mid && dstr>=a.data_inicio && dstr<=a.data_fim && (!tipo||a.tipo===tipo));
    const letras = ['D','S','T','Q','Q','S','S'];

    // Folha "Escala": matriz trabalhador x dia
    const h1 = ['Trabalhador'], h2 = [''];
    for(let dia=1;dia<=diasNoMes;dia++){ h1.push(dia); h2.push(letras[new Date(ano,mes,dia).getDay()]); }
    const aoa = [ [escala.nome], [], h1, h2 ];
    for(const m of membrosMostrar){
      const row = [m.trabalhadores?.nome||''];
      for(let dia=1;dia<=diasNoMes;dia++){
        const dstr = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
        const w = work[m.id+'|'+dstr];
        if(w) row.push(abbr(w));
        else if(ausDe(m.id,dstr,'FERIAS')) row.push('FÉR');
        else if(ausDe(m.id,dstr)) row.push('AUS');
        else row.push(''); // folga
      }
      aoa.push(row);
    }
    aoa.push([]); aoa.push(['Legenda:']);
    turnosOrd.forEach(t=> aoa.push([abbr(t.nome)+' = '+t.nome+' ('+t.hora_inicio+'–'+t.hora_fim+')']));
    aoa.push(['FÉR = Férias   |   AUS = Outra ausência   |   (célula vazia) = Folga']);
    const ws1 = XLSX.utils.aoa_to_sheet(aoa);
    ws1['!cols'] = [{wch:20}, ...Array(diasNoMes).fill({wch:4})];

    // Folha "Resumo"
    const res = [['Trabalhador','Turnos','Horas','Contratadas','Saldo','Noites','Folgas','Férias','FDS livres']];
    const contarAus=(mid,tipo)=>{ let c=0; for(let dia=1;dia<=diasNoMes;dia++){ const dstr=`${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`; if(ausencias.some(a=>a.membro_id===mid && (!tipo||a.tipo===tipo) && dstr>=a.data_inicio && dstr<=a.data_fim)) c++; } return c; };
    const fdsLivres=(diasSet)=>{ let c=0; for(let dia=1;dia<=diasNoMes;dia++){ const d=new Date(ano,mes,dia); if(d.getDay()===6){ const sab=fmtDate(d),dom=fmtDate(new Date(ano,mes,dia+1)); if(!diasSet.has(sab)&&!diasSet.has(dom)) c++; } } return c; };
    for(const m of membrosMostrar){
      let min=0, noites=0, turnosN=0; const dias=new Set();
      for(const l of linhas){ if(l.membroId!==m.id) continue; min+=l.duracaoMin; turnosN++; dias.add(l.data); if(tById[l.turnoId]?.noturno) noites++; }
      const horas=min/60, contr=Number(m.horas_contratadas_mes)||0;
      res.push([ m.trabalhadores?.nome||'', turnosN, +horas.toFixed(1), contr||'', contr?+(horas-contr).toFixed(1):'', noites, Math.max(0,diasNoMes-dias.size-contarAus(m.id,null)), contarAus(m.id,'FERIAS'), fdsLivres(dias) ]);
    }
    const ws2 = XLSX.utils.aoa_to_sheet(res);
    ws2['!cols'] = [{wch:20},{wch:8},{wch:8},{wch:12},{wch:8},{wch:8},{wch:8},{wch:8},{wch:10}];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws1, 'Escala');
    XLSX.utils.book_append_sheet(wb, ws2, 'Resumo');
    XLSX.writeFile(wb, `escala_${ano}-${String(mes+1).padStart(2,'0')}.xlsx`);
  }

  async function viewEscalaDetalhe(el, sid, eid, modo){
    const [{data:escala},{data:atr=[]},{data:regrasRaw=[]},{data:membros=[]},{data:turnos=[]},{data:ausencias=[]}] = await Promise.all([
      DB.escala(eid), DB.atribuicoes(eid), DB.regras(sid), DB.membros(sid), DB.turnos(sid), sb.from('ausencias').select('*').eq('servico_id', sid)
    ]);
    if(!escala){ el.innerHTML=empty("Escala não encontrada"); return; }

    const linhas = atr.map(a=>({ id:a.id, data:a.data, turnoId:a.turno_id, turnoNome:a.turnos?.nome||"", turnoCor:a.turnos?.cor||"#999",
      membroId:a.membro_id, membroNome:a.membros?.trabalhadores?.nome||"", duracaoMin:a.turnos?.duracao_min||0 }))
      .sort((x,y)=> x.data.localeCompare(y.data) || x.turnoNome.localeCompare(y.turnoNome));

    const d=new Date(escala.data_inicio);
    const ctx={ ano:d.getFullYear(), mes:d.getMonth()+1, atribuicoes: atr.map(a=>({
      membroId:a.membro_id, membroNome:a.membros?.trabalhadores?.nome||"", data:a.data, turnoId:a.turno_id, turnoNome:a.turnos?.nome||"",
      duracaoMin:a.turnos?.duracao_min||0, noturno:!!a.turnos?.noturno, horaInicio:a.turnos?.hora_inicio||"00:00", atravessaMeiaNoite:!!a.turnos?.atravessa_meia_noite })), linked: linkedTurnos(turnos) };
    const regras = regrasRaw.filter(r=>r.ativa).map(r=>({ tipo:r.tipo, nome:r.nome, categoria:r.categoria, parametros:r.parametros }));
    const violacoes = validarEscala(regras, ctx);
    const erros=violacoes.filter(v=>v.severidade==="ERRO"), avisos=violacoes.filter(v=>v.severidade==="AVISO");
    const totalMin=linhas.reduce((s,l)=>s+l.duracaoMin,0);
    const rascunho = escala.estado==="RASCUNHO";

    // Cobertura completa: verifica cada dia × turno (apanha turnos totalmente vazios)
    const need = (()=>{ const r=regrasRaw.find(x=>x.tipo==='NECESSIDADES_MINIMAS'&&x.ativa); return r?Number(r.parametros?.min_trabalhadores||1):1; })();
    const turnosOrdCov = [...turnos].filter(t=>t.ativo!==false && !t.segue_turno_id).sort((a,b)=>a.ordem-b.ordem);
    const cont={}; for(const l of linhas){ cont[l.data+'|'+l.turnoId]=(cont[l.data+'|'+l.turnoId]||0)+1; }
    const diasPeriodo=[]; { let dd=new Date(escala.data_inicio+'T12:00:00'); const fimD=new Date(escala.data_fim+'T12:00:00'); while(dd<=fimD){ diasPeriodo.push(fmtDate(dd)); dd.setDate(dd.getDate()+1); } }
    const pend=[];
    for(const ds of diasPeriodo){ const dow=new Date(ds+'T12:00:00').getDay(); for(const t of turnosOrdCov){ if(!turnoAtivo(t,dow)) continue; const have=cont[ds+'|'+t.id]||0; if(have<need) pend.push({data:ds, turnoId:t.id, turnoNome:t.nome, turnoCor:t.cor, faltam:need-have}); } }
    const tudoCoberto = pend.length===0;

    // Painel "dias a ajustar" (colocação manual rápida nos lugares em falta)
    let ajusteHtml='';
    if(rascunho && ajustarAberto){
      const ausDia=(mid,ds)=>ausencias.some(a=>a.membro_id===mid&&ds>=a.data_inicio&&ds<=a.data_fim);
      const trabalhaDia=(mid,ds)=>linhas.some(l=>l.membroId===mid&&l.data===ds);
      ajusteHtml = card(`<div class="p-5">
        <div class="mb-3 flex items-center justify-between"><h3 class="text-sm font-semibold text-slate-700">Dias a ajustar${pend.length?` · ${pend.length} lugar(es)`:''}</h3><button id="aj-fechar" class="text-xs font-medium text-slate-400 hover:text-slate-600 no-print">fechar</button></div>
        ${pend.length===0?`<p class="text-sm text-emerald-600">Tudo coberto. Podes validar. ✅</p>`:
        `<div class="space-y-2">${pend.map((p,i)=>{ const cands=membros.filter(m=>!ausDia(m.id,p.data)&&!trabalhaDia(m.id,p.data)); return `<div class="flex flex-wrap items-center gap-2 rounded-lg border border-amber-200 bg-amber-50/50 px-3 py-2 text-sm">
          <span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-full" style="background:${esc(p.turnoCor)}"></span><b>${esc(p.data)}</b> · ${esc(p.turnoNome)}</span>
          <span class="text-xs text-amber-600">faltam ${p.faltam}</span>
          <span class="ml-auto flex items-center gap-2 no-print">
            <select data-aj-membro="${i}" class="rounded-md border border-slate-300 px-2 py-1 text-sm">${cands.length?cands.map(m=>`<option value="${m.id}">${esc(m.trabalhadores?.nome||'')}${m.substituto?' (subst.)':''}</option>`).join(''):'<option value="">— ninguém livre —</option>'}</select>
            <button data-aj-colocar="${i}" data-data="${p.data}" data-turno="${p.turnoId}" class="rounded-md bg-indigo-600 px-2.5 py-1 text-xs font-medium text-white hover:bg-indigo-700">colocar</button>
          </span></div>`; }).join('')}</div>`}
      </div>`,"mb-6");

    const transicoes=[];

    const modoVista = (modo==='calendario') ? 'calendario' : 'lista';
    const tipoToneEx = { FERIAS:'sky', DOENCA:'amber', BAIXA:'red', OUTRA:'slate' };
    const nomeMembro = (mid)=> (membros.find(m=>m.id===mid)?.trabalhadores?.nome)||'';
    const ausOverlap = ausencias.filter(a=> !(a.data_fim < escala.data_inicio || a.data_inicio > escala.data_fim));
    const exHtml = card(`<div class="p-5">
      <h3 class="mb-3 text-sm font-semibold text-slate-700">Exceções / ausências neste período</h3>

        ${violacoes.length===0?`<p class="text-sm text-slate-400">A escala cumpre todas as regras ativas.</p>`:
          `<ul class="space-y-1.5">${violacoes.map(v=>`<li class="flex items-start gap-2 text-sm"><span class="${v.severidade==="ERRO"?'text-red-500':'text-amber-500'}">●</span>
          <span class="text-slate-600"><span class="font-medium text-slate-700">${esc(v.regra)}</span>${v.membroNome?" · "+esc(v.membroNome):""} — ${esc(v.mensagem)}</span></li>`).join("")}</ul>`}
        ${rascunho && (erros.length>0 || !tudoCoberto)?`<div class="mt-3 flex flex-wrap items-center gap-2 no-print">${erros.length>0?`<button id="btn-corrigir" class="${btnPrimary}">🔧 Corrigir automaticamente</button>`:''}${!tudoCoberto?`<button id="btn-ajustar2" class="${btnGhost}">📋 Ajustar dias em falta (${pend.length})</button>`:''}<span class="text-xs text-red-500">${!tudoCoberto?`Há ${pend.length} lugar(es) por cobrir. `:''}${erros.length>0?'Resolve os erros para poder validar.':''}</span></div>`:""}
        ${rascunho && tudoCoberto && erros.length===0 && linhas.length>0?`<p class="mt-3 text-sm text-emerald-600 no-print">Tudo coberto e sem erros — podes validar. ✅</p>`:''}
      </div>`,"mb-6")}
      ${ajusteHtml}
      ${exHtml}
      ${toggle}
      ${corpo}`;

    const gerarBtn = document.getElementById('btn-gerar');
    if(gerarBtn) gerarBtn.addEventListener('click', async ()=>{
      if(linhas.length>0 && !confirm('Isto substitui as atribuições atuais desta escala por uma nova geração automática. Continuar?')) return;
      gerarBtn.disabled=true; gerarBtn.textContent='A gerar…';
      try {
        const res = await gerarEscalaAuto(sid, eid, escala);
        if(res && res.uncovered>0) alert(`Escala gerada com ${res.total} turnos. ${res.uncovered} lugar(es) ficaram por cobrir sem quebrar regras — vê o painel de validação.`);
      } catch(e){ alert('Erro ao gerar: '+(e.message||e)); }
      renderApp();
    });

    const pbtn = document.getElementById('btn-print');
    if(pbtn) pbtn.addEventListener('click', ()=> imprimirCom('landscape'));
    const corrBtn = document.getElementById('btn-corrigir');
    if(corrBtn) corrBtn.addEventListener('click', async ()=>{
      corrBtn.disabled=true; corrBtn.textContent='A corrigir…';
      try {
        const res = await corrigirEscala(sid, eid, escala);
        if(res && res.erros>0) alert(`Melhorei o que era possível, mas ainda restam ${res.erros} erro(s). Com poucos trabalhadores pode ser impossível dar fim de semana completo a todos — considera adicionar um trabalhador substituto ou rever as regras.`);
      } catch(e){ alert('Erro ao corrigir: '+(e.message||e)); }
      renderApp();
    });

    const ajBtn = document.getElementById('btn-ajustar');
    if(ajBtn) ajBtn.addEventListener('click', ()=>{ ajustarAberto=!ajustarAberto; renderApp(); });
    const ajBtn2 = document.getElementById('btn-ajustar2');
    if(ajBtn2) ajBtn2.addEventListener('click', ()=>{ ajustarAberto=true; renderApp(); });
    const ajFechar = document.getElementById('aj-fechar');
    if(ajFechar) ajFechar.addEventListener('click', ()=>{ ajustarAberto=false; renderApp(); });
    el.querySelectorAll('[data-aj-colocar]').forEach(b=>b.addEventListener('click', async ()=>{
      const i=b.dataset.ajColocar; const sel=el.querySelector(`[data-aj-membro="${i}"]`); const membro_id=sel?sel.value:'';
      if(!membro_id) return alert('Não há ninguém livre para este turno neste dia. Coloca um substituto, ou liberta alguém de outro turno.');
      const { error } = await sb.from('atribuicoes').insert({ servico_id:sid, escala_id:eid, membro_id, turno_id:b.dataset.turno, data:b.dataset.data, estado:'PLANEADO' });
      if(error) return alert(error.message);
      renderApp();
    }));

    const valBtn = document.getElementById('btn-validar');
    if(valBtn) valBtn.addEventListener('click', async ()=>{
      if(!tudoCoberto){ alert(`Ainda há ${pend.length} lugar(es) por cobrir. Vou abrir os dias a ajustar para preencheres.`); ajustarAberto=true; renderApp(); return; }
      if(erros.length>0){ alert(`Ainda há ${erros.length} erro(s) de regra. Usa "Corrigir automaticamente" ou ajusta à mão antes de validar.`); return; }
      valBtn.disabled=true; valBtn.textContent='A validar…';
      await recontabilizar(sid, eid, escala, linhas, membros);
      await sb.from('escalas').update({ estado:'VALIDADA' }).eq('id', eid);
      await sb.from('eventos_historico').insert({ servico_id:sid, entidade:'ESCALA', entidade_id:eid, acao:'ESTADO_VALIDADA' });
      ajustarAberto=false; renderApp();
    });
    const xbtn = document.getElementById('btn-excel');
    if(xbtn) xbtn.addEventListener('click', ()=> exportarExcel(escala, membros, turnos, linhas, ausencias));
    const dbtn = document.getElementById('btn-del-escala');
    if(dbtn) dbtn.addEventListener('click', async ()=>{
      if(!confirm(`Eliminar a escala "${escala.nome}" e todas as suas atribuições?\n\nEsta ação é permanente e não pode ser anulada.`)) return;
      await sb.from('atribuicoes').delete().eq('escala_id', eid);
      const { error } = await sb.from('escalas').delete().eq('id', eid);
      if(error) return alert(error.message);
      location.hash = `#/servico/${sid}/escalas`;
    });

    const exAdd = document.getElementById('ex-add');
    if(exAdd) exAdd.addEventListener('click', async ()=>{
      const membro_id=document.getElementById('ex-membro').value, tipo=document.getElementById('ex-tipo').value;
      const di=document.getElementById('ex-ini').value, df=document.getElementById('ex-fim').value;
      const motivo=document.getElementById('ex-motivo').value.trim()||null;
      if(!membro_id||!di||!df) return;
      if(df<di) return alert('A data de fim não pode ser anterior à de início.');
      const { error } = await sb.from('ausencias').insert({ servico_id:sid, membro_id, tipo, data_inicio:di, data_fim:df, motivo });
      if(error) return alert(error.message);
      await sb.from('atribuicoes').delete().eq('escala_id', eid).eq('membro_id', membro_id).gte('data', di).lte('data', df);
      renderApp();
    });
    el.querySelectorAll('[data-del-ex]').forEach(b=>b.addEventListener('click', async ()=>{
      await sb.from('ausencias').delete().eq('id', b.dataset.delEx); renderApp();
    }));

    el.querySelectorAll('[data-estado]').forEach(b=>b.addEventListener('click', async ()=>{
      await sb.from('escalas').update({ estado:b.dataset.estado }).eq('id', eid);
      await sb.from('eventos_historico').insert({ servico_id:sid, entidade:"ESCALA", entidade_id:eid, acao:"ESTADO_"+b.dataset.estado });
      renderApp();
    }));
    const addBtn=document.getElementById('a-add');
    if(addBtn) addBtn.addEventListener('click', async ()=>{
      const data=document.getElementById('a-data').value, turno_id=document.getElementById('a-turno').value, membro_id=document.getElementById('a-membro').value;
      if(!data||!turno_id||!membro_id) return;
      const { error } = await comRetry(()=> sb.from('atribuicoes').insert({ servico_id:sid, escala_id:eid, membro_id, turno_id, data, estado:"PLANEADO" }));
      if(error) return alert(error.message);
      const ligados = turnos.filter(t=>t.segue_turno_id===turno_id && turnoAtivo(t, new Date(data+'T12:00:00').getDay()));
      for(const L of ligados){ await comRetry(()=> sb.from('atribuicoes').insert({ servico_id:sid, escala_id:eid, membro_id, turno_id:L.id, data, estado:"PLANEADO" })); }
      renderApp();
    });
    el.querySelectorAll('[data-dela]').forEach(b=>b.addEventListener('click', async ()=>{
      await sb.from('atribuicoes').delete().eq('id', b.dataset.dela); renderApp();
    }));
  }

  // =====================================================================
  //  Arranque
  // =====================================================================
  sb.auth.onAuthStateChange((_e, session)=>{ state.session=session; state.user=session?.user||null; renderApp(); });
  window.addEventListener('hashchange', ()=>{ if(state.session) renderApp(); });
  (async ()=>{ const { data:{ session } } = await sb.auth.getSession(); state.session=session; state.user=session?.user||null; renderApp(); })();
  </script>
</body>
</html>
