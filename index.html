/* ---------------------------------------------------------------- leitura de ficheiros CSV e Excel */
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function carregarScript(src) {
  return new Promise((ok, falha) => {
    if (window.XLSX) return ok();
    const s = document.createElement('script'); s.src = src; s.onload = ok;
    s.onerror = () => falha(new Error('Não foi possível carregar o leitor de Excel. Verifique a ligação ou use CSV.'));
    document.head.appendChild(s);
  });
}
function lerCSV(texto) {
  texto = texto.replace(/^﻿/, '');
  const prim = texto.split(/\r?\n/)[0] || '';
  const sep = (prim.match(/;/g) || []).length >= (prim.match(/,/g) || []).length ? ';' : ',';
  const linhas = []; let campo = '', linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (aspas) { if (ch === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += ch; }
    else if (ch === '"') aspas = true;
    else if (ch === sep) { linha.push(campo); campo = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && texto[i + 1] === '\n') i++; linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else campo += ch;
  }
  if (campo !== '' || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(x => String(x).trim() !== ''));
}
async function lerFicheiroTabela(f) {
  if (/\.xlsx?$/i.test(f.name)) {
    await carregarScript(XLSX_URL);
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }).filter(l => l.some(x => String(x).trim() !== ''));
  }
  const bytes = new Uint8Array(await f.arrayBuffer());
  let texto = new TextDecoder('utf-8').decode(bytes);
  if (texto.includes('�')) texto = new TextDecoder('windows-1252').decode(bytes);  // CSV gravado pelo Excel em Windows
  return lerCSV(texto);
}

/* ---------------------------------------------------------------- conversão de valores */
const chaveTexto = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
const txt = v => { const s = String(v ?? '').trim(); return s === '' ? null : s; };
function enumDe(dic, v, sinonimos = {}) {
  const k = chaveTexto(v); if (!k) return null;
  if (sinonimos[k]) return sinonimos[k];
  return Object.keys(dic).find(x => chaveTexto(x) === k || chaveTexto(dic[x]) === k) || null;
}
function dataDe(v) {
  if (v == null || String(v).trim() === '') return { v: null };
  if (typeof v === 'number') return v > 20000 && v < 80000 ? { v: new Date(Math.round((v - 25569) * 864e5)).toISOString().substring(0, 10) } : { erro: true };
  const s = String(v).trim();
  const confirma = iso => { const d = new Date(iso + 'T00:00:00Z'); return Number.isNaN(d.getTime()) || d.toISOString().substring(0, 10) !== iso ? { erro: true } : { v: iso }; };
  let m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/);
  if (m) return confirma(`${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? confirma(m[0]) : { erro: true };
}
function numDe(v) {
  if (v == null || String(v).trim() === '') return { v: null };
  if (typeof v === 'number') return { v };
  const x = Number(String(v).trim().replace(/\s/g, '').replace(',', '.'));
  return Number.isNaN(x) ? { erro: true } : { v: x };
}
function intDe(v) {
  if (v == null || String(v).trim() === '') return { v: null };
  if (typeof v === 'number') return Number.isInteger(v) ? { v } : { erro: true };
  const s = String(v).trim().replace(/\s/g, '');
  const limpo = /^\d{1,3}(\.\d{3})+$/.test(s) ? s.replace(/\./g, '') : s;   // 1.234 = mil duzentos e trinta e quatro
  return /^-?\d+$/.test(limpo) ? { v: Number(limpo) } : { erro: true };
}
function boolDe(v) {
  const k = chaveTexto(v);
  if (!k) return { v: null };
  if (['sim', 's', 'true', '1', 'x', 'verdadeiro'].includes(k)) return { v: true };
  if (['nao', 'n', 'false', '0', 'falso'].includes(k)) return { v: false };
  return { erro: true };
}
const limparNulos = o => Object.fromEntries(Object.entries(o).filter(([, v]) => v != null));
const chaveSerie = s => [s.unidade_id, s.ano, s.grupo_etario, s.sexo, s.tipo_valor, s.fonte_id].join('|');

/* ---------------------------------------------------------------- definição das importações */
const IMPORTACOES = {
  instalacao: {
    titulo: 'Instalações', tabela: 'instalacao', obrigatorias: ['designacao', 'natureza'],
    colunas: [
      ['codigo', 'Vazio = código automático (INST-0001…).'], ['designacao', 'Obrigatório.'],
      ['natureza', 'Obrigatório: ' + Object.values(ROT.natureza).join(', ') + '.'],
      ['tipologia', 'Código ou nome de uma tipologia registada em Catálogos.'],
      ['freguesia', 'Nome ou código DICOFRE. Só é usada quando não há coordenadas; com coordenadas, a freguesia é atribuída pelos limites.'],
      ['morada', ''], ['codigo_postal', 'Formato 0000-000.'],
      ['latitude', 'Graus decimais, ex.: 41,5123.'], ['longitude', 'Graus decimais, ex.: -7,9876.'],
      ['estado_operacional', Object.values(ROT.operacional).join(', ') + '. Vazio = Em funcionamento.'],
      ['proprietario', 'Código, NIF ou nome de uma entidade registada; outro texto fica guardado como texto.'],
      ['gestor', 'Igual ao proprietário.'], ['data_recolha', 'dd/mm/aaaa.'], ['observacoes', ''],
    ],
    exemplo: ['', 'Pavilhão Municipal', 'Pública municipal', 'PAV', '', 'Rua do Exemplo, 1', '4860-000', '41,5123', '-7,9876', 'Em funcionamento', '', '', '01/10/2026', ''],
    converter(o, x) {
      const e = [], d = { estado_dado: 'nao_verificado', fonte_id: x.fonte };
      d.designacao = txt(o.designacao); if (!d.designacao) e.push('Designação em falta.');
      d.natureza = enumDe(ROT.natureza, o.natureza, { publica: 'publica_municipal', municipal: 'publica_municipal' });
      if (!d.natureza) e.push(txt(o.natureza) ? `Natureza desconhecida: «${txt(o.natureza)}».` : 'Natureza em falta.');
      d.codigo = txt(o.codigo) || x.codigo('INST');
      if (txt(o.tipologia)) { const t = x.tip.get(chaveTexto(o.tipologia)); if (t) d.tipologia_id = t.id; else e.push(`Tipologia não encontrada: «${txt(o.tipologia)}».`); }
      const la = numDe(o.latitude), lo = numDe(o.longitude);
      if (la.erro || lo.erro) e.push('Coordenadas com formato inválido.');
      else if ((la.v == null) !== (lo.v == null)) e.push('Indique a latitude e a longitude, ou nenhuma.');
      else if (la.v != null) {
        if (la.v < 29 || la.v > 43 || lo.v < -32 || lo.v > -6) e.push('Coordenadas fora de Portugal (confirme se a latitude e a longitude estão trocadas).');
        else d.localizacao = ewkt([la.v, lo.v]);
      }
      if (txt(o.freguesia) && !d.localizacao) {
        const f = x.freg.get(chaveTexto(o.freguesia));
        if (f) Object.assign(d, { freguesia_id: f.id, freguesia_manual: true, freguesia_justificacao: 'Indicada no ficheiro de importação.' });
        else e.push(`Freguesia não encontrada: «${txt(o.freguesia)}».`);
      }
      d.morada = txt(o.morada);
      d.codigo_postal = txt(o.codigo_postal);
      if (d.codigo_postal && !/^\d{4}-\d{3}$/.test(d.codigo_postal)) e.push('Código postal deve ter o formato 0000-000.');
      if (txt(o.estado_operacional)) { d.estado_operacional = enumDe(ROT.operacional, o.estado_operacional); if (!d.estado_operacional) e.push(`Estado operacional desconhecido: «${txt(o.estado_operacional)}».`); }
      for (const [col, id, texto] of [['proprietario', 'proprietario_entidade_id', 'proprietario_texto'], ['gestor', 'gestor_entidade_id', 'gestor_texto']]) {
        const v = txt(o[col]); if (!v) continue;
        const en = x.ent.get(chaveTexto(v)) || x.entNif.get(v.replace(/\s/g, ''));
        if (en) d[id] = en.id; else d[texto] = v;
      }
      const dr = dataDe(o.data_recolha); if (dr.erro) e.push('Data de recolha inválida (use dd/mm/aaaa).'); else d.data_recolha = dr.v;
      d.observacoes = txt(o.observacoes);
      return { dados: d, erros: e, dup: x.codInst.has(chaveTexto(d.codigo)) ? `Já existe uma instalação com o código ${d.codigo}.` : null, chaves: [chaveTexto(d.codigo)], rotulo: `${d.codigo} · ${d.designacao || '—'}` };
    },
  },
  entidade: {
    titulo: 'Entidades', tabela: 'entidade', obrigatorias: ['nome', 'tipo'],
    colunas: [
      ['codigo', 'Vazio = código automático (ENT-0001…).'], ['nome', 'Obrigatório.'], ['nif', '9 algarismos.'],
      ['tipo', 'Obrigatório: ' + Object.values(ROT.tipo_entidade).join(', ') + '.'],
      ['freguesia', 'Freguesia da sede: nome ou código DICOFRE.'], ['ativa', 'Sim ou Não. Vazio = Sim.'],
      ['id_externo', 'Referência noutra aplicação municipal.'], ['data_recolha', 'dd/mm/aaaa.'], ['observacoes', ''],
    ],
    exemplo: ['', 'Clube Desportivo de Exemplo', '500000000', 'Clube', '', 'Sim', '', '01/10/2026', ''],
    converter(o, x) {
      const e = [], d = { estado_dado: 'nao_verificado', fonte_id: x.fonte };
      d.nome = txt(o.nome); if (!d.nome) e.push('Nome em falta.');
      d.tipo = enumDe(ROT.tipo_entidade, o.tipo, { associacao_desportiva: 'associacao', clube_desportivo: 'clube' });
      if (!d.tipo) e.push(txt(o.tipo) ? `Tipo desconhecido: «${txt(o.tipo)}».` : 'Tipo em falta.');
      const nif = txt(o.nif)?.replace(/\s/g, '');
      if (nif) { if (/^\d{9}$/.test(nif)) d.nif = nif; else e.push('O NIF deve ter 9 algarismos.'); }
      d.codigo = txt(o.codigo) || x.codigo('ENT');
      if (txt(o.freguesia)) { const f = x.freg.get(chaveTexto(o.freguesia)); if (f) d.freguesia_id = f.id; else e.push(`Freguesia não encontrada: «${txt(o.freguesia)}».`); }
      const at = boolDe(o.ativa); if (at.erro) e.push('Ativa: use Sim ou Não.'); else d.ativa = at.v ?? true;
      d.id_externo = txt(o.id_externo);
      const dr = dataDe(o.data_recolha); if (dr.erro) e.push('Data de recolha inválida (use dd/mm/aaaa).'); else d.data_recolha = dr.v;
      d.observacoes = txt(o.observacoes);
      const dup = d.nif && x.entNif.has(d.nif) ? `Já existe uma entidade com o NIF ${d.nif}.` : x.codEnt.has(chaveTexto(d.codigo)) ? `Já existe uma entidade com o código ${d.codigo}.` : null;
      return { dados: d, erros: e, dup, chaves: [d.nif ? 'nif:' + d.nif : null, 'cod:' + chaveTexto(d.codigo)], rotulo: `${d.codigo} · ${d.nome || '—'}` };
    },
  },
  serie_populacional: {
    titulo: 'População', tabela: 'serie_populacional', obrigatorias: ['unidade', 'ano', 'valor', 'tipo_valor'], fonteObrigatoria: true,
    colunas: [
      ['unidade', 'Obrigatório: nome ou código oficial de uma unidade registada em Território (freguesia, município…).'],
      ['ano', 'Obrigatório.'], ['valor', 'Obrigatório: número de residentes.'],
      ['tipo_valor', 'Obrigatório: ' + Object.values(ROT2.tipo_valor).join(', ') + '.'],
      ['grupo_etario', 'Vazio ou "total" = todas as idades; ex.: 0-14.'], ['sexo', 'Total, Masculino ou Feminino. Vazio = Total.'],
      ['data_referencia', 'dd/mm/aaaa (ex.: momento censitário).'], ['notas_metodologicas', ''],
    ],
    exemplo: ['Refojos de Basto', '2021', '3200', 'Censos', 'total', 'Total', '19/04/2021', 'Valor de exemplo'],
    converter(o, x) {
      const e = [], d = { estado_dado: 'nao_verificado', fonte_id: x.fonte };
      const u = x.unid.get(chaveTexto(o.unidade));
      if (u) d.unidade_id = u.id; else e.push(txt(o.unidade) ? `Unidade não encontrada: «${txt(o.unidade)}».` : 'Unidade em falta.');
      const ano = intDe(o.ano); if (ano.erro || ano.v == null || ano.v < 1900 || ano.v > 2100) e.push('Ano inválido.'); else d.ano = ano.v;
      const val = intDe(o.valor); if (val.erro || val.v == null || val.v < 0) e.push('Valor inválido: indique um número inteiro.'); else d.valor = val.v;
      d.tipo_valor = enumDe(ROT2.tipo_valor, o.tipo_valor, { estimativa: 'estimativa_oficial', estimativas: 'estimativa_oficial', censo: 'censo', censos_2021: 'censo' });
      if (!d.tipo_valor) e.push(txt(o.tipo_valor) ? `Tipo de valor desconhecido: «${txt(o.tipo_valor)}».` : 'Tipo de valor em falta.');
      d.grupo_etario = !txt(o.grupo_etario) || chaveTexto(o.grupo_etario) === 'total' ? 'total' : txt(o.grupo_etario);
      d.sexo = txt(o.sexo) ? enumDe(ROT2.sexo, o.sexo, { m: 'masculino', h: 'masculino', homens: 'masculino', f: 'feminino', mulheres: 'feminino', hm: 'total', ambos: 'total', t: 'total' }) : 'total';
      if (!d.sexo) e.push(`Sexo desconhecido: «${txt(o.sexo)}».`);
      const dr = dataDe(o.data_referencia); if (dr.erro) e.push('Data de referência inválida (use dd/mm/aaaa).'); else d.data_referencia = dr.v;
      d.notas_metodologicas = txt(o.notas_metodologicas);
      const k = chaveSerie(d);
      return { dados: d, erros: e, dup: x.series.has(k) ? 'Já existe este valor (mesma unidade, ano, desagregação, tipo e fonte).' : null, chaves: [k], rotulo: `${u?.nome || txt(o.unidade) || '—'} · ${d.ano ?? '?'} · ${d.valor != null ? fmtNum(d.valor) : '?'}` };
    },
  },
};

async function contextoImportacao(tipo, fonte) {
  const c = S.cache, m = S.municipio.id;
  const mapa = (lista, campos) => { const r = new Map(); for (const x of lista) for (const k of campos) { const v = chaveTexto(x[k]); if (v && !r.has(v)) r.set(v, x); } return r; };
  const unidades = c.unidades.filter(u => !u.eliminado_em).sort((a, b) => emVigor(b) - emVigor(a));
  const ents = await dados(sb.from('entidade').select('id,codigo,nome,nif').eq('municipio_id', m).is('eliminado_em', null));
  const x = {
    fonte, freg: mapa(c.freguesias.filter(emVigor), ['codigo_oficial', 'nome']), unid: mapa(unidades, ['codigo_oficial', 'nome']),
    tip: mapa(c.tipologias.filter(t => t.ativa), ['codigo', 'nome']), ent: mapa(ents, ['codigo', 'nome']),
    entNif: new Map(ents.filter(e => e.nif).map(e => [e.nif, e])), codEnt: new Set(c.entidades.map(e => chaveTexto(e.codigo))),
    codInst: new Set(), series: new Set(),
  };
  const usados = { ENT: c.entidades.map(e => e.codigo), INST: [] };
  if (tipo === 'instalacao') { const r = await dados(sb.from('instalacao').select('codigo').eq('municipio_id', m)); usados.INST = r.map(i => i.codigo); x.codInst = new Set(r.map(i => chaveTexto(i.codigo))); }
  if (tipo === 'serie_populacional') { const r = await dados(sb.from('serie_populacional').select('unidade_id,ano,grupo_etario,sexo,tipo_valor,fonte_id').eq('municipio_id', m).is('eliminado_em', null)); x.series = new Set(r.map(chaveSerie)); }
  const proximo = {};
  x.codigo = prefixo => { if (!(prefixo in proximo)) proximo[prefixo] = +proximoCodigo(usados[prefixo] || [], prefixo).split('-')[1]; return `${prefixo}-${String(proximo[prefixo]++).padStart(4, '0')}`; };
  return x;
}

  await carregarCache(true);

      <div id="i-previa"></div>
    </section>
    <section class="cartao" id="i-hist"><div class="carregar">A carregar…</div></section>`;
  const def = () => IMPORTACOES[tipo];
  const mostrarColunas = () => {
    $('#i-fonte-ajuda', el).textContent = def().fonteObrigatoria ? 'Obrigatória para este tipo de dados.' : 'Recomendada: fica associada a todas as linhas.';
    $('#i-colunas', el).innerHTML = `<h3>Colunas do ficheiro</h3><p class="suave ajuda" style="margin-top:0">A primeira linha tem os nomes das colunas, como no modelo. A ordem não importa e as colunas a mais são ignoradas.</p>
      <div class="tabela-envolta"><table class="tabela resp"><thead><tr><th>Coluna</th><th>Conteúdo</th></tr></thead><tbody>${def().colunas.map(([k, a]) => `<tr><td class="cod titulo" data-l="Coluna">${k}${def().obrigatorias.includes(k) ? ' <span class="obrig">*</span>' : ''}</td><td data-l="Conteúdo">${esc(a)}</td></tr>`).join('')}</tbody></table></div>
      <p style="margin:10px 0 0"><button class="btn btn-peq" type="button" id="i-modelo">Descarregar modelo (CSV)</button></p>`;
    $('#i-modelo', el).onclick = () => descarregar(`modelo_${tipo}.csv`, csv([def().exemplo], def().colunas.map(([k], i) => [k, l => l[i]])));
  };
  const analisar = async () => {
    const prev = $('#i-previa', el);
    prev.innerHTML = '<div class="carregar">A ler o ficheiro…</div>';
    try {
      const linhas = await lerFicheiroTabela(ficheiro);
      if (linhas.length < 2) throw new Error('O ficheiro não tem linhas de dados.');
      const cab = linhas[0].map(chaveTexto), conhecidas = def().colunas.map(([k]) => k);
      const idx = Object.fromEntries(conhecidas.map(k => [k, cab.indexOf(k)]));
      const faltam = def().obrigatorias.filter(k => idx[k] < 0);
      if (faltam.length) throw new Error(`Faltam colunas obrigatórias: ${faltam.join(', ')}. Use o modelo como base.`);
      const ignoradas = linhas[0].filter((h, i) => String(h).trim() !== '' && !conhecidas.includes(cab[i]));
      const fonte = $('#i-fonte', el).value || null;
      const x = await contextoImportacao(tipo, fonte);
      const vistas = new Set();
      const res = linhas.slice(1).map((l, i) => {
        const o = Object.fromEntries(conhecidas.map(k => [k, idx[k] >= 0 ? l[idx[k]] : '']));
        const r = def().converter(o, x);
        r.linha = i + 2;
        if (r.erros.length) r.estado = 'erro';
        else if (r.dup) r.estado = 'duplicado';
        else if (r.chaves.some(k => k && vistas.has(k))) { r.estado = 'duplicado'; r.dup = 'Repete outra linha deste ficheiro.'; }
        else r.estado = 'ok';
        if (r.estado !== 'erro') r.chaves.forEach(k => k && vistas.add(k));
        r.dados = limparNulos(r.dados);
        return r;
      });
      analise = { res, tabela: def().tabela, fonte };
      const n = k => res.filter(r => r.estado === k).length;
      const semFonte = def().fonteObrigatoria && !fonte;
      const ordem = [...res.filter(r => r.estado !== 'ok'), ...res.filter(r => r.estado === 'ok')];
      prev.innerHTML = `<div class="numeros tres" style="margin-top:14px">
          <div class="numero"><b>${fmtNum(n('ok'))}</b><span>Linhas válidas</span></div>
          <div class="numero"><b>${fmtNum(n('erro'))}</b><span>Com erros</span></div>
          <div class="numero"><b>${fmtNum(n('duplicado'))}</b><span>Repetidas</span></div></div>
        ${ignoradas.length ? `<p class="nota aviso">Colunas ignoradas: ${esc(ignoradas.join(', '))}.</p>` : ''}
        ${semFonte ? '<p class="nota aviso">Escolha a fonte dos dados (passo 1) antes de importar.</p>' : ''}
        <div class="tabela-envolta"><table class="tabela resp"><thead><tr><th class="num">Linha</th><th>Registo</th><th>Situação</th></tr></thead><tbody>

        </tbody></table></div>
        ${res.length > 200 ? `<p class="suave ajuda">A mostrar 200 de ${fmtNum(res.length)} linhas, primeiro as que têm problemas.</p>` : ''}
        <div class="barra-gravar"><span class="estado-grav">${esc(ficheiro.name)}</span><button class="btn btn-prim" type="button" id="i-gravar"${n('ok') && !semFonte ? '' : ' disabled'}>Importar ${n('ok') === 1 ? '1 linha válida' : `${fmtNum(n('ok'))} linhas válidas`}</button></div>`;
      $('#i-gravar', prev).onclick = gravar;
    } catch (e) { analise = null; prev.innerHTML = `<p class="erros">${esc(e.message || msgErro(e))}</p>`; }
  };
  const gravar = async ev => {

    const { res, tabela, fonte } = analise, m = S.municipio.id;
    const validas = res.filter(r => r.estado === 'ok'), erradas = res.filter(r => r.estado === 'erro'), repetidas = res.filter(r => r.estado === 'duplicado');
    try {
      const imp = await dados(sb.from('importacao').insert({ municipio_id: m, tipo_dados: tabela, nome_ficheiro: ficheiro.name, fonte_id: fonte, linhas_lidas: res.length }).select('id').single());
      const caminho = `${m}/importacao/${imp.id}/${nomeSeguro(ficheiro.name)}`;
      const up = await sb.storage.from('anexos').upload(caminho, ficheiro, { upsert: false, contentType: ficheiro.type || 'application/octet-stream' });
      const problemas = [...erradas.map(r => ({ linha: r.linha, mensagem: r.erros.join(' '), gravidade: 'erro' })), ...repetidas.map(r => ({ linha: r.linha, mensagem: r.dup, gravidade: 'duplicado' }))];
      for (let i = 0; i < problemas.length; i += 500) await dados(sb.from('importacao_erro').insert(problemas.slice(i, i + 500).map(p => ({ ...p, municipio_id: m, importacao_id: imp.id }))));
      let aceites = 0, rejeitadas = 0;
      for (let i = 0; i < validas.length; i += 200) {
        b.textContent = `A gravar ${fmtNum(Math.min(i + 200, validas.length))} de ${fmtNum(validas.length)}…`;
        const r = await dados(sb.rpc('importar_linhas', { p_importacao: imp.id, p_tabela: tabela, p_linhas: validas.slice(i, i + 200).map(v => ({ linha: v.linha, dados: v.dados })) }));
        aceites += r.aceites; rejeitadas += r.rejeitadas;
      }
      const res2 = await dados(sb.from('importacao').update({ linhas_aceites: aceites, linhas_rejeitadas: rejeitadas + erradas.length, linhas_duplicadas: repetidas.length, estado: aceites ? 'aplicada' : 'com_erros', caminho_storage: up.error ? null : caminho }).eq('id', imp.id).select('id'));
      if (!res2.length) throw semPermissao();
      invalidarCache();
      const falhas = rejeitadas + erradas.length + repetidas.length;
      $('#i-previa', el).innerHTML = `<div class="nota" style="margin-top:14px"><strong>${fmtNum(aceites)} registos gravados.</strong> ${falhas ? `${fmtNum(rejeitadas + erradas.length)} linhas com erros e ${fmtNum(repetidas.length)} repetidas ficaram de fora; veja o relatório em "Importações anteriores".` : 'Todas as linhas foram gravadas.'}</div>`;
      aviso(`${aceites} registos importados.`);
      historicoImportacoes($('#i-hist', el));
    } catch (e) { aviso(msgErro(e), 'erro'); b.disabled = false; b.textContent = 'Tentar de novo'; }
  };
  mostrarColunas();
  $('#i-tipo', el).onchange = ev => { tipo = ev.target.value; ficheiro = null; analise = null; $('#i-fich', el).value = ''; $('#i-nome', el).textContent = ''; $('#i-previa', el).innerHTML = ''; mostrarColunas(); };
  $('#i-fonte', el).onchange = () => { if (ficheiro) analisar(); };
  $('#i-fich', el).onchange = ev => { ficheiro = ev.target.files[0] || null; $('#i-nome', el).textContent = ficheiro ? ficheiro.name : ''; if (ficheiro) analisar(); };
  historicoImportacoes($('#i-hist', el)).catch(e => { $('#i-hist', el).innerHTML = `<p class="erros">${esc(msgErro(e))}</p>`; });
}

          ${imp.estado === 'em_validacao' ? '<p class="nota aviso">Esta importação não terminou (por exemplo, a ligação caiu). Confirme na lista quais registos foram gravados antes de repetir.</p>' : ''}
          ${erros.length ? `<p><button type="button" class="btn btn-peq" id="rel-csv">Descarregar relatório (CSV)</button></p><div class="tabela-envolta"><table class="tabela resp"><thead><tr><th class="num">Linha</th><th>Situação</th><th>Mensagem</th></tr></thead><tbody>
            ${erros.map(e => `<tr><td class="num" data-l="Linha">${e.linha}</td><td data-l="Situação">${rot[e.gravidade] || e.gravidade}</td><td data-l="Mensagem">${esc(e.mensagem)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="vazio">Sem erros.</p>'}`,
        aoAbrir: w => { const b = $('#rel-csv', w); if (b) b.onclick = () => descarregar(`relatorio_${nomeSeguro(imp.nome_ficheiro)}.csv`, csv(erros, [['Linha', e => e.linha], ['Situação', e => rot[e.gravidade] || e.gravidade], ['Mensagem', e => e.mensagem]])); },
      });
    } catch (e) { aviso(msgErro(e), 'erro'); }
  };
}

/* ---------------------------------------------------------------- utilizadores */
function gerarPalavraPasse(n = 14) {
  const car = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  const v = crypto.getRandomValues(new Uint32Array(n));
  return [...v].map(x => car[x % car.length]).join('');
}

  if (!pode.admin()) { el.innerHTML = '<div class="cartao vazio">Só o administrador do município gere os utilizadores.</div>'; return; }

        <td data-l="Email">${esc(p.email || '')}</td><td data-l="Função">${esc(ROT.funcao[p.funcao])}</td><td data-l="Acesso">${p.ativo ? 'Ativo' : 'Sem acesso'}</td></tr>`).join('')}
    </tbody></table></div>`;
  $('#novo-ut', el).onclick = async () => {
    const campos = [
      { n: 'email', r: 'Email', t: 'email', obrig: true, larg: 'inteira' }, { n: 'nome', r: 'Nome', larg: 'inteira' },
      { n: 'funcao', r: 'Função', t: 'select', vazio: false, ops: ops(ROT.funcao), padrao: 'editor' },

        if (erros.length) throw { message: erros.join('\n') };
        const { data, error } = await sb.functions.invoke('gerir-utilizador', { body: { municipio_id: S.municipio.id, email: d.email, nome: d.nome, funcao: d.funcao, palavra_passe: d.palavra_passe } });
        if (error) { let m = error.message; try { const j = await error.context.json(); m = j.erro || m; } catch (e2) { /* sem corpo */ } throw { message: m }; }
        return { ...data, ...d };

    });
    if (!r) return;
    await abrirModal({

      { n: 'ativo', r: 'Com acesso a este município', t: 'checkbox', so_leitura: proprio },
    ];

      titulo: p.email || p.nome_exibicao || 'Utilizador', tabela: 'perfil_utilizador', campos, reg: p,
      extraHtml: proprio ? '<p class="suave ajuda" style="margin:12px 0 0">Não pode alterar a sua própria função nem retirar o seu acesso.</p>' : '<p class="suave ajuda" style="margin:12px 0 0">Retirar o acesso não apaga a conta nem o histórico; apenas impede a entrada neste município.</p>',
    });
    if (r) { aviso('Utilizador atualizado.'); navegar(); }
  });
}

};
const etqValidacao = e => `<span class="etq ${e === 'validado' ? 'e-validado' : e === 'rejeitado' ? 'e-em_falta' : e === 'retirado' ? 'e-eliminado' : ''}">${esc(ROT3.estado_validacao[e] || e)}</span>`;
const EXEMPLOS_CLASSIFICACAO = {
  itens: [
    ['Obrigação legal', 'imposta por lei; por exemplo, as tipologias do DL 141/2009.'],
    ['Requisito técnico aplicável', 'norma técnica obrigatória para a instalação; por exemplo, os requisitos da Portaria 454/2023 ou de acessibilidade do DL 163/2006.'],
    ['Recomendação', 'orientação de um organismo público sem força obrigatória; por exemplo, as normas de programação de equipamentos da DGOTDU (2002).'],
    ['Referência histórica', 'valor usado numa Carta anterior, guardado só para comparação; por exemplo, um rácio da Carta de 2015.'],
    ['Indicador interno', 'escolha do município para a sua análise; por exemplo, o prazo a partir do qual um dado se considera desatualizado.'],

};

/* ---------------------------------------------------------------- vista: metodologia */
async function vMetodologia(el) {
  const m = S.municipio.id, c = await carregarCache(true);
  const [inds, vals, pars, vers] = await Promise.all([
    dados(sb.from('indicador').select('*').eq('ativo', true).order('ordem')),
    dados(sb.from('indicador_validacao').select('*').eq('municipio_id', m).is('eliminado_em', null)),
    dados(sb.from('parametro').select('*').order('codigo')),
    dados(sb.from('parametro_versao').select('*').eq('municipio_id', m).is('eliminado_em', null).order('versao', { ascending: false })),
  ]);
  const indicadores = inds.filter(i => i.municipio_id == null || i.municipio_id === m);
  const valDe = id => vals.find(v => v.indicador_id === id);
  const estadoDe = id => valDe(id)?.estado || 'proposto';
  const nVal = indicadores.filter(i => estadoDe(i.id) === 'validado').length;
  el.innerHTML = `<div class="cab-vista"><h1>Metodologia</h1></div>
    <p class="nota">Um indicador só entra no relatório oficial depois de validado pelo município. Um parâmetro (distância, prazo…) só é validado com fonte, e uma versão validada nunca é alterada: substitui-se por uma nova versão.</p>
    <section class="cartao"><header><h2>Indicadores</h2><span class="suave">${nVal} de ${indicadores.length} validados</span></header>
      <div class="tabela-envolta"><table class="tabela resp"><thead><tr><th>Código</th><th>Indicador</th><th>Unidade</th><th>Cálculo automático</th><th>Estado</th></tr></thead><tbody>
      ${indicadores.map(i => `<tr data-editar="i:${i.id}"><td class="cod" data-l="Código">${esc(i.codigo)}</td><td class="titulo" data-l="Indicador">${esc(i.nome)}</td>
        <td data-l="Unidade">${esc(i.unidade)}</td><td data-l="Cálculo">${i.metodo ? 'Sim' : '<span class="suave">Não</span>'}</td><td data-l="Estado">${etqValidacao(estadoDe(i.id))}</td></tr>`).join('')}
      </tbody></table></div></section>
    ${pars.filter(p => p.municipio_id == null || p.municipio_id === m).map(p => {
      const vs = vers.filter(v => v.parametro_id === p.id);
      return `<section class="cartao"><header><h2>${esc(p.nome)}</h2><span class="cod suave">${esc(p.codigo)}</span><div class="acoes">${pode.editar() ? `<button class="btn btn-peq" type="button" data-nova-versao="${p.id}">Nova versão</button>` : ''}</div></header>
        <p class="suave ajuda" style="margin-top:-6px">${esc(p.descricao || '')} Unidade: ${esc(p.unidade)}.</p>
        ${vs.length ? `<div class="tabela-envolta"><table class="tabela resp"><thead><tr><th class="num">Versão</th>${p.ambito === 'tipologia' ? '<th>Tipologia</th>' : p.ambito === 'grupo' ? '<th>Grupo</th>' : ''}<th class="num">Valor</th><th>Natureza</th><th>Fonte</th><th>Estado</th></tr></thead><tbody>
          ${vs.map(v => `<tr data-editar="v:${v.id}"><td class="num" data-l="Versão">${v.versao}</td>${p.ambito === 'tipologia' ? `<td data-l="Tipologia">${esc(nomeDe(c.t, v.tipologia_id))}</td>` : p.ambito === 'grupo' ? `<td data-l="Grupo">${esc(ROT.grupo[v.grupo] || '')}</td>` : ''}
            <td class="num titulo" data-l="Valor">${fmtValor(v.valor)} ${esc(p.unidade)}</td><td data-l="Natureza">${esc(ROT3.classificacao[v.classificacao])}</td>
            <td data-l="Fonte">${esc(nomeDe(c.f, v.fonte_id, 'titulo')) || '<span class="suave">sem fonte</span>'}</td><td data-l="Estado">${etqValidacao(v.estado)}</td></tr>`).join('')}
          </tbody></table></div>` : '<p class="vazio">Sem valores definidos. Sem um valor com fonte, o indicador que o usa não é calculado.</p>'}</section>`;
    }).join('')}`;

  const abrirIndicador = async ind => {
    const v = valDe(ind.id);
    const det = (r, t) => t ? `<div style="margin-bottom:10px"><div class="suave" style="font-size:13px;font-weight:600">${esc(r)}</div><div>${esc(t)}</div></div>` : '';
    const podeDecidir = pode.validar();
    const r = await abrirModal({
      titulo: `${ind.codigo} · ${ind.nome}`, largo: true,
      corpo: `${det('Objetivo', ind.objetivo)}${det('Fórmula', ind.formula)}${det('Unidade', ind.unidade)}${det('Dados necessários', ind.dados_necessarios)}${det('Fonte potencial', ind.fonte_potencial)}${det('Limitações', ind.limitacoes)}
        <div style="margin-bottom:10px"><div class="suave" style="font-size:13px;font-weight:600">Natureza</div><div>${esc(ROT3.classificacao[ind.classificacao])}</div>${blocoExemplos(EXEMPLOS_CLASSIFICACAO)}</div>
        ${ind.metodo ? '' : '<p class="nota aviso">Sem cálculo automático nesta versão da plataforma.</p>'}
        <hr style="border:0;border-top:1px solid var(--linha);margin:14px 0">
        <h3>Decisão do município</h3>
        ${v && v.decidido_em ? `<p class="suave" style="margin-top:0">Decidido em ${dataHoraPT(v.decidido_em)}${v.notas ? ` — ${esc(v.notas)}` : ''}</p>` : ''}
        <form novalidate>${formHtml(podeDecidir ? [
          { n: 'estado', r: 'Estado', t: 'select', vazio: false, ops: ops(ROT3.estado_validacao).filter(([k]) => k !== 'retirado') },
          { n: 'notas', r: 'Fundamentação', t: 'textarea', larg: 'inteira', ajuda: 'Registe porque valida ou rejeita (ex.: adequado aos dados disponíveis; definição aprovada em reunião de dd/mm).' },
        ] : soLeitura([{ n: 'estado', r: 'Estado', t: 'select', vazio: false, ops: ops(ROT3.estado_validacao) }]), { estado: v?.estado || 'proposto', notas: v?.notas })}</form>
        ${podeDecidir ? '' : '<p class="suave ajuda">Só um validador ou administrador decide.</p>'}`,
      acoes: podeDecidir ? [{ rotulo: 'Fechar', valor: null }, { rotulo: 'Gravar decisão', classe: 'btn-prim', fazer: async w => {
        const estado = $('[name=estado]', w).value, notas = $('[name=notas]', w).value.trim() || null;
        if (estado !== 'proposto' && !notas) throw { message: 'Indique a fundamentação da decisão.' };
        if (v) { const x = await dados(sb.from('indicador_validacao').update({ estado, notas }).eq('id', v.id).select('id')); if (!x.length) throw semPermissao(); }
        else await dados(sb.from('indicador_validacao').insert({ municipio_id: m, indicador_id: ind.id, estado, notas }));
      } }] : [{ rotulo: 'Fechar', valor: null }],
    });
    if (r) { aviso('Decisão gravada.'); navegar(); }
  };
  const novaVersao = async par => {
    const campos = [
      ...(par.ambito === 'tipologia' ? [{ n: 'tipologia_id', r: 'Tipologia', t: 'select', obrig: true, larg: 'inteira', ops: opsTip() }] : []),
      ...(par.ambito === 'grupo' ? [{ n: 'grupo', r: 'Grupo de programação', t: 'select', obrig: true, larg: 'inteira', ops: ops(ROT.grupo).filter(([k]) => k !== 'outro'), exemplos: EXEMPLOS_GRUPO }] : []),
      { n: 'valor', r: `Valor (${par.unidade})`, t: 'number', obrig: true },
      { n: 'classificacao', r: 'Natureza do valor', t: 'select', obrig: true, ops: ops(ROT3.classificacao), exemplos: EXEMPLOS_CLASSIFICACAO },
      { n: 'fonte_id', r: 'Fonte', t: 'select', ops: opsFonte(null, 'parametro'), larg: 'inteira', ajuda: 'Obrigatória para validar: a lei, norma ou documento de onde vem o valor.' },
      { n: 'justificacao', r: 'Justificação', t: 'textarea', larg: 'inteira', ajuda: 'Porque este valor (ex.: artigo ou página da fonte, decisão de reunião).' },
    ];
    const r = await modalRegisto({
      titulo: `Nova versão · ${par.nome}`, tabela: 'parametro_versao', campos,
      validar: (d, erros) => {
        const existentes = vers.filter(v => v.parametro_id === par.id && (v.tipologia_id || null) === (d.tipologia_id || null) && (v.grupo || null) === (d.grupo || null));
        d.versao = Math.max(0, ...existentes.map(v => v.versao)) + 1;
        d.municipio_id = m; d.parametro_id = par.id; d.estado = 'proposto';
      },
    });
    if (r) { aviso('Versão registada como proposta. Um validador pode agora validá-la.'); navegar(); }
  };
  const abrirVersao = async v => {
    const par = pars.find(p => p.id === v.parametro_id);
    const acoes = [{ rotulo: 'Fechar', valor: null }];
    if (pode.validar() && v.estado === 'proposto') {
      acoes.push({ rotulo: 'Rejeitar', classe: 'btn-perigo', fazer: async () => { const x = await dados(sb.from('parametro_versao').update({ estado: 'rejeitado' }).eq('id', v.id).select('id')); if (!x.length) throw semPermissao(); return 'ok'; } });
      acoes.push({ rotulo: 'Validar', classe: 'btn-prim', fazer: async () => {
        if (!v.fonte_id) throw { message: 'Sem fonte não é possível validar. Crie uma nova versão com fonte.' };
        const x = await dados(sb.from('parametro_versao').update({ estado: 'validado' }).eq('id', v.id).select('id')); if (!x.length) throw semPermissao(); return 'ok';
      } });
    }
    if (pode.validar() && v.estado === 'validado') acoes.push({ rotulo: 'Retirar', classe: 'btn-perigo', fazer: async () => { const x = await dados(sb.from('parametro_versao').update({ estado: 'retirado' }).eq('id', v.id).select('id')); if (!x.length) throw semPermissao(); return 'ok'; } });
    const r = await abrirModal({
      titulo: `${par.nome} · versão ${v.versao}`,
      corpo: `<p style="margin-top:0"><strong>${fmtValor(v.valor)} ${esc(par.unidade)}</strong>${v.tipologia_id ? ` · ${esc(nomeDe(S.cache.t, v.tipologia_id))}` : ''}${v.grupo ? ` · ${esc(ROT.grupo[v.grupo])}` : ''} ${etqValidacao(v.estado)}</p>
        <p>Natureza: ${esc(ROT3.classificacao[v.classificacao])}<br>Fonte: ${esc(nomeDe(S.cache.f, v.fonte_id, 'titulo')) || '<span class="suave">sem fonte</span>'}</p>
        ${v.justificacao ? `<p>${esc(v.justificacao)}</p>` : ''}
        ${v.decidido_em ? `<p class="suave">Decidido em ${dataHoraPT(v.decidido_em)}.</p>` : ''}
        ${v.estado === 'validado' ? '<p class="nota">Versão validada: não se altera. Para mudar o valor, crie uma nova versão.</p>' : ''}`,
      acoes,
    });
    if (r) { aviso('Estado atualizado.'); navegar(); }
  };
  el.addEventListener('click', ev => {
    const nb = ev.target.closest('[data-nova-versao]'); if (nb) return novaVersao(pars.find(p => p.id === nb.dataset.novaVersao));
    const tr = ev.target.closest('tr[data-editar]'); if (!tr) return;
    const [k, id] = tr.dataset.editar.split(':');
    if (k === 'i') abrirIndicador(indicadores.find(i => i.id === id)); else abrirVersao(vers.find(v => v.id === id));
  });
}

/* ---------------------------------------------------------------- vista: indicadores (resultados) */
function cartaoExecucao(ex, c) {
  const pop = ex.populacao ? `População: ${esc(ROT2.tipo_valor[ex.populacao.tipo_valor] || ex.populacao.tipo_valor)} ${esc(ex.populacao.ano)}${ex.populacao.fonte_id ? ` (${esc(nomeDe(c.f, ex.populacao.fonte_id, 'titulo'))})` : ''}` : '';
  const params = (ex.parametros || []).map(p => `${esc(p.codigo)}${p.tipologia ? ` ${esc(p.tipologia)}` : ''} = ${fmtValor(p.valor)} (v${p.versao}, ${esc(ROT3.estado_validacao[p.estado] || p.estado)})`).join('; ');
  const linhas = ex.linhas || [];
  const temValores = linhas.some(l => l.numerador != null) || ex.total;

// Mapa simples em SVG (sem mosaicos: imprime bem e não depende da rede).
function svgMapa(geoms, pontos) {
  const aneis = [];
  geoms.forEach(g => {
    const gm = g.geom; if (!gm) return;
    const pol = gm.type === 'Polygon' ? [gm.coordinates] : gm.type === 'MultiPolygon' ? gm.coordinates : [];
    pol.forEach(p => aneis.push({ nome: g.nome, anel: p[0] }));
  });
  if (!aneis.length) return '<p class="doc-falta">Sem limites das freguesias carregados (Território → importar CAOP).</p>';
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  aneis.forEach(a => a.anel.forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }));
  const k = Math.cos(((y0 + y1) / 2) * Math.PI / 180), W = 640, H = Math.round(W * (y1 - y0) / ((x1 - x0) * k)) || 400;
  const px = x => ((x - x0) * k / ((x1 - x0) * k)) * (W - 20) + 10, py = y => (1 - (y - y0) / (y1 - y0)) * (H - 20) + 10;
  const caminhos = aneis.map(a => `<path d="M${a.anel.map(([x, y]) => `${px(x).toFixed(1)},${py(y).toFixed(1)}`).join('L')}Z"><title>${esc(a.nome)}</title></path>`).join('');
  const rotulos = geoms.filter(g => g.geom).map(g => {
    const anel = (g.geom.type === 'Polygon' ? g.geom.coordinates : g.geom.coordinates.slice().sort((a, b) => b[0].length - a[0].length)[0])[0];
    const cx = anel.reduce((s, p) => s + p[0], 0) / anel.length, cy = anel.reduce((s, p) => s + p[1], 0) / anel.length;
    return `<text x="${px(cx).toFixed(1)}" y="${py(cy).toFixed(1)}">${esc(g.nome.replace(/^União das freguesias de /, 'UF '))}</text>`;
  }).join('');
  const pts = pontos.filter(p => p.localizacao?.coordinates).map(p => {
    const [x, y] = p.localizacao.coordinates;
    return `<circle cx="${px(x).toFixed(1)}" cy="${py(y).toFixed(1)}" r="3.5"><title>${esc(p.designacao)}</title></circle>`;
  }).join('');
  return `<svg class="doc-mapa" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa das freguesias e instalações"><g class="f">${caminhos}</g><g class="p">${pts}</g><g class="r">${rotulos}</g></svg>`;
}

  const q = (t, sel = '*') => sb.from(t).select(sel).eq('municipio_id', m);

    dados(sb.from('unidade_territorial').select('id,nome,tipo,geom,vigente_ate,eliminado_em').eq('municipio_id', m).in('tipo', ['freguesia', 'municipio']).is('eliminado_em', null)),

    dados(sb.from('parametro').select('*')),
    dados(q('execucao_calculo').order('criado_em', { ascending: false }).limit(300)),

  ]);
  const usos = await dados(q('utilizacao_instalacao').is('eliminado_em', null));
  const versoes = await dados(q('versao_carta').is('eliminado_em', null).order('numero', { ascending: false }));

  const epNome = id => epocas.find(e => e.id === id)?.designacao || '';
  // Fotografias para as fichas: a principal ou, sem escolha, as mais recentes (até 2 por instalação).

    .order('principal', { ascending: false }).order('criado_em', { ascending: false }));
  const fotosDe = {}; fotos.filter(a => (a.mime || 'image/').startsWith('image/')).forEach(a => { (fotosDe[a.instalacao_id] = fotosDe[a.instalacao_id] || []).length < 2 && fotosDe[a.instalacao_id].push(a); });
  const urlFoto = {};
  const escolhidas = Object.values(fotosDe).flat();
  if (escolhidas.length) {
    const { data } = await sb.storage.from('anexos').createSignedUrls(escolhidas.map(a => a.caminho_storage), 7200);
    (data || []).forEach(x => { if (x.signedUrl) urlFoto[x.path] = x.signedUrl; });
  }
  const T = Object.fromEntries(textos.map(t => [t.chave, t]));
  const fregs = geoms.filter(u => u.tipo === 'freguesia' && emVigor(u)).sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
  const unidMun = geoms.find(u => u.tipo === 'municipio');
  const ativas = inst.filter(i => ['em_funcionamento', 'encerrada_temporariamente'].includes(i.estado_operacional));
  const espDe = id => esp.filter(e => e.instalacao_id === id);
  const caracDe = id => carac.find(x => x.instalacao_id === id);
  const areaDe = lista => lista.reduce((s, e) => s + (Number(e.area_util_m2) || 0), 0);

  // População: Censos mais recentes (senão, o ano mais recente de qualquer tipo).
  const censos = pop.filter(p => p.tipo_valor === 'censo');
  const base = censos.length ? censos : pop;
  const anoPop = base.length ? Math.max(...base.map(p => p.ano)) : null;
  const popAno = base.filter(p => p.ano === anoPop);
  const popDe = id => popAno.find(p => p.unidade_id === id)?.valor ?? null;
  const popMun = unidMun && popDe(unidMun.id) != null ? popDe(unidMun.id) : (fregs.length && fregs.every(f => popDe(f.id) != null) ? fregs.reduce((s, f) => s + popDe(f.id), 0) : null);
  const tipoPop = popAno[0] ? ROT2.tipo_valor[popAno[0].tipo_valor] : '';

  // Indicadores e cálculos
  const estadoInd = id => vals.find(v => v.indicador_id === id)?.estado || 'proposto';
  const ultima = new Map(); execs.forEach(e => { if (!ultima.has(e.codigo)) ultima.set(e.codigo, e); });

  const parUsados = vers.filter(v => v.estado !== 'rejeitado' && v.estado !== 'retirado');
  const nomePar = id => pars.find(p => p.id === id);

  // Estado do documento
  const faltas = [];

  if (!anoPop) faltas.push('não há população registada');
  if (!indUsados.length) faltas.push('ainda não foram calculados indicadores');

  if (vazios) faltas.push(`${vazios} secção(ões) de texto por redigir`);
  const rascunho = faltas.length > 0;
  // Dados por validar: não impedem a versão final, mas ficam à vista.
  const porValidar = [
    ['instalações', inst], ['espaços desportivos', esp], ['entidades', ents], ['valores de população', pop],
  ].map(([r, l]) => [r, l.filter(x => x.estado_dado !== 'validado').length, l.length]).filter(([, n]) => n > 0);
  const avisoDados = porValidar.length ? `Dados por validar: ${porValidar.map(([r, n, t]) => `${n} de ${t} ${r}`).join('; ')}.` : '';
  const ultimaVersao = versoes[0];

  const hoje = new Date();
  const ed = pode.editar();
  const secTexto = (k, opcoes = {}) => {
    const def = SECOES_TEXTO[k], t = T[k]?.texto?.trim();
    const corpo = t ? (opcoes.lista ? listaDoc(t) : textoDoc(t)) : `<p class="doc-falta">[Por redigir — ${esc(def.guia)}]</p>`;

  };
  const tabela = (cab, linhas, total) => `<div class="doc-tab-env"><table class="doc-tab"><thead><tr>${cab.map(([r, num]) => `<th${num ? ' class="n"' : ''}>${esc(r)}</th>`).join('')}</tr></thead><tbody>${linhas.map(l => `<tr>${l.map((v, i) => `<td${cab[i][1] ? ' class="n"' : ''}>${v}</td>`).join('')}</tr>`).join('')}${total ? `<tr class="tot">${total.map((v, i) => `<td${cab[i][1] ? ' class="n"' : ''}>${v}</td>`).join('')}</tr>` : ''}</tbody></table></div>`;

/* ---------------------------------------------------------------- PDF do documento final (pdfmake) */
// Gera um PDF verdadeiro (texto pesquisável) a partir do documento montado no ecrã,
// com cabeçalho, rodapé e numeração próprios — sem o endereço do site nem a data do navegador.
const PDFMAKE = 'https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/';
let pdfmakePronto = null;
function carregarPdfmake() {
  if (window.pdfMake?.vfs) return Promise.resolve();
  if (pdfmakePronto) return pdfmakePronto;
  const js = src => new Promise((ok, falha) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => falha(new Error('Não foi possível carregar o gerador de PDF. Verifique a ligação.')); document.head.appendChild(s); });
  pdfmakePronto = js(PDFMAKE + 'pdfmake.min.js').then(() => js(PDFMAKE + 'vfs_fonts.js')).catch(e => { pdfmakePronto = null; throw e; });
  return pdfmakePronto;
}

const COR = { verde: '#0f5d47', texto: '#1d2320', suave: '#5b6863', linha: '#d5e0db', fundo: '#e6efeb', barra: '#2f8a6c', ref: '#b4462f' };

// Imagem → dataURL JPEG reduzida (para o PDF não ficar enorme).
async function imagemParaPdf(src, max = 1400) {
  try {
    const blob = await (await fetch(src)).blob();
    const bmp = await createImageBitmap(blob);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.82);
  } catch { return null; }
}

// SVG do mapa com estilos em atributos (o pdfmake não lê CSS).
function svgParaPdf(svg) {
  const c = svg.cloneNode(true);
  c.querySelectorAll('.f path').forEach(p => { p.setAttribute('fill', '#e8f0ec'); p.setAttribute('stroke', '#6f8f82'); p.setAttribute('stroke-width', '1'); });
  c.querySelectorAll('.p circle').forEach(p => { p.setAttribute('fill', '#c2462b'); p.setAttribute('stroke', '#ffffff'); p.setAttribute('stroke-width', '1'); });
  c.querySelectorAll('.r text').forEach(t => { t.setAttribute('font-size', '9'); t.setAttribute('fill', '#2c3a35'); t.setAttribute('text-anchor', 'middle'); });
  c.querySelectorAll('title').forEach(t => t.remove());
  const vb = (c.getAttribute('viewBox') || '0 0 640 400').split(/\s+/).map(Number);
  c.setAttribute('width', vb[2]); c.setAttribute('height', vb[3]); c.removeAttribute('class');
  return { svg: new XMLSerializer().serializeToString(c), w: vb[2], h: vb[3] };
}

// Texto em linha: negrito, quebras de linha, partes "por redigir".
function inlinePdf(no) {
  const out = [];
  const anda = (n, est = {}) => n.childNodes.forEach(x => {
    if (x.nodeType === 3) { if (x.textContent) out.push({ text: x.textContent.replace(/\s+/g, ' '), ...est }); return; }
    if (x.nodeType !== 1 || x.tagName === 'BUTTON') return;
    if (x.tagName === 'BR') return out.push({ text: '\n' });
    const e = { ...est };
    if (['STRONG', 'B'].includes(x.tagName)) e.bold = true;
    if (x.classList.contains('doc-nota')) Object.assign(e, { color: COR.suave, fontSize: 8.5 });
    if (x.classList.contains('doc-falta')) Object.assign(e, { italics: true, color: '#8a8f8d' });
    if (x.classList.contains('doc-prov')) return out.push({ text: ' (provisório)', color: '#8a5a00', fontSize: 8, bold: true });
    anda(x, e);
  });
  anda(no);
  return out.length ? out : [{ text: '' }];
}

function tabelaPdf(tab) {
  const ths = [...tab.querySelectorAll('thead th')];
  const num = ths.map(th => th.classList.contains('n'));
  const corpo = [ths.map((th, i) => ({ text: th.textContent, bold: true, fontSize: 8.5, alignment: num[i] ? 'right' : 'left', fillColor: COR.fundo }))];
  tab.querySelectorAll('tbody tr').forEach(tr => {
    const tot = tr.classList.contains('tot');
    corpo.push([...tr.children].map((td, i) => ({ text: inlinePdf(td), fontSize: 8.5, alignment: num[i] ? 'right' : 'left', bold: tot || undefined })));
  });
  const widths = ths.map((_, i) => i === 0 ? '*' : num[i] ? 'auto' : (ths.length > 3 ? '*' : 'auto'));
  return { table: { headerRows: 1, widths, body: corpo, dontBreakRows: true },
    layout: { hLineWidth: (i, n) => i === 0 ? 0 : (i === 1 || i === n.table.body.length ? 0.8 : 0.4), vLineWidth: () => 0,
      hLineColor: () => COR.linha, paddingTop: () => 3, paddingBottom: () => 3, paddingLeft: () => 4, paddingRight: () => 4 },
    margin: [0, 2, 0, 10] };
}

function barrasPdf(div) {
  const L = 250;
  const corpo = [...div.querySelectorAll('.b')].map(b => {
    const v = parseFloat(b.querySelector('.v')?.style.width) || 0, ref = b.querySelector('.ref') ? parseFloat(b.querySelector('.ref').style.left) : null;
    const cv = [{ type: 'rect', x: 0, y: 1, w: L, h: 8, color: '#eef2f0' }, { type: 'rect', x: 0, y: 1, w: L * v / 100, h: 8, color: COR.barra }];
    if (ref != null) cv.push({ type: 'line', x1: L * ref / 100, y1: -1, x2: L * ref / 100, y2: 11, lineWidth: 1.2, lineColor: COR.ref });
    return [{ text: b.querySelector('.r').textContent, fontSize: 8 }, { canvas: cv }, { text: b.querySelector('.n').textContent, fontSize: 8, alignment: 'right' }];
  });
  return { table: { widths: [130, L, 40], body: corpo }, layout: 'noBorders', margin: [0, 2, 0, 6] };
}

async function blocosPdf(raiz) {
  const blocos = [];
  for (const x of raiz.children) {
    if (x.tagName === 'BUTTON' || x.classList.contains('doc-ed')) continue;
    const cl = x.classList;
    if (x.tagName === 'H2') blocos.push({ text: x.textContent, style: 'h2', tocItem: true });
    else if (x.tagName === 'H3') blocos.push({ text: inlinePdf(x), style: 'h3' });
    else if (x.tagName === 'P') blocos.push({ text: inlinePdf(x), style: cl.contains('doc-falta') ? 'falta' : cl.contains('doc-nota') ? 'nota' : 'p' });
    else if (x.tagName === 'UL' || x.tagName === 'OL') blocos.push({ [x.tagName.toLowerCase()]: [...x.children].map(li => ({ text: inlinePdf(li) })), style: cl.contains('doc-avisos') ? 'nota' : 'p', margin: [0, 0, 0, 8] });
    else if (cl.contains('doc-tab-env')) { const t = x.querySelector('table'); if (t) blocos.push(tabelaPdf(t)); }
    else if (x.tagName === 'TABLE') blocos.push(tabelaPdf(x));
    else if (x.tagName === 'FIGURE') {
      const svg = x.querySelector('svg');
      if (svg) { const s = svgParaPdf(svg); blocos.push({ svg: s.svg, fit: [483, 540], alignment: 'center', margin: [0, 4, 0, 4] }); }
      else blocos.push(...await blocosPdf(x));
      const cap = x.querySelector('figcaption'); if (cap) blocos.push({ text: cap.textContent, style: 'nota', alignment: 'center', margin: [0, 0, 0, 10] });
    }
    else if (cl.contains('doc-fotos')) {
      const imgs = [...x.querySelectorAll('img')];
      const dados64 = (await Promise.all(imgs.map(i => imagemParaPdf(i.src)))).filter(Boolean);
      if (dados64.length) blocos.push({ columns: dados64.map(d => ({ image: d, fit: dados64.length > 1 ? [236, 160] : [483, 230] })), columnGap: 10, margin: [0, 4, 0, 8] });
    }
    else if (x.tagName === 'DL') {
      const corpo = []; const filhos = [...x.children];
      for (let i = 0; i < filhos.length; i += 2) corpo.push([{ text: filhos[i].textContent, color: COR.suave, fontSize: 8.5 }, { text: filhos[i + 1] ? inlinePdf(filhos[i + 1]) : '', fontSize: 8.5 }]);
      blocos.push({ table: { widths: [95, '*'], body: corpo }, layout: { defaultBorder: false, paddingTop: () => 1, paddingBottom: () => 1, paddingLeft: () => 0 }, margin: [0, 2, 0, 8] });
    }
    else if (cl.contains('doc-barras')) blocos.push(barrasPdf(x));
    else if (cl.contains('doc-caixa')) blocos.push({ table: { widths: ['*'], body: [[{ text: inlinePdf(x), fontSize: 9, fillColor: '#fbf3e2', margin: [6, 4, 6, 4] }]] }, layout: 'noBorders', margin: [0, 8, 0, 8] });
    else if (cl.contains('doc-swot')) {
      const caixas = await Promise.all([...x.children].map(async c => ({ stack: await blocosPdf(c), margin: [6, 4, 6, 4] })));
      const linhas = []; for (let i = 0; i < caixas.length; i += 2) linhas.push([caixas[i], caixas[i + 1] || { text: '' }]);
      blocos.push({ table: { widths: ['*', '*'], body: linhas, dontBreakRows: true }, layout: { hLineColor: () => COR.linha, vLineColor: () => COR.linha, hLineWidth: () => 0.6, vLineWidth: () => 0.6 }, margin: [0, 2, 0, 10] });
    }
    else if (cl.contains('doc-ficha') || cl.contains('doc-freg') || cl.contains('doc-ind')) {
      const pilha = await blocosPdf(x);
      blocos.push({ stack: pilha, margin: [0, cl.contains('doc-ficha') ? 8 : 4, 0, 4] });
    }
    else if (x.children.length) blocos.push(...await blocosPdf(x));
    else if (x.textContent.trim()) blocos.push({ text: x.textContent.trim(), style: 'p' });
  }
  return blocos;
}

async function criarPdfCarta(doc, meta) {
  await carregarPdfmake();
  const conteudo = [];
  // Capa
  conteudo.push(
    { text: `Município de ${meta.municipio}`.toUpperCase(), fontSize: 11, characterSpacing: 2, color: COR.suave, alignment: 'center', margin: [0, 210, 0, 18] },
    { text: 'Carta Desportiva Municipal', fontSize: 30, bold: true, color: COR.verde, alignment: 'center' },
    { text: meta.municipio, fontSize: 18, alignment: 'center', margin: [0, 8, 0, 0] },
    ...(meta.versao ? [{ text: `Versão ${meta.versao.numero} — aprovada em ${meta.versao.data}`, fontSize: 12, bold: true, color: COR.verde, alignment: 'center', margin: [0, 30, 0, 4] },
      { text: meta.versao.deliberacao, fontSize: 10, color: COR.suave, alignment: 'center' }] : []),
    ...(meta.rascunho ? [{ table: { widths: ['*'], body: [[{ text: 'RASCUNHO — NÃO É VERSÃO OFICIAL', color: COR.ref, bold: true, fontSize: 10, alignment: 'center', margin: [0, 4, 0, 4] }]] },
      layout: { hLineColor: () => COR.ref, vLineColor: () => COR.ref }, margin: [150, 30, 150, 0] }] : []),
  );
  // Índice com números de página
  conteudo.push({ text: 'Índice', style: 'h2', pageBreak: 'before' },
    { toc: { numberStyle: { fontSize: 10 }, textStyle: { fontSize: 10 } } });
  const caixa = doc.querySelector('.doc-sec .doc-caixa'); if (caixa) conteudo.push({ table: { widths: ['*'], body: [[{ text: inlinePdf(caixa), fontSize: 9, fillColor: '#fbf3e2', margin: [6, 4, 6, 4] }]] }, layout: 'noBorders', margin: [0, 14, 0, 0] });
  // Secções (a primeira é o índice do ecrã, substituído pelo índice do PDF)
  for (const sec of doc.querySelectorAll('.doc-sec')) {
    if (sec.querySelector('.doc-indice')) continue;
    const b = await blocosPdf(sec);
    if (b.length) b[0].pageBreak = 'before';
    conteudo.push(...b);
  }
  const titulo = `Carta Desportiva Municipal de ${meta.municipio}`;
  const def = {
    pageSize: 'A4', pageMargins: [56, 64, 56, 64],
    info: { title: titulo, author: `Município de ${meta.municipio}`, subject: 'Carta Desportiva Municipal' },
    header: (pag) => pag === 1 ? null : {
      margin: [56, 26, 56, 0],
      stack: [{ columns: [{ text: titulo, fontSize: 8, color: COR.suave }, { text: meta.rascunho ? 'Rascunho' : meta.versao ? `Versão ${meta.versao.numero} (${meta.versao.data})` : meta.ano, fontSize: 8, color: meta.rascunho ? COR.ref : COR.suave, alignment: 'right', width: 'auto' }] },
        { canvas: [{ type: 'line', x1: 0, y1: 4, x2: 483, y2: 4, lineWidth: 0.6, lineColor: COR.verde }] }],
    },
    footer: (pag, total) => pag === 1 ? { text: [{ text: meta.mesAno + '\n', fontSize: 11, color: COR.suave }, { text: `Município de ${meta.municipio}`, fontSize: 9, color: COR.suave }], alignment: 'center', margin: [0, 0, 0, 0] } : {
      margin: [56, 18, 56, 0],
      columns: [{ text: `Município de ${meta.municipio}`, fontSize: 8, color: COR.suave }, { text: `Página ${pag} de ${total}`, fontSize: 8, color: COR.suave, alignment: 'right' }],
    },
    content: conteudo,
    defaultStyle: { font: 'Roboto', fontSize: 10, lineHeight: 1.25, color: COR.texto },
    styles: {
      h2: { fontSize: 16, bold: true, color: COR.verde, margin: [0, 0, 0, 10] },
      h3: { fontSize: 11, bold: true, margin: [0, 10, 0, 4] },
      p: { margin: [0, 0, 0, 6] },
      nota: { fontSize: 8.5, color: COR.suave, margin: [0, 0, 0, 6] },
      falta: { italics: true, color: '#8a8f8d', fontSize: 9, margin: [0, 2, 0, 8] },
    },
  };
  const nome = `Carta Desportiva Municipal - ${meta.municipio} - ${meta.versao ? `versao ${meta.versao.numero}` : meta.data}${meta.rascunho ? ' (rascunho)' : ''}.pdf`;
  const blob = await new Promise((ok, falha) => { try { pdfMake.createPdf(def).getBlob(ok); } catch (e) { falha(e); } });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return blob;
}

/* ---------------------------------------------------------------- utilização por entidades (protocolos, horários) */
const DIAS = ['', '2.ª', '3.ª', '4.ª', '5.ª', '6.ª', 'Sáb.', 'Dom.'];
const ROT_UTIL = {
  regime: { protocolo: 'Protocolo', cedencia_gratuita: 'Cedência gratuita', cedencia_paga: 'Cedência com pagamento de taxas', aluguer: 'Aluguer', atividade_municipal: 'Atividade municipal', escolar: 'Uso escolar', outro: 'Outro' },
  horas_tipo: { cedidas: 'Horas atribuídas (protocolo ou cedência)', utilizadas: 'Horas efetivamente utilizadas' },
};
const minutos = h => { const [a, b] = String(h || '').split(':').map(Number); return Number.isFinite(a) ? a * 60 + (b || 0) : null; };
const horasHorario = hor => (hor || []).reduce((s, p) => { const a = minutos(p.inicio), b = minutos(p.fim); return s + (a != null && b != null && b > a ? (b - a) / 60 : 0); }, 0);
// Agrupa por período: "2.ª, 4.ª e 6.ª 19:00–21:00; Sáb. 10:00–12:00"
function textoHorario(hor) {
  if (!hor?.length) return '';
  const g = new Map();
  hor.forEach(p => { const k = `${p.inicio}–${p.fim}`; g.set(k, [...(g.get(k) || []), p.dia]); });
  return [...g].map(([k, dias]) => { const d = [...new Set(dias)].sort((a, b) => a - b).map(x => DIAS[x]); return `${d.length > 1 ? d.slice(0, -1).join(', ') + ' e ' + d.at(-1) : d[0]} ${k}`; }).join('; ');
}
function blocoHorarioHtml(dias = [], inicio = '', fim = '') {
  return `<div class="hor-bloco"><div class="chips">${DIAS.slice(1).map((d, i) => `<label><input type="checkbox" value="${i + 1}"${dias.includes(i + 1) ? ' checked' : ''}><span>${d}</span></label>`).join('')}</div>
    <div class="hor-horas"><label>Das <input type="time" class="h-ini" value="${esc(inicio)}"></label><label>às <input type="time" class="h-fim" value="${esc(fim)}"></label>
    <button type="button" class="btn-texto h-rem">Remover</button></div></div>`;
}
function lerHorario(w) {
  const hor = [], erros = [];
  $$('.hor-bloco', w).forEach((b, i) => {
    const dias = $$('input[type=checkbox]:checked', b).map(x => +x.value), ini = $('.h-ini', b).value, fim = $('.h-fim', b).value;
    if (!dias.length && !ini && !fim) return;
    if (!dias.length) erros.push(`Horário, período ${i + 1}: escolha pelo menos um dia.`);
    if (!ini || !fim) erros.push(`Horário, período ${i + 1}: indique a hora de início e de fim.`);
    else if (minutos(fim) <= minutos(ini)) erros.push(`Horário, período ${i + 1}: a hora de fim tem de ser depois da de início.`);
    dias.forEach(dia => hor.push({ dia, inicio: ini, fim }));
  });
  return { hor: hor.sort((a, b) => a.dia - b.dia || minutos(a.inicio) - minutos(b.inicio)), erros };
}

async function secaoUtilizacao(caixa, inst) {
  const m = S.municipio.id, c = S.cache;
  let [lista, espacos, epocas] = await Promise.all([
    dados(sb.from('utilizacao_instalacao').select('*').eq('municipio_id', m).is('eliminado_em', null)),
    dados(sb.from('espaco_desportivo').select('id,designacao').eq('instalacao_id', inst.id).is('eliminado_em', null).order('designacao')),
    dados(sb.from('epoca').select('id,designacao,data_inicio').eq('municipio_id', m).is('eliminado_em', null).order('data_inicio', { ascending: false })),
  ]);
  const doEspaco = lista.filter(u => espacos.some(e => e.id === u.espaco_id));
  const nomeEsp = id => espacos.find(e => e.id === id)?.designacao || '';
  const nomeEp = id => epocas.find(e => e.id === id)?.designacao || '';
  const ed = pode.editar() && !inst.eliminado_em;
  caixa.innerHTML = `<header><h2>Utilização por entidades</h2><div class="acoes">${ed ? '<button class="btn btn-peq" type="button" id="nova-util">Registar utilização</button>' : ''}</div></header>
    <p class="suave ajuda" style="margin-top:-6px">Entidades que usam esta instalação sem serem proprietárias, por exemplo ao abrigo de um protocolo, com os dias e as horas atribuídos.</p>
    ${doEspaco.length ? `<div class="tabela-envolta"><table class="tabela resp"><thead><tr><th>Entidade</th><th>Espaço</th><th>Época</th><th>Horário</th><th class="num">Horas/sem.</th><th>Regime</th></tr></thead><tbody>
      ${doEspaco.sort((a, b) => nomeDe(c.e, a.entidade_id).localeCompare(nomeDe(c.e, b.entidade_id), 'pt')).map(u => `<tr data-editar="${u.id}"><td class="titulo" data-l="Entidade">${esc(nomeDe(c.e, u.entidade_id))}</td><td data-l="Espaço">${esc(nomeEsp(u.espaco_id))}</td>
        <td data-l="Época">${esc(nomeEp(u.epoca_id))}</td><td data-l="Horário">${esc(textoHorario(u.horario)) || '<span class="suave">—</span>'}</td><td class="num" data-l="Horas/sem.">${fmtNum(u.horas_semanais, 1)}</td>
        <td data-l="Regime">${esc(ROT_UTIL.regime[u.regime])}${u.protocolo_ref ? `<br><span class="suave">${esc(u.protocolo_ref)}</span>` : ''}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="vazio">Sem utilizações registadas.</p>'}`;

  const editar = async u => {
    if (!espacos.length) espacos.push(...await dados(sb.from('espaco_desportivo').select('id,designacao').eq('instalacao_id', inst.id).is('eliminado_em', null).order('designacao')));
    if (!espacos.length) return aviso('Registe primeiro o espaço desportivo (por exemplo, "Relvado principal") na secção Espaços desportivos.', 'erro');
    if (!epocas.length) return aviso('Crie primeiro a época desportiva (por exemplo, 2025/2026) em Catálogos → Épocas desportivas.', 'erro');
    const ro = !pode.editar();
    const campos = [
      { n: 'entidade_id', r: 'Entidade', t: 'select', obrig: true, larg: 'inteira', ops: c.entidades.filter(e => !e.eliminado_em || e.id === u?.entidade_id).map(e => [e.id, e.nome]), ajuda: 'Se a associação ainda não existir, crie-a primeiro em Entidades.' },
      { n: 'espaco_id', r: 'Espaço', t: 'select', obrig: true, ops: espacos.map(e => [e.id, e.designacao]), padrao: espacos.length === 1 ? espacos[0].id : undefined },
      { n: 'epoca_id', r: 'Época', t: 'select', obrig: true, ops: epocas.map(e => [e.id, e.designacao]), padrao: epocas[0]?.id },
      { n: 'regime', r: 'Regime', t: 'select', obrig: true, vazio: false, ops: ops(ROT_UTIL.regime), padrao: 'protocolo' },
      { n: 'horas_tipo', r: 'As horas são', t: 'select', vazio: false, ops: ops(ROT_UTIL.horas_tipo), padrao: 'cedidas', ajuda: 'Normalmente "atribuídas". Só escolha "efetivamente utilizadas" se houver registo do uso real.' },
      { n: 'protocolo_ref', r: 'Protocolo / referência', larg: 'inteira', ph: 'Ex.: Protocolo n.º 12/2025, deliberação da Câmara de 15/09/2025' },
      { n: 'valido_de', r: 'Válido de', t: 'date' }, { n: 'valido_ate', r: 'Válido até', t: 'date' },
      { n: 'horas_semanais', r: 'Horas por semana', t: 'number', ajuda: 'Calculadas a partir do horário. Preencha à mão só se não houver horário fixo.' },
      { n: 'fonte_id', r: 'De onde vem esta informação?', t: 'select', ops: opsFonte(u?.fonte_id), exemplos: { itens: [['Protocolo n.º 12/2025', 'o próprio protocolo pode ser registado como fonte (tipo Outra).'], ['Levantamento municipal', '']] } }, { n: 'estado_dado', r: 'Estado do dado', t: 'select', vazio: false, ops: opsEstado(u?.estado_dado), padrao: 'nao_verificado' },
      { n: 'observacoes', r: 'Observações', t: 'textarea', larg: 'inteira' },
    ];
    const grupos = new Map(); (u?.horario || []).forEach(p => { const k = p.inicio + '|' + p.fim; grupos.set(k, [...(grupos.get(k) || []), p.dia]); });
    const blocos = [...grupos].map(([k, dias]) => blocoHorarioHtml(dias, ...k.split('|')));
    const extra = `<div style="margin-top:14px"><h3>Horário semanal</h3>
      <div id="hor-blocos">${blocos.join('') || blocoHorarioHtml()}</div>
      ${ro ? '' : '<button type="button" class="btn btn-peq" id="hor-mais">Juntar outro período</button>'}
      <p class="suave ajuda" id="hor-total" style="margin:8px 0 0"></p></div>
      ${u && !ro ? '<p style="margin:12px 0 0"><button type="button" class="btn btn-perigo btn-peq" id="rem-util">Eliminar esta utilização</button></p>' : ''}`;
    const r = await modalRegisto({
      titulo: u ? `Utilização · ${nomeDe(c.e, u.entidade_id)}` : 'Registar utilização', tabela: 'utilizacao_instalacao', campos, reg: u, ro, extraHtml: extra,
      fixos: { municipio_id: m },
      validar: (d, erros, w) => {
        const { hor, erros: eh } = lerHorario(w); erros.push(...eh);
        d.horario = hor.length ? hor : null;
        if (hor.length) d.horas_semanais = Math.round(horasHorario(hor) * 100) / 100;
        if (!d.horas_semanais) erros.push('Indique o horário ou as horas por semana.');
        if (d.valido_de && d.valido_ate && d.valido_ate < d.valido_de) erros.push('Validade: a data final é anterior à inicial.');
      },
      aoAbrir: w => {
        const total = () => { const { hor } = lerHorario(w); const h = horasHorario(hor); $('#hor-total', w).textContent = h ? `Total: ${fmtNum(h, 1)} horas por semana.` : ''; if (h) $('[name=horas_semanais]', w).value = String(Math.round(h * 100) / 100).replace('.', ','); };
        w.addEventListener('input', ev => { if (ev.target.closest('#hor-blocos')) total(); });
        w.addEventListener('change', ev => { if (ev.target.closest('#hor-blocos')) total(); });
        w.addEventListener('click', ev => { const b = ev.target.closest('.h-rem'); if (b) { b.closest('.hor-bloco').remove(); if (!$('.hor-bloco', w)) $('#hor-blocos', w).insertAdjacentHTML('beforeend', blocoHorarioHtml()); total(); } });
        const mais = $('#hor-mais', w); if (mais) mais.onclick = () => $('#hor-blocos', w).insertAdjacentHTML('beforeend', blocoHorarioHtml());
        if (ro) $$('#hor-blocos input, #hor-blocos button', w).forEach(x => x.disabled = true);
        const rem = $('#rem-util', w);
        if (rem) rem.onclick = async () => { try { if (await eliminarRegisto('utilizacao_instalacao', u.id, true)) { w.querySelector('[data-fechar]').click(); secaoUtilizacao(caixa, inst); } } catch (e) { aviso(msgErro(e), 'erro'); } };
        total();
      },
    });
    if (r) { aviso('Utilização gravada.'); secaoUtilizacao(caixa, inst); }
  };
  const nb = $('#nova-util', caixa); if (nb) nb.onclick = () => editar(null);
  $$('tr[data-editar]', caixa).forEach(tr => tr.onclick = () => editar(doEspaco.find(u => u.id === tr.dataset.editar)));
}

const ROT_INT = {

const fmtEuro = v => v == null ? '' : `${fmtNum(v, Number(v) % 1 ? 2 : 0)} €`;
const CAMPOS_COMPL = [

        ['Sim', 'existe regulamento aprovado pelo órgão competente e afixado ou publicado (ex.: regulamento das piscinas municipais).'],
        ['Não', 'a instalação funciona sem regulamento próprio.'],
        ['Por verificar', 'ainda não foi confirmado.'],

// Linhas "rótulo: valor" só dos campos preenchidos.
function resumoComplementar(i) {
  const v = (n, x) => x == null || x === '' ? null : x;
  return [
    ['Ano de construção', v('a', i.ano_construcao)],
    ['Área do terreno', i.area_terreno_m2 != null ? `${fmtNum(i.area_terreno_m2)} m²` : null],
    ['Licença', [i.licenca_ref, i.licenca_data ? dataPT(i.licenca_data) : ''].filter(Boolean).join(', ') || null],
    ['Regulamento de utilização', i.regulamento_aprovado ? ROT.snv[i.regulamento_aprovado] + (i.regulamento_data ? ` (${dataPT(i.regulamento_data)})` : '') : null],
    ['Seguro', i.seguro ? ROT.snv[i.seguro] : null],
    ['Custo anual', i.custo_anual != null ? fmtEuro(i.custo_anual) + (i.custo_anual_ano ? ` (${i.custo_anual_ano})` : '') : null],
    ['Estacionamento', i.estacionamento_lugares != null ? `${fmtNum(i.estacionamento_lugares)} lugares` : null],

    ['Acesso pedonal seguro', i.acesso_pedonal_seguro ? ROT.snv[i.acesso_pedonal_seguro] : null],
  ].filter(([, x]) => x != null);
}

async function secaoComplementares(caixa, inst) {
  const [[i], ints] = await Promise.all([
    dados(sb.from('instalacao').select('*').eq('id', inst.id)),
    dados(sb.from('intervencao').select('*').eq('instalacao_id', inst.id).is('eliminado_em', null).order('ano', { ascending: false })),
  ]);
  const ed = pode.editar() && !inst.eliminado_em;
  const res = resumoComplementar(i);
  caixa.innerHTML = `<header><h2>Dados complementares</h2><div class="acoes">${ed ? '<button class="btn btn-peq" type="button" id="ed-compl">Editar</button>' : ''}</div></header>
    <p class="suave ajuda" style="margin-top:-6px">Construção, situação legal e acessos. Tudo opcional: preencha só o que fizer sentido.</p>
    ${res.length ? `<dl class="dl-dados">${res.map(([r, x]) => `<dt>${esc(r)}</dt><dd>${esc(x)}</dd>`).join('')}</dl>` : '<p class="vazio" style="padding:10px 0">Nada preenchido.</p>'}
    <h3 style="margin-top:16px;display:flex;align-items:center;gap:10px">Intervenções ${ed ? '<button class="btn btn-peq" type="button" id="nova-int" style="margin-left:auto">Registar intervenção</button>' : ''}</h3>
    ${ints.length ? `<div class="tabela-envolta"><table class="tabela resp"><thead><tr><th class="num">Ano</th><th>Tipo</th><th>Descrição</th><th class="num">Custo</th><th>Financiamento</th></tr></thead><tbody>
      ${ints.map(x => `<tr data-int="${x.id}"><td class="num titulo" data-l="Ano">${x.ano}</td><td data-l="Tipo">${esc(ROT_INT.tipo[x.tipo])}</td><td data-l="Descrição">${esc(x.descricao || '')}</td><td class="num" data-l="Custo">${fmtEuro(x.custo)}</td><td data-l="Financiamento">${esc(ROT_INT.financiamento[x.financiamento] || '')}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="suave" style="margin:4px 0 0">Sem intervenções registadas.</p>'}`;

  const bEd = $('#ed-compl', caixa);
  if (bEd) bEd.onclick = async () => {
    const todos = CAMPOS_COMPL.flatMap(g => g.campos);
    const r = await abrirModal({
      titulo: `Dados complementares · ${i.designacao}`, largo: true,
      corpo: `<form novalidate>${CAMPOS_COMPL.map(g => `<h3 style="margin:${g === CAMPOS_COMPL[0] ? 0 : 18}px 0 8px">${esc(g.titulo)}</h3>${formHtml(g.campos, i)}`).join('')}</form>`,
      acoes: [{ rotulo: 'Cancelar', valor: null }, { rotulo: 'Gravar', classe: 'btn-prim', fazer: async w => {
        const { dados: d, erros } = lerForm(w, todos);
        if (d.ano_construcao && (d.ano_construcao < 1800 || d.ano_construcao > new Date().getFullYear() + 5)) erros.push('Ano de construção: valor fora do intervalo possível.');
        if (erros.length) throw { message: erros.join('\n') };
        const x = await dados(sb.from('instalacao').update(d).eq('id', i.id).select('id')); if (!x.length) throw semPermissao();
      } }],
    });
    if (r) { aviso('Dados complementares gravados.'); secaoComplementares(caixa, inst); }
  };

  const editarInt = async it => {
    const campos = [
      { n: 'ano', r: 'Ano', t: 'int', obrig: true, padrao: new Date().getFullYear(), exemplos: EXF.ano_int },
      { n: 'tipo', r: 'Tipo de intervenção', t: 'select', obrig: true, ops: ops(ROT_INT.tipo) },
      { n: 'descricao', r: 'Descrição', t: 'textarea', larg: 'inteira', ph: 'Ex.: substituição do relvado natural por sintético e nova iluminação LED' },
      { n: 'custo', r: 'Custo (€)', t: 'number' },
      { n: 'financiamento', r: 'Financiamento', t: 'select', ops: ops(ROT_INT.financiamento) },
      { n: 'financiamento_nota', r: 'Programa / observações do financiamento', larg: 'inteira', ph: 'Ex.: Norte 2020, aviso n.º …' },
      { n: 'fonte_id', r: 'De onde vem esta informação?', t: 'select', ops: opsFonte(it?.fonte_id), exemplos: { itens: [['Processo de empreitada / auto de receção', 'registe como fonte do tipo Outra.'], ['Levantamento municipal', '']] } }, { n: 'estado_dado', r: 'Estado do dado', t: 'select', vazio: false, ops: opsEstado(it?.estado_dado), padrao: 'nao_verificado' },
    ];
    const ro = !pode.editar();
    const r = await modalRegisto({
      titulo: it ? `Intervenção de ${it.ano}` : 'Registar intervenção', tabela: 'intervencao', campos, reg: it, ro,
      fixos: { municipio_id: S.municipio.id, instalacao_id: inst.id },
      extraHtml: it && !ro ? '<p style="margin:12px 0 0"><button type="button" class="btn btn-perigo btn-peq" id="rem-int">Eliminar esta intervenção</button></p>' : '',
      validar: (d, erros) => { if (d.ano && (d.ano < 1800 || d.ano > new Date().getFullYear() + 5)) erros.push('Ano: valor fora do intervalo possível.'); },
      aoAbrir: w => { const b = $('#rem-int', w); if (b) b.onclick = async () => { try { if (await eliminarRegisto('intervencao', it.id, true)) { w.querySelector('[data-fechar]').click(); secaoComplementares(caixa, inst); } } catch (e) { aviso(msgErro(e), 'erro'); } }; },
    });
    if (r) { aviso('Intervenção gravada.'); secaoComplementares(caixa, inst); }
  };
  const bNi = $('#nova-int', caixa); if (bNi) bNi.onclick = () => editarInt(null);
  $$('tr[data-int]', caixa).forEach(tr => tr.onclick = () => editarInt(ints.find(x => x.id === tr.dataset.int)));
}

/* ---------------------------------------------------------------- símbolos no mapa */
// Símbolo pela tipologia (código do DL 141/2009; tipologias próprias pelo nome) e cor pela classe.
const SIMBOLO_COD = {
  'DL141-6a': '🏐', 'DL141-7d': '🎾', 'DL141-6b': '🏃', 'DL141-6c': '🏀', 'DL141-7c': '🏀', 'DL141-8a': '🏀', 'DL141-9b': '🏟️',
  'DL141-8b': '🥋', 'DL141-6d': '🏊', 'DL141-7e': '🏊', 'DL141-8c': '🏊', 'DL141-9c': '🏊', 'DL141-7a': '⚽', 'DL141-9a': '🏟️',
  'DL141-7b': '🏃', 'DL141-8d': '🚴', 'DL141-9e': '🚴', 'DL141-8e': '🎯', 'DL141-8f': '🏹', 'DL141-8g': '🏍️', 'DL141-9f': '🏎️',
  'DL141-8h': '🐎', 'DL141-9d': '🐎', 'DL141-8i': '🛶', 'DL141-9g': '🛶', 'DL141-8j': '⛳', 'ENRD': '🌳', 'INFORMAL': '🧒',
};
const COR_CLASSE = { base_recreativa: '#4caf7a', base_formativa: '#1f7a5c', especializada: '#2f6fb3', especial_espetaculo: '#7b4bb3', espaco_natural: '#8a6a2f', espaco_informal: '#7d8a85', outra: '#7d8a85' };
function simboloTipologia(t) {
  if (!t) return '📍';
  if (SIMBOLO_COD[t.codigo]) return SIMBOLO_COD[t.codigo];
  const n = chaveTexto(t.nome);
  return [['piscin', '🏊'], ['pavilh', '🏀'], ['sala', '🏀'], ['estadio', '🏟️'], ['campo', '⚽'], ['pista', '🏃'], ['tenis', '🎾'], ['padel', '🎾'], ['ginasio', '🏋️'], ['skate', '🛹'], ['percurso', '🏃'], ['trilho', '🌳']]
    .find(([k]) => n.includes(k))?.[1] || '📍';
}
function iconeInstalacao(t, apagado = false, grande = false) {
  const cor = COR_CLASSE[t?.classe] || '#7d8a85', d = grande ? 46 : 38;
  return L.divIcon({ className: '', iconSize: [d, d], iconAnchor: [d / 2, d * 1.2], popupAnchor: [0, -d], tooltipAnchor: [0, -d],
    html: `<div class="pino${apagado ? ' apagado' : ''}" style="--cor:${cor};width:${d}px;height:${d}px"><span style="font-size:${Math.round(d * 0.5)}px">${simboloTipologia(t)}</span></div>` });
}
function legendaMapa(mapa) {
  const ctl = L.control({ position: 'bottomleft' });
  ctl.onAdd = () => { const d = L.DomUtil.create('div', 'legenda-mapa'); d.innerHTML = Object.entries(ROT.classe).filter(([k]) => k !== 'outra').map(([k, r]) => `<div><i style="background:${COR_CLASSE[k]}"></i>${esc(r)}</div>`).join('') + '<div class="suave">Esbatido: encerrada ou em construção</div>'; L.DomEvent.disableClickPropagation(d); return d; };
  ctl.addTo(mapa);
}

/* ---------------------------------------------------------------- arranque */
async function iniciar() {
  sb.auth.onAuthStateChange((evento, sessao) => {
    // Não chamar o Supabase dentro deste callback (pode bloquear); adiar.
    if (evento === 'PASSWORD_RECOVERY') setTimeout(pedirNovaPalavraPasse, 0);
    if (evento === 'SIGNED_OUT' && S.user) setTimeout(() => { S.user = null; navegar(); }, 0);
  });
  window.addEventListener('hashchange', navegar);
  try {
    const { data } = await sb.auth.getSession();
    await definirSessao(data.session);
  } catch (e) {
    console.error(e);
    aviso(msgErro(e), 'erro');
  }
  navegar();
}
iniciar();
