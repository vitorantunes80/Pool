  <script>
  // =====================================================================
  //  Cliente Supabase
  // =====================================================================
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const state = { session: null, user: null };

  // =====================================================================
  //  Utilitários
  // =====================================================================
  const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtHoras = (min) => (min/60).toFixed(1).replace('.', ',') + " h";
  function fmtDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function duracaoTurnoMin(hi, hf){ const [a,b]=hi.split(':').map(Number),[c,d]=hf.split(':').map(Number); let ini=a*60+b, fim=c*60+d; if(fim<=ini) fim+=1440; return fim-ini; }
  function atravessaMeiaNoite(hi, hf){ const [a,b]=hi.split(':').map(Number),[c,d]=hf.split(':').map(Number); return (c*60+d)<=(a*60+b); }
  function ehNoturno(hi){ const h=Number(hi.split(':')[0]); return h>=22 || h<6; }

  // =====================================================================
  //  Catálogo de regras (dados) — igual ao motor do backend
  // =====================================================================
  const CATALOGO_REGRAS = [
    { tipo:"MAX_HORAS", etiqueta:"Número máximo de horas", descricao:"Limite de horas atribuídas no período indicado.", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"periodo",etiqueta:"Período",tipo:"select",omissao:"mes",opcoes:[{valor:"mes",etiqueta:"Mês"},{valor:"semana",etiqueta:"Semana"}]},
               {chave:"limite",etiqueta:"Limite",tipo:"number",sufixo:"h",omissao:160} ] },
    { tipo:"MIN_HORAS", etiqueta:"Número mínimo de horas", descricao:"Mínimo de horas atribuídas no período indicado.", categoriaSugerida:"PREFERENCIAL",
      campos:[ {chave:"periodo",etiqueta:"Período",tipo:"select",omissao:"mes",opcoes:[{valor:"mes",etiqueta:"Mês"},{valor:"semana",etiqueta:"Semana"}]},
               {chave:"limite",etiqueta:"Limite",tipo:"number",sufixo:"h",omissao:120} ] },
    { tipo:"DESCANSO_ENTRE_TURNOS", etiqueta:"Descanso mínimo entre turnos", descricao:"Horas mínimas de descanso entre o fim de um turno e o início do seguinte.", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"min_horas",etiqueta:"Horas mínimas",tipo:"number",sufixo:"h",omissao:11} ] },
    { tipo:"MAX_DIAS_CONSECUTIVOS", etiqueta:"Máximo de dias consecutivos", descricao:"Número máximo de dias seguidos com turno atribuído.", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"max_dias",etiqueta:"Dias",tipo:"number",omissao:6} ] },
    { tipo:"MIN_FOLGAS", etiqueta:"Número mínimo de folgas", descricao:"Folgas mínimas no mês (dias sem qualquer turno).", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"min_folgas",etiqueta:"Folgas por mês",tipo:"number",omissao:8} ] },
    { tipo:"FIM_SEMANA_COMPLETO", etiqueta:"Fim de semana completo de descanso", descricao:"Pelo menos um sábado + domingo consecutivos sem turno, por mês.", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"min_por_mes",etiqueta:"Fins de semana por mês",tipo:"number",omissao:1} ] },
    { tipo:"MAX_TURNOS_NOTURNOS", etiqueta:"Máximo de turnos noturnos", descricao:"Limite de turnos noturnos no mês.", categoriaSugerida:"PREFERENCIAL",
      campos:[ {chave:"max",etiqueta:"Máximo por mês",tipo:"number",omissao:8} ] },
    { tipo:"NECESSIDADES_MINIMAS", etiqueta:"Necessidades mínimas por turno", descricao:"Número mínimo de trabalhadores em cada ocorrência do turno.", categoriaSugerida:"OBRIGATORIA",
      campos:[ {chave:"min_trabalhadores",etiqueta:"Trabalhadores por turno",tipo:"number",omissao:1} ] },
  ];
  const tipoRegra = (t) => CATALOGO_REGRAS.find(r => r.tipo === t);

  // =====================================================================
  //  Motor de regras (validação)
  // =====================================================================
  function porMembro(ctx){ const m=new Map(); for(const a of ctx.atribuicoes){ if(!m.has(a.membroId)) m.set(a.membroId,[]); m.get(a.membroId).push(a);} for(const arr of m.values()) arr.sort((x,y)=>x.data.localeCompare(y.data)); return m; }
  const sev = (r) => r.categoria === "OBRIGATORIA" ? "ERRO" : "AVISO";
  function fmtD(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

  const avaliadores = {
    MAX_HORAS(regra, ctx){ const lim=Number(regra.parametros?.limite??0), out=[]; for(const [,arr] of porMembro(ctx)){ const h=arr.reduce((s,a)=>s+a.duracaoMin,0)/60; if(lim && h>lim) out.push({regra:regra.nome,severidade:sev(regra),membroNome:arr[0].membroNome,mensagem:`${h.toFixed(1)}h atribuídas excedem o máximo de ${lim}h.`}); } return out; },
    MIN_HORAS(regra, ctx){ const lim=Number(regra.parametros?.limite??0), out=[]; for(const [,arr] of porMembro(ctx)){ const h=arr.reduce((s,a)=>s+a.duracaoMin,0)/60; if(lim && h<lim) out.push({regra:regra.nome,severidade:sev(regra),membroNome:arr[0].membroNome,mensagem:`${h.toFixed(1)}h atribuídas abaixo do mínimo de ${lim}h.`}); } return out; },
    DESCANSO_ENTRE_TURNOS(regra, ctx){ const minH=Number(regra.parametros?.min_horas??0), out=[]; for(const [,arr] of porMembro(ctx)){ for(let i=1;i<arr.length;i++){ const p=arr[i-1],c=arr[i]; const fimP=new Date(`${p.data}T${p.horaInicio}:00`).getTime()+p.duracaoMin*60000; const iniC=new Date(`${c.data}T${c.horaInicio}:00`).getTime(); const desc=(iniC-fimP)/3600000; if(desc>=0 && desc<minH) out.push({regra:regra.nome,severidade:sev(regra),membroNome:c.membroNome,mensagem:`Apenas ${desc.toFixed(1)}h de descanso entre ${p.data} e ${c.data} (mín. ${minH}h).`}); } } return out; },
    MAX_DIAS_CONSECUTIVOS(regra, ctx){ const max=Number(regra.parametros?.max_dias??0), out=[]; for(const [,arr] of porMembro(ctx)){ const dias=[...new Set(arr.map(a=>a.data))].sort(); let seq=dias.length?1:0,mx=seq; for(let i=1;i<dias.length;i++){ const d1=new Date(dias[i-1]).getTime(),d2=new Date(dias[i]).getTime(); seq=(d2-d1===86400000)?seq+1:1; mx=Math.max(mx,seq);} if(max && mx>max) out.push({regra:regra.nome,severidade:sev(regra),membroNome:arr[0].membroNome,mensagem:`${mx} dias consecutivos excedem o máximo de ${max}.`}); } return out; },
    FIM_SEMANA_COMPLETO(regra, ctx){ const min=Number(regra.parametros?.min_por_mes??1), out=[]; for(const [,arr] of porMembro(ctx)){ const trab=new Set(arr.map(a=>a.data)); let livres=0; for(let dia=1;dia<=31;dia++){ const d=new Date(ctx.ano,ctx.mes-1,dia); if(d.getMonth()!==ctx.mes-1) break; if(d.getDay()===6){ const sab=fmtD(d); const dom=fmtD(new Date(ctx.ano,ctx.mes-1,dia+1)); if(!trab.has(sab)&&!trab.has(dom)) livres++; } } if(livres<min) out.push({regra:regra.nome,severidade:sev(regra),membroNome:arr[0].membroNome,mensagem:`${livres} fim(ns) de semana completo(s) livre(s); exigido(s) ${min}.`}); } return out; },
    MAX_TURNOS_NOTURNOS(regra, ctx){ const max=Number(regra.parametros?.max??0), out=[]; for(const [,arr] of porMembro(ctx)){ const n=arr.filter(a=>a.noturno).length; if(max && n>max) out.push({regra:regra.nome,severidade:sev(regra),membroNome:arr[0].membroNome,mensagem:`${n} turnos noturnos excedem o máximo de ${max}.`}); } return out; },
    NECESSIDADES_MINIMAS(regra, ctx){ const min=Number(regra.parametros?.min_trabalhadores??1), out=[], mapa=new Map(); for(const a of ctx.atribuicoes){ const k=`${a.data}|${a.turnoId}`; mapa.set(k,(mapa.get(k)??0)+1);} for(const [k,nn] of mapa){ if(nn<min){ const [data,turnoId]=k.split('|'); const nome=ctx.atribuicoes.find(a=>a.turnoId===turnoId)?.turnoNome??turnoId; out.push({regra:regra.nome,severidade:sev(regra),mensagem:`${data}: turno "${nome}" com ${nn} trabalhador(es), mínimo ${min}.`}); } } return out; },
  };
  function validarEscala(regras, ctx){ const out=[]; for(const r of regras){ const fn=avaliadores[r.tipo]; if(fn) out.push(...fn(r,ctx)); } return out; }

  // =====================================================================
  //  Gerador automático de escalas
  //  Estratégia: guloso, dia a dia, turno a turno. Para cada lugar escolhe o
  //  trabalhador elegível (que não quebra regras obrigatórias) com menor carga
  //  relativa. As regras são lidas do serviço — nada é específico de vigilância.
  // =====================================================================
  function extrairConfig(regras){
    const cfg = { need:1, minDescanso:0, maxDias:Infinity, maxHorasMin:Infinity, maxNoites:Infinity, maxNoitesHard:false, minFolgas:0 };
    for(const r of regras){
      if(!r.ativa) continue;
      const p = r.parametros || {};
      if(r.tipo==='NECESSIDADES_MINIMAS') cfg.need = Number(p.min_trabalhadores)||1;
      else if(r.tipo==='DESCANSO_ENTRE_TURNOS') cfg.minDescanso = Number(p.min_horas)||0;
      else if(r.tipo==='MAX_DIAS_CONSECUTIVOS') cfg.maxDias = Number(p.max_dias)||Infinity;
      else if(r.tipo==='MAX_HORAS' && (p.periodo||'mes')==='mes') cfg.maxHorasMin = (Number(p.limite)||Infinity)*60;
      else if(r.tipo==='MAX_TURNOS_NOTURNOS'){ cfg.maxNoites = Number(p.max)||Infinity; cfg.maxNoitesHard = (r.categoria==='OBRIGATORIA'); }
      else if(r.tipo==='MIN_FOLGAS') cfg.minFolgas = Number(p.min_folgas)||0;
    }
    return cfg;
  }
  function cmpScore(a,b){ for(let i=0;i<a.length;i++){ if(a[i]<b[i]) return -1; if(a[i]>b[i]) return 1; } return 0; }

  // Planeamento puro (sem rede) — testável isoladamente.
  function planearEscala(turnos, membros, regras, ausencias, escala){
    const cfg = extrairConfig(regras);
    const st = new Map(membros.map(m=>[m.id, { minutos:0, noites:0, streak:0, lastWorked:null, endInstant:null, target:(Number(m.horas_contratadas_mes)||0)*60 }]));
    const ausente = (mid,dstr)=> ausencias.some(a=> a.membro_id===mid && dstr>=a.data_inicio && dstr<=a.data_fim);
    const startInstant = (dstr,hi)=> new Date(`${dstr}T${hi}:00`).getTime();
    const dayMs = 86400000;
    const inicio = new Date(escala.data_inicio+'T00:00:00');
    const fim = new Date(escala.data_fim+'T00:00:00');
    const novas = []; let uncovered = 0; let dcount = 0;

    // Reservar fins de semana completos de descanso (regra FIM_SEMANA_COMPLETO).
    // Só é possível se houver folga suficiente (mais trabalhadores do que lugares/dia).
    const forcedOff = new Set();
    const lugaresPorDia = cfg.need * turnos.length;
    if(lugaresPorDia < membros.length){
      const capPorFDS = membros.length - lugaresPorDia;   // quantos podem ter FDS completo em cada fim de semana
      const weekends = [];
      for(let d=new Date(inicio); d<=fim; d=new Date(d.getTime()+dayMs)){
        if(d.getDay()===6){ const dom=new Date(d.getTime()+dayMs); if(dom<=fim) weekends.push([fmtDate(d), fmtDate(dom)]); }
      }
      if(weekends.length>0){
        const cont = weekends.map(()=>0); let wi=0;
        for(const m of membros){
          for(let tent=0; tent<weekends.length; tent++){
            const idx = wi % weekends.length; wi++;
            if(cont[idx] < capPorFDS){ cont[idx]++; forcedOff.add(m.id+'|'+weekends[idx][0]); forcedOff.add(m.id+'|'+weekends[idx][1]); break; }
          }
        }
      }
    }

    for(let d=new Date(inicio); d<=fim; d=new Date(d.getTime()+dayMs)){
      const dstr = fmtDate(d);
      const ontem = fmtDate(new Date(d.getTime()-dayMs));
      const usados = new Set();
      const shift = dcount % turnos.length;                 // roda a ordem para variar quem apanha a noite
      const rot = turnos.slice(shift).concat(turnos.slice(0, shift));
      for(const t of rot){
        for(let slot=0; slot<cfg.need; slot++){
          // 2 passagens: a 1ª respeita a reserva de fim de semana; se ninguém
          // couber, a 2ª ignora essa reserva (mas nunca as regras rígidas) para
          // não deixar o turno por cobrir.
          let best=null, bestScore=null;
          for(let passe=0; passe<2 && !best; passe++){
            for(const m of membros){
              const s = st.get(m.id);
              if(usados.has(m.id)) continue;                                 // um turno por dia por pessoa
              if(ausente(m.id, dstr)) continue;                             // ausências
              if(passe===0 && forcedOff.has(m.id+'|'+dstr)) continue;       // fim de semana reservado (só na 1ª passagem)
              if(s.minutos + t.duracao_min > cfg.maxHorasMin) continue;     // máx. horas/mês
              if(t.noturno && cfg.maxNoitesHard && s.noites+1 > cfg.maxNoites) continue;
              const trabalhouOntem = s.lastWorked===ontem;
              const novaStreak = trabalhouOntem ? s.streak+1 : 1;
              if(novaStreak > cfg.maxDias) continue;                        // máx. dias seguidos
              if(s.endInstant!=null){
                const gap = (startInstant(dstr, t.hora_inicio) - s.endInstant)/3600000;
                if(gap < cfg.minDescanso) continue;                        // descanso entre turnos (e sobreposição)
              }
              const alvo = s.target>0 ? s.target : (cfg.maxHorasMin!==Infinity ? cfg.maxHorasMin : 9600);
              const ratio = s.minutos/alvo;                                 // preencher primeiro quem está mais longe do alvo
              const gapDias = s.lastWorked ? (new Date(dstr) - new Date(s.lastWorked))/dayMs : 99;
              const penNoite = t.noturno ? s.noites : 0;                    // equilibrar noites
              const score = [ratio, penNoite, -gapDias, Math.random()];
              if(bestScore==null || cmpScore(score, bestScore) < 0){ bestScore=score; best=m; }
            }
          }
          if(!best){ uncovered++; continue; }
          const s = st.get(best.id);
          novas.push({ membro_id:best.id, turno_id:t.id, data:dstr });
          s.streak = (s.lastWorked===ontem) ? s.streak+1 : 1;
          s.minutos += t.duracao_min;
          if(t.noturno) s.noites++;
          s.lastWorked = dstr;
          s.endInstant = startInstant(dstr, t.hora_inicio) + t.duracao_min*60000;
          usados.add(best.id);
        }
      }
      dcount++;
    }
    return { novas, uncovered, st, ano:inicio.getFullYear(), mes:inicio.getMonth()+1 };
  }

  // Conta erros (regras obrigatórias) de um plano, para comparar tentativas.
  function contarErros(novas, turnos, membros, regras, escala){
    const tmap = Object.fromEntries(turnos.map(t=>[t.id,t]));
    const mmap = Object.fromEntries(membros.map(m=>[m.id,m]));
    const dd = new Date(escala.data_inicio+'T00:00:00');
    const ctx = { ano:dd.getFullYear(), mes:dd.getMonth()+1, atribuicoes: novas.map(n=>({
      membroId:n.membro_id, membroNome:mmap[n.membro_id]?.trabalhadores?.nome||'', data:n.data,
      turnoId:n.turno_id, turnoNome:tmap[n.turno_id]?.nome||'', duracaoMin:tmap[n.turno_id]?.duracao_min||0,
      noturno:!!tmap[n.turno_id]?.noturno, horaInicio:tmap[n.turno_id]?.hora_inicio||'00:00', atravessaMeiaNoite:!!tmap[n.turno_id]?.atravessa_meia_noite })) };
    const rc = regras.filter(r=>r.ativa).map(r=>({tipo:r.tipo,nome:r.nome,categoria:r.categoria,parametros:r.parametros}));
    return validarEscala(rc, ctx).filter(x=>x.severidade==='ERRO').length;
  }

  // Multi-arranque: corre o planeamento várias vezes e fica com o melhor.
  function planearEscalaMulti(turnos, membros, regras, ausencias, escala, tentativas){
    let best=null, bestErros=Infinity, bestUnc=Infinity;
    for(let i=0; i<(tentativas||12); i++){
      const r = planearEscala(turnos, membros, regras, ausencias, escala);
      const erros = contarErros(r.novas, turnos, membros, regras, escala);
      if(r.uncovered < bestUnc || (r.uncovered===bestUnc && erros < bestErros)){
        best=r; bestUnc=r.uncovered; bestErros=erros;
        if(bestUnc===0 && bestErros===0) break;
      }
    }
    return best;
  }

  async function gerarEscalaAuto(sid, eid, escala){
    const [{data:turnosRaw=[]},{data:membrosRaw=[]},{data:regrasRaw=[]},{data:ausencias=[]}] = await Promise.all([
      DB.turnos(sid), DB.membros(sid), DB.regras(sid), sb.from('ausencias').select('*').eq('servico_id', sid)
    ]);
    const turnos = turnosRaw.filter(t=>t.ativo!==false);
    const membros = membrosRaw.filter(m=>m.ativo!==false);
    const regras = regrasRaw.filter(r=>r.ativa);
    if(turnos.length===0 || membros.length===0){ alert('Precisas de pelo menos um turno e um trabalhador neste serviço.'); return; }

    const { novas, uncovered, st, ano, mes } = planearEscalaMulti(turnos, membros, regras, ausencias, escala, 30);

    const del = await sb.from('atribuicoes').delete().eq('escala_id', eid);
    if(del.error){ alert(del.error.message); return; }
    const rowsA = novas.map(n=>({ servico_id:sid, escala_id:eid, membro_id:n.membro_id, turno_id:n.turno_id, data:n.data, estado:'PLANEADO', origem:'AUTO' }));
    for(let i=0;i<rowsA.length;i+=400){
      const { error } = await sb.from('atribuicoes').insert(rowsA.slice(i,i+400));
      if(error){ alert(error.message); return; }
    }
    const rows = [...st.entries()].map(([mid,s])=>({ servico_id:sid, membro_id:mid, ano, mes, horas_previstas:+(s.minutos/60).toFixed(2), estado:'ABERTO' }));
    if(rows.length) await sb.from('registos_horas').upsert(rows, { onConflict:'membro_id,ano,mes' });

    return { total:novas.length, uncovered };
  }

  // =====================================================================
  //  Componentes de UI (strings)
  // =====================================================================
  const card = (inner, cls="") => `<div class="rounded-xl border border-slate-200 bg-white shadow-sm ${cls}">${inner}</div>`;
  const badge = (txt, tone="slate") => { const t={slate:"bg-slate-100 text-slate-700",green:"bg-emerald-100 text-emerald-700",amber:"bg-amber-100 text-amber-700",red:"bg-red-100 text-red-700",indigo:"bg-indigo-100 text-indigo-700",sky:"bg-sky-100 text-sky-700"}; return `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium ${t[tone]||t.slate}">${esc(txt)}</span>`; };
  const stat = (label,value,tone) => { const c=tone==="green"?"text-emerald-600":tone==="amber"?"text-amber-600":tone==="red"?"text-red-600":"text-slate-900"; return card(`<div class="p-5"><p class="text-sm text-slate-500">${esc(label)}</p><p class="mt-2 text-3xl font-semibold ${c}">${esc(value)}</p></div>`); };
  const inputCls = "w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100";
  const labelCls = "block text-sm font-medium text-slate-700 mb-1";
  const btnPrimary = "inline-flex items-center gap-1.5 rounded-lg bg-indigo-600 px-3.5 py-2 text-sm font-medium text-white hover:bg-indigo-700";
  const btnGhost = "inline-flex items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50";
  const empty = (t,h="") => `<div class="rounded-xl border border-dashed border-slate-300 bg-white/60 p-10 text-center"><p class="text-sm font-medium text-slate-600">${esc(t)}</p>${h?`<p class="mt-1 text-sm text-slate-400">${esc(h)}</p>`:""}</div>`;
  const estadoTone = { RASCUNHO:"amber", VALIDADA:"sky", APROVADA:"green", EM_EXECUCAO:"green", FECHADA:"slate", CANCELADA:"slate" };

  // =====================================================================
  //  Acesso a dados
  // =====================================================================
  const DB = {
    servicos: () => sb.from('servicos').select('*').order('created_at'),
    servico: (id) => sb.from('servicos').select('*').eq('id', id).single(),
    membros: (sid) => sb.from('membros').select('*, trabalhadores(*)').eq('servico_id', sid),
    turnos: (sid) => sb.from('turnos').select('*').eq('servico_id', sid).order('ordem'),
    regras: (sid) => sb.from('regras').select('*').eq('servico_id', sid),

  // =====================================================================
  //  Router
  // =====================================================================
  function parseHash(){
    const h = (location.hash || "#/dashboard").replace(/^#/, "");
    const p = h.split("/").filter(Boolean);
    return p; // ex.: ["servico","<id>","turnos"]
  }

  async function renderApp(){
    const appEl = document.getElementById('app');
    if (SUPABASE_ANON_KEY.startsWith("COLAR")) { appEl.innerHTML = avisoChave(); return; }
    if (!state.session){ appEl.innerHTML = loginView(); wireLogin(); return; }

    const p = parseHash();
    const nav = [
      {href:"#/dashboard", label:"Dashboard", active:p[0]==="dashboard"||p.length===0},
      {href:"#/servicos", label:"Serviços", active:p[0]==="servicos"||p[0]==="servico"},
    ];
    appEl.innerHTML = `
      <div class="flex min-h-screen">
        <aside class="hidden w-60 shrink-0 flex-col border-r border-slate-200 bg-white md:flex">
          <div class="flex items-center gap-2 px-5 py-5">
            <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white">E</div>
            <span class="font-semibold text-slate-900">Escalas</span>
          </div>
          <nav class="flex-1 space-y-1 px-3 py-2 text-sm">
            ${nav.map(n=>`<a href="${n.href}" class="block rounded-lg px-3 py-2 font-medium ${n.active?'bg-indigo-50 text-indigo-700':'text-slate-600 hover:bg-slate-100'}">${n.label}</a>`).join("")}
          </nav>
          <div class="border-t border-slate-200 p-4">
            <p class="text-sm font-medium text-slate-700">${esc(state.user?.user_metadata?.nome || "Gestor")}</p>
            <p class="mb-2 text-xs text-slate-400">${esc(state.user?.email || "")}</p>
            <button id="btn-sair" class="text-xs font-medium text-indigo-600 hover:text-indigo-700">Terminar sessão</button>
          </div>
        </aside>
        <main class="flex-1 overflow-x-hidden">
          <div class="mx-auto max-w-6xl px-6 py-8" id="conteudo">
            <div class="p-10 text-center text-slate-400">A carregar…</div>
          </div>
        </main>
      </div>`;
    document.getElementById('btn-sair').addEventListener('click', async ()=>{ await sb.auth.signOut(); });

    const alvo = document.getElementById('conteudo');
    try {
      if (p[0]==="servicos") await viewServicos(alvo);
      else if (p[0]==="servico" && p[2]==="trabalhadores") await viewTrabalhadores(alvo, p[1]);
      else if (p[0]==="servico" && p[2]==="turnos") await viewTurnos(alvo, p[1]);
      else if (p[0]==="servico" && p[2]==="regras") await viewRegras(alvo, p[1]);
      else if (p[0]==="servico" && p[2]==="escalas") await viewEscalas(alvo, p[1]);
      else if (p[0]==="servico" && p[2]==="escala") await viewEscalaDetalhe(alvo, p[1], p[3], p[4]);
      else if (p[0]==="servico") await viewServicoOverview(alvo, p[1]);
      else await viewDashboard(alvo);
    } catch(e){
      alvo.innerHTML = card(`<div class="p-6 text-sm text-red-600">Ocorreu um erro: ${esc(e.message||e)}</div>`);
      console.error(e);
    }
  }

  function wireLogin(){
    const err = (m)=>{ const e=document.getElementById('login-erro'); e.textContent=m; e.classList.remove('hidden'); };
    document.getElementById('btn-entrar').addEventListener('click', async ()=>{
      const email=document.getElementById('in-email').value.trim(), password=document.getElementById('in-pass').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) err("Credenciais inválidas ou conta por confirmar.");
    });
    document.getElementById('btn-registar').addEventListener('click', async ()=>{
      const email=document.getElementById('in-email').value.trim(), password=document.getElementById('in-pass').value;
      const { error } = await sb.auth.signUp({ email, password });
      if (error) err(error.message); else err("Conta criada. Se o projeto exigir confirmação por email, confirma antes de entrar.");
    });
  }

  async function viewDashboard(el){
    const [{data:servicos=[]},{data:trab=[]},{data:registos=[]}] = await Promise.all([DB.servicos(), sb.from('trabalhadores').select('id'), DB.registos()]);
    const escalasAll = (await sb.from('escalas').select('*')).data || [];
    const hoje=new Date(), ano=hoje.getFullYear(), mes=hoje.getMonth()+1;
    const regMes = registos.filter(r=>r.ano===ano && r.mes===mes);
    const horasPrev = regMes.reduce((s,r)=>s+Number(r.horas_previstas||0),0);
    const rascunhos = escalasAll.filter(e=>e.estado==="RASCUNHO");
    const mesesAbertos = regMes.filter(r=>r.estado==="ABERTO").length;

    const alertas=[];
    for(const e of rascunhos) alertas.push({txt:`Escala "${e.nome}" por validar`, href:`#/servico/${e.servico_id}/escalas`, tone:"amber"});
    if(mesesAbertos>0) alertas.push({txt:`${mesesAbertos} registo(s) de horas por fechar em ${MESES[mes-1]}`, href:`#/servicos`, tone:"sky"});

    el.innerHTML = `
      <div class="mb-6"><h1 class="text-2xl font-semibold tracking-tight text-slate-900">Dashboard</h1>
        <p class="mt-1 text-sm text-slate-500">Visão geral · ${MESES[mes-1]} de ${ano}</p></div>

        ${stat("Serviços ativos", String(servicos.filter(s=>s.ativo).length))}

          ${alertas.length===0?`<p class="text-sm text-slate-400">Sem alertas. Tudo em dia.</p>`:
            `<ul class="space-y-2">${alertas.map(a=>`<li><a href="${a.href}" class="flex items-center justify-between rounded-lg border border-slate-200 px-4 py-3 hover:bg-slate-50"><span class="flex items-center gap-3 text-sm text-slate-700">${badge("ação",a.tone)} ${esc(a.txt)}</span><span class="text-slate-400">→</span></a></li>`).join("")}</ul>`}
        </div>`,"lg:col-span-2")}
        ${card(`<div class="p-5"><h2 class="mb-4 text-sm font-semibold text-slate-700">Acesso rápido</h2>
          <div class="space-y-2 text-sm"><a href="#/servicos" class="block rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Gerir serviços</a>

        </div>`)}
      </div>`;
  }

          ${regras.map(r=>card(`<div class="p-4"><div class="flex items-start justify-between">
            <div><div class="flex items-center gap-2"><span class="font-medium text-slate-800">${esc(r.nome)}</span>
              ${r.categoria==="OBRIGATORIA"?badge("obrigatória","red"):badge("preferencial","amber")}${!r.ativa?badge("inativa"):""}</div>
              <p class="mt-0.5 text-xs text-slate-400">${esc(tipoRegra(r.tipo)?.etiqueta||r.tipo)}</p>
              <p class="mt-1 text-sm text-slate-500">${esc(descreve(r.parametros))}</p></div>
            <div class="flex items-center gap-3">
              <button data-toggle="${r.id}" data-ativa="${r.ativa?1:0}" class="text-xs font-medium text-indigo-600 hover:text-indigo-700">${r.ativa?"desativar":"ativar"}</button>
              <button data-delr="${r.id}" class="text-xs font-medium text-red-500 hover:text-red-700">eliminar</button>
            </div></div></div>`)).join("")}
        </div>
        ${card(`<div class="p-5"><h2 class="mb-4 text-sm font-semibold text-slate-700">Nova regra</h2>
          <div class="space-y-3">
            <div><label class="${labelCls}">Tipo de regra</label><select id="r-tipo" class="${inputCls}">${CATALOGO_REGRAS.map(r=>`<option value="${r.tipo}">${esc(r.etiqueta)}</option>`).join("")}</select>
              <p id="r-desc" class="mt-1 text-xs text-slate-400"></p></div>
            <div><label class="${labelCls}">Nome</label><input id="r-nome" class="${inputCls}"/></div>
            <div><label class="${labelCls}">Categoria</label><select id="r-cat" class="${inputCls}">
              <option value="OBRIGATORIA">Obrigatória (bloqueia validação)</option><option value="PREFERENCIAL">Preferencial (aviso)</option></select></div>
            <div id="r-campos" class="space-y-3"></div>
            <button id="r-add" class="${btnPrimary}">Criar regra</button>
          </div></div>`,"h-fit")}
      </div>`;

    const selTipo=document.getElementById('r-tipo');
    const renderCampos=()=>{
      const def=tipoRegra(selTipo.value);
      document.getElementById('r-desc').textContent=def.descricao;
      document.getElementById('r-nome').value=def.etiqueta;
      document.getElementById('r-cat').value=def.categoriaSugerida;
      document.getElementById('r-campos').innerHTML = def.campos.map(c=>{
        const lab=`${c.etiqueta}${c.sufixo?` (${c.sufixo})`:""}`;
        if(c.tipo==="select") return `<div><label class="${labelCls}">${esc(lab)}</label><select data-p="${c.chave}" class="${inputCls}">${c.opcoes.map(o=>`<option value="${o.valor}" ${String(o.valor)===String(c.omissao)?"selected":""}>${esc(o.etiqueta)}</option>`).join("")}</select></div>`;
        return `<div><label class="${labelCls}">${esc(lab)}</label><input data-p="${c.chave}" type="${c.tipo}" value="${esc(c.omissao??"")}" class="${inputCls}"/></div>`;
      }).join("");
    };
    selTipo.addEventListener('change', renderCampos); renderCampos();

    document.getElementById('r-add').addEventListener('click', async ()=>{
      const def=tipoRegra(selTipo.value);
      const nome=document.getElementById('r-nome').value.trim()||def.etiqueta;
      const categoria=document.getElementById('r-cat').value;
      const parametros={};
      document.querySelectorAll('#r-campos [data-p]').forEach(inp=>{
        const chave=inp.dataset.p; const campo=def.campos.find(c=>c.chave===chave);
        parametros[chave]= campo.tipo==="number" ? Number(inp.value) : inp.value;
      });
      const { error } = await sb.from('regras').insert({ servico_id:sid, tipo:def.tipo, nome, categoria, parametros });
      if(error) return alert(error.message);
      renderApp();
    });
    el.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click', async ()=>{
      await sb.from('regras').update({ ativa: b.dataset.ativa!=="1" }).eq('id', b.dataset.toggle); renderApp();
    }));
    el.querySelectorAll('[data-delr]').forEach(b=>b.addEventListener('click', async ()=>{
      if(!confirm("Eliminar regra?")) return; await sb.from('regras').delete().eq('id', b.dataset.delr); renderApp();
    }));
  }

  async function viewEscalas(el, sid){
    const { html } = await servicoHeader(sid);
    const { data:escalas=[] } = await DB.escalas(sid);
    const hoje=new Date(); const amDefault=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;
    el.innerHTML = html + servicoTabs(sid,"escalas") + `
      <div class="grid gap-6 lg:grid-cols-3">
        <div class="lg:col-span-2 space-y-3">
          ${escalas.length===0?empty("Sem escalas","Cria a primeira escala ao lado."):""}
          ${escalas.map(e=>`<a href="#/servico/${sid}/escala/${e.id}">${card(`<div class="flex items-center justify-between p-4 transition hover:border-indigo-300 hover:shadow">
            <div><p class="font-medium text-slate-800">${esc(e.nome)}</p><p class="text-sm text-slate-500">${esc(e.data_inicio)} → ${esc(e.data_fim)}</p></div>
            ${badge(e.estado.toLowerCase().replace("_"," "), estadoTone[e.estado]||"slate")}</div>`)}</a>`).join("")}
        </div>
        ${card(`<div class="p-5"><h2 class="mb-4 text-sm font-semibold text-slate-700">Nova escala</h2>
          <div class="space-y-3">
            <div><label class="${labelCls}">Nome</label><input id="e-nome" class="${inputCls}" placeholder="Escala ${MESES[hoje.getMonth()]} ${hoje.getFullYear()}"/></div>
            <div><label class="${labelCls}">Mês</label><input id="e-mes" type="month" value="${amDefault}" class="${inputCls}"/></div>
            <button id="e-add" class="${btnPrimary}">Criar escala</button>
            <p class="text-xs text-slate-400">O controlo de horas é sempre mensal.</p>
          </div></div>`,"h-fit")}
      </div>`;
    document.getElementById('e-add').addEventListener('click', async ()=>{
      const nome=document.getElementById('e-nome').value.trim(); const am=document.getElementById('e-mes').value;
      if(!nome||!am) return;
      const [ano,mes]=am.split('-').map(Number);
      const inicio=new Date(ano,mes-1,1), fim=new Date(ano,mes,0);
      const { data, error } = await sb.from('escalas').insert({ servico_id:sid, nome, data_inicio:fmtDate(inicio), data_fim:fmtDate(fim), estado:"RASCUNHO" }).select().single();
      if(error) return alert(error.message);
      location.hash=`#/servico/${sid}/escala/${data.id}`;
    });
  }

  const primeiroNome = (n)=> (n||"").trim().split(/\s+/)[0] || "";

  // Grelha de calendário do mês da escala
  function renderCalendario(escala, turnos, linhas){
    const di = new Date(escala.data_inicio+'T00:00:00');
    const ano = di.getFullYear(), mes = di.getMonth();
    const diasNoMes = new Date(ano, mes+1, 0).getDate();
    const turnosOrd = [...turnos].sort((a,b)=>a.ordem-b.ordem);
    const porData = {};
    for(const l of linhas){ (porData[l.data] = porData[l.data] || []).push(l); }
    const primeiro = new Date(ano, mes, 1);
    const offset = (primeiro.getDay()+6)%7; // 0 = segunda-feira
    const nomesDias = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

    let cells = '';
    for(let i=0;i<offset;i++) cells += `<div></div>`;
    for(let dia=1; dia<=diasNoMes; dia++){
      const dstr = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
      const dow = new Date(ano, mes, dia).getDay();
      const fds = (dow===0 || dow===6);
      const doDia = porData[dstr] || [];
      const linhasTurno = turnosOrd.map(t=>{
        const gente = doDia.filter(l=>l.turnoId===t.id);
        if(gente.length===0)
          return `<div class="flex items-center gap-1 text-[11px] text-red-400"><span class="h-1.5 w-1.5 rounded-full bg-red-300"></span><span class="truncate">${esc(t.nome)}: falta</span></div>`;
        return gente.map(g=>`<div class="flex items-center gap-1 text-[11px]" title="${esc(t.nome)} — ${esc(g.membroNome)}"><span class="h-1.5 w-1.5 rounded-full" style="background:${esc(t.cor)}"></span><span class="truncate text-slate-700">${esc(primeiroNome(g.membroNome))}</span></div>`).join('');
      }).join('');
      cells += `<div class="rounded-lg border ${fds?'border-slate-200 bg-slate-50':'border-slate-100 bg-white'} p-1.5 min-h-[86px]">
        <div class="mb-1 text-xs font-semibold ${fds?'text-slate-400':'text-slate-500'}">${dia}</div>
        <div class="space-y-0.5">${linhasTurno}</div></div>`;
    }
    const legenda = turnosOrd.map(t=>`<span class="inline-flex items-center gap-1 text-xs text-slate-500"><span class="h-2 w-2 rounded-full" style="background:${esc(t.cor)}"></span>${esc(t.nome)} <span class="text-slate-400">${esc(t.hora_inicio)}–${esc(t.hora_fim)}</span></span>`).join('');
    return card(`<div class="p-4">
      <div class="mb-3 flex flex-wrap items-center gap-x-4 gap-y-1">${legenda}<span class="inline-flex items-center gap-1 text-xs text-red-400"><span class="h-2 w-2 rounded-full bg-red-300"></span>turno por cobrir</span></div>
      <div class="overflow-x-auto"><div class="min-w-[720px]">
        <div class="mb-1 grid grid-cols-7 gap-1">${nomesDias.map(d=>`<div class="text-center text-xs font-medium text-slate-400">${d}</div>`).join('')}</div>
        <div class="grid grid-cols-7 gap-1">${cells}</div>
      </div></div>
    </div>`);
  }

  // Resumo por trabalhador (turnos, horas, saldo, noites, folgas, FDS livres)
  function renderResumoEscala(escala, membros, turnos, linhas){
    const di = new Date(escala.data_inicio+'T00:00:00');
    const ano = di.getFullYear(), mes = di.getMonth();
    const diasNoMes = new Date(ano, mes+1, 0).getDate();
    const tById = Object.fromEntries(turnos.map(t=>[t.id,t]));
    const stats = new Map(membros.map(m=>[m.id, { nome:m.trabalhadores?.nome||"", contr:Number(m.horas_contratadas_mes)||0, min:0, noites:0, turnos:0, dias:new Set() }]));
    for(const l of linhas){ const s=stats.get(l.membroId); if(!s) continue; s.min+=l.duracaoMin; s.turnos++; s.dias.add(l.data); if(tById[l.turnoId]?.noturno) s.noites++; }
    const fdsLivres = (diasSet)=>{ let c=0; for(let dia=1;dia<=diasNoMes;dia++){ const d=new Date(ano,mes,dia); if(d.getDay()===6){ const sab=fmtDate(d), dom=fmtDate(new Date(ano,mes,dia+1)); if(!diasSet.has(sab)&&!diasSet.has(dom)) c++; } } return c; };
    const rows = [...stats.values()].map(s=>{
      const horas=s.min/60, folgas=diasNoMes-s.dias.size, saldo=s.contr?horas-s.contr:null;
      const saldoCls = saldo==null?'text-slate-400':saldo>0.05?'text-amber-600':saldo<-0.05?'text-sky-600':'text-emerald-600';
      const fmt1=(x)=>x.toFixed(1).replace('.',',');
      return `<tr>
        <td class="px-4 py-2.5 font-medium text-slate-800">${esc(s.nome)}</td>
        <td class="px-4 py-2.5 text-center text-slate-600">${s.turnos}</td>
        <td class="px-4 py-2.5 text-center text-slate-600">${fmt1(horas)} h</td>
        <td class="px-4 py-2.5 text-center text-slate-500">${s.contr?esc(s.contr)+' h':'—'}</td>
        <td class="px-4 py-2.5 text-center ${saldoCls}">${saldo==null?'—':(saldo>0?'+':'')+fmt1(saldo)+' h'}</td>
        <td class="px-4 py-2.5 text-center text-slate-600">${s.noites}</td>
        <td class="px-4 py-2.5 text-center text-slate-600">${folgas}</td>
        <td class="px-4 py-2.5 text-center text-slate-600">${fdsLivres(s.dias)}</td>
      </tr>`;
    }).join('');
    return card(`<table class="w-full text-sm"><thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-400">
      <tr><th class="px-4 py-3">Trabalhador</th><th class="px-4 py-3 text-center">Turnos</th><th class="px-4 py-3 text-center">Horas</th><th class="px-4 py-3 text-center">Contrat.</th><th class="px-4 py-3 text-center">Saldo</th><th class="px-4 py-3 text-center">Noites</th><th class="px-4 py-3 text-center">Folgas</th><th class="px-4 py-3 text-center">FDS livres</th></tr>
      </thead><tbody class="divide-y divide-slate-100">${rows}</tbody></table>`,"overflow-hidden");
  }

  // Vista em lista (tabela) + formulário de atribuição
  function renderListaEscala(escala, linhas, turnos, membros, rascunho){
    return `<div class="grid gap-6 lg:grid-cols-3">
        <div class="lg:col-span-2">${card(`<table class="w-full text-sm"><thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-400">
          <tr><th class="px-4 py-3">Data</th><th class="px-4 py-3">Turno</th><th class="px-4 py-3">Trabalhador</th><th class="px-4 py-3"></th></tr></thead>
          <tbody class="divide-y divide-slate-100">
          ${linhas.length===0?`<tr><td colspan="4" class="px-4 py-8 text-center text-slate-400">Sem atribuições. Adiciona ao lado ou gera automaticamente.</td></tr>`:
          linhas.map(l=>`<tr><td class="px-4 py-2.5 text-slate-600">${esc(l.data)}</td>
            <td class="px-4 py-2.5"><span class="inline-flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full" style="background:${esc(l.turnoCor)}"></span>${esc(l.turnoNome)}</span></td>
            <td class="px-4 py-2.5 font-medium text-slate-800">${esc(l.membroNome)}</td>
            <td class="px-4 py-2.5 text-right">${rascunho?`<button data-dela="${l.id}" class="text-xs font-medium text-red-500 hover:text-red-700">remover</button>`:""}</td></tr>`).join("")}
          </tbody></table>`,"overflow-hidden")}</div>
        ${card(`<div class="p-5"><h3 class="mb-4 text-sm font-semibold text-slate-700">Adicionar atribuição</h3>
          ${!rascunho?`<p class="text-sm text-slate-400">A escala já não está em rascunho. Reabre-a para editar.</p>`:`
          <div class="space-y-3">
            <div><label class="${labelCls}">Data</label><input id="a-data" type="date" min="${esc(escala.data_inicio)}" max="${esc(escala.data_fim)}" value="${esc(escala.data_inicio)}" class="${inputCls}"/></div>
            <div><label class="${labelCls}">Turno</label><select id="a-turno" class="${inputCls}">${turnos.map(t=>`<option value="${t.id}">${esc(t.nome)} (${esc(t.hora_inicio)}–${esc(t.hora_fim)})</option>`).join("")}</select></div>
            <div><label class="${labelCls}">Trabalhador</label><select id="a-membro" class="${inputCls}">${membros.map(m=>`<option value="${m.id}">${esc(m.trabalhadores?.nome||"")}</option>`).join("")}</select></div>
            <button id="a-add" class="${btnPrimary}">Adicionar</button>
          </div>`}
        </div>`,"h-fit")}
      </div>`;
  }

  async function viewEscalaDetalhe(el, sid, eid, modo){
    const [{data:escala},{data:atr=[]},{data:regrasRaw=[]},{data:membros=[]},{data:turnos=[]}] = await Promise.all([
      DB.escala(eid), DB.atribuicoes(eid), DB.regras(sid), DB.membros(sid), DB.turnos(sid)
    ]);
    if(!escala){ el.innerHTML=empty("Escala não encontrada"); return; }

    const linhas = atr.map(a=>({ id:a.id, data:a.data, turnoId:a.turno_id, turnoNome:a.turnos?.nome||"", turnoCor:a.turnos?.cor||"#999",
      membroId:a.membro_id, membroNome:a.membros?.trabalhadores?.nome||"", duracaoMin:a.turnos?.duracao_min||0 }))
      .sort((x,y)=> x.data.localeCompare(y.data) || x.turnoNome.localeCompare(y.turnoNome));

    const d=new Date(escala.data_inicio);
    const ctx={ ano:d.getFullYear(), mes:d.getMonth()+1, atribuicoes: atr.map(a=>({
      membroId:a.membro_id, membroNome:a.membros?.trabalhadores?.nome||"", data:a.data, turnoId:a.turno_id, turnoNome:a.turnos?.nome||"",
      duracaoMin:a.turnos?.duracao_min||0, noturno:!!a.turnos?.noturno, horaInicio:a.turnos?.hora_inicio||"00:00", atravessaMeiaNoite:!!a.turnos?.atravessa_meia_noite })) };
    const regras = regrasRaw.filter(r=>r.ativa).map(r=>({ tipo:r.tipo, nome:r.nome, categoria:r.categoria, parametros:r.parametros }));
    const violacoes = validarEscala(regras, ctx);
    const erros=violacoes.filter(v=>v.severidade==="ERRO"), avisos=violacoes.filter(v=>v.severidade==="AVISO");
    const totalMin=linhas.reduce((s,l)=>s+l.duracaoMin,0);
    const rascunho = escala.estado==="RASCUNHO";

    const transicoes=[];
    if(rascunho && erros.length===0 && linhas.length>0) transicoes.push(["VALIDADA","Marcar como validada",btnPrimary]);
    if(escala.estado==="VALIDADA"){ transicoes.push(["APROVADA","Aprovar",btnPrimary]); transicoes.push(["RASCUNHO","Reabrir",btnGhost]); }
    if(escala.estado==="APROVADA"){ transicoes.push(["EM_EXECUCAO","Iniciar execução",btnPrimary]); transicoes.push(["RASCUNHO","Reabrir",btnGhost]); }

    const modoVista = (modo==='calendario') ? 'calendario' : 'lista';
    const toggle = `<div class="mb-4 flex gap-2">
      <a href="#/servico/${sid}/escala/${eid}/lista" class="${modoVista==='lista'?btnPrimary:btnGhost}">Lista</a>
      <a href="#/servico/${sid}/escala/${eid}/calendario" class="${modoVista==='calendario'?btnPrimary:btnGhost}">📅 Calendário</a>
    </div>`;
    const corpo = modoVista==='calendario'
      ? renderCalendario(escala, turnos, linhas) + `<div class="mt-6"><h3 class="mb-3 text-sm font-semibold text-slate-700">Resumo por trabalhador</h3>` + renderResumoEscala(escala, membros, turnos, linhas) + `</div>`
      : renderListaEscala(escala, linhas, turnos, membros, rascunho);

    el.innerHTML = `
      <div class="mb-5"><a href="#/servico/${sid}/escalas" class="text-sm text-slate-400 hover:text-slate-600">← Escalas</a></div>
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div><div class="flex items-center gap-2"><h2 class="text-xl font-semibold text-slate-900">${esc(escala.nome)}</h2>${badge(escala.estado.toLowerCase().replace("_"," "), estadoTone[escala.estado]||"slate")}</div>
        <p class="mt-0.5 text-sm text-slate-500">${esc(escala.data_inicio)} → ${esc(escala.data_fim)} · ${fmtHoras(totalMin)} planeadas</p></div>
        <div class="flex flex-wrap gap-2">${rascunho?`<button id="btn-gerar" class="${btnPrimary}">✨ Gerar automaticamente</button>`:""}${transicoes.map(([est,lab,cls])=>`<button data-estado="${est}" class="${cls}">${lab}</button>`).join("")}</div>
      </div>
      ${card(`<div class="p-5"><div class="mb-3 flex items-center gap-2"><h3 class="text-sm font-semibold text-slate-700">Validação</h3>
        ${erros.length===0?badge("sem erros","green"):badge(erros.length+" erro(s)","red")}${avisos.length>0?badge(avisos.length+" aviso(s)","amber"):""}</div>
        ${violacoes.length===0?`<p class="text-sm text-slate-400">A escala cumpre todas as regras ativas.</p>`:
          `<ul class="space-y-1.5">${violacoes.map(v=>`<li class="flex items-start gap-2 text-sm"><span class="${v.severidade==="ERRO"?'text-red-500':'text-amber-500'}">●</span>
          <span class="text-slate-600"><span class="font-medium text-slate-700">${esc(v.regra)}</span>${v.membroNome?" · "+esc(v.membroNome):""} — ${esc(v.mensagem)}</span></li>`).join("")}</ul>`}
        ${rascunho && erros.length>0?`<p class="mt-3 text-xs text-red-500">Resolve os erros obrigatórios para poder validar a escala.</p>`:""}
      </div>`,"mb-6")}
      ${toggle}
      ${corpo}`;

    const gerarBtn = document.getElementById('btn-gerar');
    if(gerarBtn) gerarBtn.addEventListener('click', async ()=>{
      if(linhas.length>0 && !confirm('Isto substitui as atribuições atuais desta escala por uma nova geração automática. Continuar?')) return;
      gerarBtn.disabled=true; gerarBtn.textContent='A gerar…';
      try {
        const res = await gerarEscalaAuto(sid, eid, escala);
        if(res && res.uncovered>0) alert(`Escala gerada com ${res.total} turnos. ${res.uncovered} lugar(es) ficaram por cobrir sem quebrar regras — vê o painel de validação.`);
      } catch(e){ alert('Erro ao gerar: '+(e.message||e)); }
      renderApp();
    });

    el.querySelectorAll('[data-estado]').forEach(b=>b.addEventListener('click', async ()=>{
      await sb.from('escalas').update({ estado:b.dataset.estado }).eq('id', eid);
      await sb.from('eventos_historico').insert({ servico_id:sid, entidade:"ESCALA", entidade_id:eid, acao:"ESTADO_"+b.dataset.estado });
      renderApp();
    }));
    const addBtn=document.getElementById('a-add');
    if(addBtn) addBtn.addEventListener('click', async ()=>{
      const data=document.getElementById('a-data').value, turno_id=document.getElementById('a-turno').value, membro_id=document.getElementById('a-membro').value;
      if(!data||!turno_id||!membro_id) return;
      const { error } = await sb.from('atribuicoes').insert({ servico_id:sid, escala_id:eid, membro_id, turno_id, data, estado:"PLANEADO" });
      if(error) return alert(error.message);
      renderApp();
    });
    el.querySelectorAll('[data-dela]').forEach(b=>b.addEventListener('click', async ()=>{
      await sb.from('atribuicoes').delete().eq('id', b.dataset.dela); renderApp();
    }));
  }

  // =====================================================================
  //  Arranque
  // =====================================================================
  sb.auth.onAuthStateChange((_e, session)=>{ state.session=session; state.user=session?.user||null; renderApp(); });
  window.addEventListener('hashchange', ()=>{ if(state.session) renderApp(); });
  (async ()=>{ const { data:{ session } } = await sb.auth.getSession(); state.session=session; state.user=session?.user||null; renderApp(); })();
