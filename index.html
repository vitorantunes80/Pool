<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Carta Desportiva Municipal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --fundo: #f4f6f4; --sup: #ffffff; --sup2: #eef2ef; --texto: #18211d; --suave: #5b6862;
  --linha: #d9e0db; --acento: #0f6b57; --acento-txt: #ffffff; --acento-suave: #e2f1ec;
  --perigo: #b42318; --perigo-suave: #fdecea; --aviso: #8a5a00; --aviso-suave: #fff4dc;
  --info: #1d5fa8; --info-suave: #e6f0fb; --sombra: 0 1px 2px rgba(16,24,20,.06), 0 4px 16px rgba(16,24,20,.06);
  --raio: 10px; --topo-h: 104px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fundo: #111513; --sup: #1a201d; --sup2: #222a26; --texto: #e5ebe8; --suave: #9ba8a2;
    --linha: #2e3833; --acento: #3fb594; --acento-txt: #08130f; --acento-suave: #173129;
    --perigo: #f28b82; --perigo-suave: #3a1d1b; --aviso: #f2c063; --aviso-suave: #352a12;
    --info: #8ab8f0; --info-suave: #17283c; --sombra: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--fundo); color: var(--texto); }
body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
html.sem-scroll, html.sem-scroll body { overflow: hidden; }
a { color: var(--acento); }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 16px; margin: 0 0 12px; }
h3 { font-size: 14px; margin: 0 0 8px; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
small, .suave { color: var(--suave); }
button, input, select, textarea { font: inherit; color: inherit; }

/* Topo e navegação */
.topo { position: sticky; top: 0; z-index: 900; background: var(--sup); border-bottom: 1px solid var(--linha); padding-top: env(safe-area-inset-top); }
.topo-linha { display: flex; align-items: center; gap: 12px; padding: 10px 16px; max-width: 1240px; margin: 0 auto; }
.marca { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--texto); font-weight: 650; white-space: nowrap; }
.marca svg { width: 26px; height: 26px; flex: none; }
@media (max-width: 520px) { .topo .marca span { display: none; } }
.topo-mun { display: flex; align-items: center; gap: 8px; margin-left: auto; min-width: 0; }
.mun-nome { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topo-mun select { max-width: 200px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--linha); background: var(--sup); }
.nav { display: flex; gap: 4px; padding: 0 12px; max-width: 1240px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: 10px 12px; text-decoration: none; color: var(--suave); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.nav a[aria-current="page"] { color: var(--texto); border-bottom-color: var(--acento); }
.vista { max-width: 1240px; margin: 0 auto; padding: 20px 16px calc(96px + env(safe-area-inset-bottom)); }
.cab-vista { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
.cab-vista .acoes { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.voltar { display: inline-block; margin-bottom: 8px; text-decoration: none; font-size: 14px; }
.carregar { padding: 40px 0; text-align: center; color: var(--suave); }

/* Botões e etiquetas */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--linha); background: var(--sup); cursor: pointer; text-decoration: none; color: var(--texto); font-weight: 550; min-height: 40px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-prim { background: var(--acento); border-color: var(--acento); color: var(--acento-txt); }
.btn-perigo { color: var(--perigo); border-color: var(--perigo); background: transparent; }
.btn-texto { border: 0; background: none; color: var(--suave); cursor: pointer; padding: 8px; }
.btn-icone { border: 0; background: none; font-size: 24px; line-height: 1; cursor: pointer; color: var(--suave); padding: 4px 8px; }
.btn-peq { min-height: 32px; padding: 5px 10px; font-size: 14px; }
.etq { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--sup2); color: var(--suave); white-space: nowrap; }
.etq.funcao { background: var(--acento-suave); color: var(--acento); }
.e-validado { background: var(--acento-suave); color: var(--acento); }
.e-estimado { background: var(--info-suave); color: var(--info); }
.e-desatualizado { background: var(--aviso-suave); color: var(--aviso); }
.e-em_falta, .e-eliminado { background: var(--perigo-suave); color: var(--perigo); }

/* Cartões */
.cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; box-shadow: var(--sombra); margin-bottom: 16px; }
.cartao > header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.cartao > header h2 { margin: 0; }
.cartao > header .acoes { margin-left: auto; display: flex; gap: 8px; }
.numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.numero { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px 16px; }
.numero b { display: block; font-size: 28px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.numero span { color: var(--suave); font-size: 13px; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .duas { grid-template-columns: 1fr; } }
.duas { margin-bottom: 16px; } .duas > .cartao { margin-bottom: 0; }
.nota { background: var(--info-suave); color: var(--texto); border-left: 3px solid var(--info); padding: 10px 12px; border-radius: 6px; font-size: 14px; margin: 0 0 16px; }
.nota.aviso { background: var(--aviso-suave); border-left-color: var(--aviso); }
.vazio { text-align: center; padding: 28px 12px; color: var(--suave); }
.passos { list-style: none; padding: 0; margin: 0; }
.passos li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--linha); }
.passos li:last-child { border-bottom: 0; }
.passos .ok { color: var(--acento); font-weight: 700; width: 18px; flex: none; }
.passos .nao { color: var(--suave); width: 18px; flex: none; }

/* Barras */
.barra { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--sup2); margin: 6px 0 10px; }
.barra span { display: block; height: 100%; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--suave); }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.c-validado { background: #0f6b57; } .c-nao_verificado { background: #9aa6a0; } .c-estimado { background: #3b7fd0; }
.c-desatualizado { background: #d69a1c; } .c-em_falta { background: #c8402f; } .c-nao_aplicavel { background: #cfd6d2; }
.dist td:last-child { width: 40%; }
.mini { height: 8px; background: var(--acento); border-radius: 4px; min-width: 2px; }

/* Filtros e tabelas */
.filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filtros input[type=search] { flex: 1 1 240px; }
.filtros select, .filtros input[type=search] { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--linha); background: var(--sup); font-size: 16px; min-height: 40px; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--suave); }
.alternar { display: inline-flex; border: 1px solid var(--linha); border-radius: 8px; overflow: hidden; }
.alternar button { border: 0; background: var(--sup); padding: 8px 12px; cursor: pointer; min-height: 40px; }
.alternar button[aria-pressed="true"] { background: var(--acento); color: var(--acento-txt); }
.contagem { color: var(--suave); font-size: 14px; margin: 0 0 8px; }
.filtro-rapido { margin-bottom: 10px; font-size: 14px; }
.tabela-envolta { overflow-x: auto; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); }
table.tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabela th { text-align: left; font-weight: 600; color: var(--suave); padding: 10px 12px; border-bottom: 1px solid var(--linha); white-space: nowrap; background: var(--sup2); }
.tabela td { padding: 10px 12px; border-bottom: 1px solid var(--linha); vertical-align: top; }
.tabela tr:last-child td { border-bottom: 0; }
.tabela tr[data-href], .tabela tr[data-editar] { cursor: pointer; }
.tabela tr[data-href]:hover td, .tabela tr[data-editar]:hover td { background: var(--acento-suave); }
.tabela tr.eliminado td { opacity: .55; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cod { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; white-space: nowrap; }
@media (max-width: 720px) {
  .tabela.resp thead { display: none; }
  .tabela.resp, .tabela.resp tbody, .tabela.resp tr, .tabela.resp td { display: block; width: 100%; }
  .tabela.resp tr { padding: 10px 12px; border-bottom: 1px solid var(--linha); }
  .tabela.resp td { border: 0; padding: 2px 0; display: flex; gap: 8px; }
  .tabela.resp td::before { content: attr(data-l); color: var(--suave); min-width: 110px; flex: none; font-size: 13px; }
  .tabela.resp td.titulo { font-weight: 600; font-size: 15px; }
  .tabela.resp td.num { text-align: left; }
  .tabela.resp td.titulo::before { display: none; }
  .tabela-envolta { border-radius: var(--raio); }
}

/* Formulários */
.grelha { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
@media (max-width: 640px) { .grelha { grid-template-columns: 1fr; } }
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo.inteira { grid-column: 1 / -1; }
.campo label { font-size: 13px; font-weight: 600; color: var(--suave); }
.campo input, .campo select, .campo textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--linha); border-radius: 8px; background: var(--sup); font-size: 16px; min-height: 42px; }
.campo textarea { resize: vertical; min-height: 70px; }
.campo input:focus, .campo select:focus, .campo textarea:focus, .filtros input:focus, .filtros select:focus { outline: 2px solid var(--acento); outline-offset: -1px; border-color: var(--acento); }
.campo :disabled { background: var(--sup2); color: var(--texto); opacity: 1; -webkit-text-fill-color: var(--texto); }
.campo-check { justify-content: flex-end; }
.campo-check label { display: flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 500; color: var(--texto); min-height: 42px; }
.campo-check input { width: 20px; height: 20px; min-height: 0; }
.ajuda { font-size: 12.5px; }
.obrig { color: var(--perigo); }
.erros { background: var(--perigo-suave); color: var(--perigo); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; white-space: pre-line; font-size: 14px; }
.barra-gravar { position: sticky; bottom: 0; z-index: 800; display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); margin: 0 -16px; background: color-mix(in srgb, var(--fundo) 92%, transparent); backdrop-filter: blur(6px); border-top: 1px solid var(--linha); }
.barra-gravar .estado-grav { margin-right: auto; font-size: 13px; color: var(--suave); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--linha); border-radius: 999px; font-size: 14px; cursor: pointer; }
.chips input:checked + span { font-weight: 600; color: var(--acento); }

/* Mapas */
.mapa { height: 320px; border-radius: var(--raio); border: 1px solid var(--linha); overflow: hidden; z-index: 0; }
.mapa.grande { height: min(70vh, 640px); }
.mapa-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; font-size: 14px; }
.ponto-ficha { width: 22px; height: 22px; border-radius: 50%; background: var(--acento); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
.leaflet-container { font: inherit; }
.leaflet-tooltip.rotulo-freg { background: transparent; border: 0; box-shadow: none; font-weight: 600; color: #234; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }

/* Anexos */
.anexos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.anexo { border: 1px solid var(--linha); border-radius: 8px; overflow: hidden; background: var(--sup2); font-size: 13px; }
.anexo .previa { aspect-ratio: 4/3; background: var(--sup2) center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--suave); font-weight: 600; text-decoration: none; }
.anexo .info { padding: 6px 8px; background: var(--sup); }
.anexo .info div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Histórico */
.hist { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.hist li { padding: 8px 0; border-bottom: 1px solid var(--linha); }
.hist li:last-child { border-bottom: 0; }

/* Entrada */
.entrada { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.entrada .cartao { width: 100%; max-width: 400px; padding: 28px 24px; }
.entrada .marca { margin-bottom: 4px; font-size: 18px; }
.entrada form { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
.entrada .btn-prim { width: 100%; min-height: 46px; }

/* Modal */
.modal-fundo { position: fixed; inset: 0; z-index: 2000; background: rgba(10,16,13,.5); display: flex; align-items: center; justify-content: center; padding: 16px; overscroll-behavior: contain; }
.modal { background: var(--sup); border-radius: 14px; width: 100%; max-width: 560px; max-height: 92dvh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal.largo { max-width: 760px; }
.modal > header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--linha); }
.modal > header h2 { margin: 0; font-size: 17px; }
.modal > header .btn-icone { margin-left: auto; }
.modal-corpo { padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.modal > footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linha); }
@media (max-width: 640px) {
  .modal-fundo { align-items: flex-end; padding: 0; }
  .modal, .modal.largo { max-width: none; border-radius: 14px 14px 0 0; max-height: 92dvh; }
  .modal > footer .btn { flex: 1; }
}

/* Avisos */
#avisos { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 3000; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
.aviso { background: #18211d; color: #fff; padding: 12px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 14px; transition: opacity .3s, transform .3s; }
.aviso.erro { background: #8f1d14; }
.aviso.sai { opacity: 0; transform: translateY(8px); }
</style>
</head>

<script>

const esc = v => v == null ? '' : String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

};
// Nomes legíveis dos campos, usados no histórico de alterações.
const ROT_CAMPOS = {

function msgErro(e) {
  if (!e) return 'Ocorreu um erro desconhecido.';
  const m = e.message || String(e);
  if (e.code === '23505') return 'Já existe um registo com esses dados (código, NIF ou nome repetido). Altere o valor e volte a gravar.';
  if (e.code === '23503') return 'O registo refere outro que não existe ou que pertence a outro município.';
  if (e.code === '23514') { const k = (m.match(/constraint "([^"]+)"/) || [])[1]; return MSG_CHECK[k] || 'Há um valor fora dos limites permitidos.'; }
  if (e.code === '42501') return /row-level security|permission denied/i.test(m) ? 'Não tem permissão para esta operação.' : m;
  if (e.code === '22P02' || e.code === '22007') return 'Há um valor num formato inválido.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem ligação ao servidor. Verifique a internet e tente de novo.';
  if (m === 'Invalid login credentials') return 'Email ou palavra-passe incorretos.';
  if (/Email not confirmed/i.test(m)) return 'O email ainda não foi confirmado.';
  return m;
}

function bloquearScroll(on) { document.documentElement.classList.toggle('sem-scroll', on); }

function abrirModal({ titulo, corpo, acoes = [{ rotulo: 'Fechar' }], largo = false, aoAbrir }) {
  return new Promise(resolve => {
    const raiz = $('#modal-root');
    const w = document.createElement('div');
    w.className = 'modal-fundo';
    w.innerHTML = `<div class="modal${largo ? ' largo' : ''}" role="dialog" aria-modal="true" aria-labelledby="mt${raiz.children.length}">
      <header><h2 id="mt${raiz.children.length}">${esc(titulo)}</h2><button type="button" class="btn-icone" data-fechar aria-label="Fechar">×</button></header>
      <div class="modal-corpo"><div class="erros" hidden></div>${corpo}</div>
      <footer>${acoes.map((a, i) => `<button type="button" class="btn ${a.classe || ''}" data-acao="${i}">${esc(a.rotulo)}</button>`).join('')}</footer></div>`;
    raiz.appendChild(w); bloquearScroll(true);
    const fechar = val => { w.remove(); document.removeEventListener('keydown', tecla); if (!raiz.children.length) bloquearScroll(false); resolve(val); };
    const tecla = ev => { if (ev.key === 'Escape' && raiz.lastElementChild === w) fechar(null); };
    document.addEventListener('keydown', tecla);
    w.addEventListener('click', async ev => {
      if (ev.target === w || ev.target.closest('[data-fechar]')) return fechar(null);
      const b = ev.target.closest('[data-acao]'); if (!b) return;
      const a = acoes[+b.dataset.acao];
      if (!a.fazer) return fechar('valor' in a ? a.valor : true);
      const caixa = $('.erros', w); caixa.hidden = true;
      $$('[data-acao]', w).forEach(x => x.disabled = true);
      try {
        const r = await a.fazer(w);
        if (r !== false) fechar(r === undefined ? true : r);
      } catch (e) {
        caixa.textContent = msgErro(e); caixa.hidden = false; $('.modal-corpo', w).scrollTop = 0;
      } finally { $$('[data-acao]', w).forEach(x => x.disabled = false); }
    });
    w.addEventListener('submit', ev => { ev.preventDefault(); $(`[data-acao="${acoes.length - 1}"]`, w)?.click(); });
    if (aoAbrir) aoAbrir(w);
    if (matchMedia('(pointer: fine)').matches) setTimeout(() => $('input:not([type=checkbox]):not([disabled]),select:not([disabled]),textarea:not([disabled])', w)?.focus(), 30);
  });
}
const confirmar = (titulo, texto, rotulo = 'Confirmar', perigo = false) => abrirModal({

function campoHtml(c, v) {
  const id = 'f_' + c.n, dis = c.so_leitura ? ' disabled' : '', req = c.obrig ? ' required' : '';
  const cls = 'campo' + (c.larg === 'inteira' ? ' inteira' : '');
  const ajuda = c.ajuda ? `<small class="ajuda">${esc(c.ajuda)}</small>` : '';
  const rot = `<label for="${id}">${esc(c.r)}${c.obrig ? ' <span class="obrig" aria-hidden="true">*</span>' : ''}</label>`;
  let inp;
  if (c.t === 'checkbox') return `<div class="${cls} campo-check" data-campo="${c.n}"><label><input type="checkbox" id="${id}" name="${c.n}"${v ? ' checked' : ''}${dis}> ${esc(c.r)}</label>${ajuda}</div>`;
  if (c.t === 'select' || c.t === 'bool') {
    const lista = c.t === 'bool' ? [['true', 'Sim'], ['false', 'Não']] : c.ops;
    const atual = v == null ? '' : String(v);
    inp = `<select id="${id}" name="${c.n}"${req}${dis}>${c.vazio === false ? '' : `<option value="">${esc(c.vazio || '—')}</option>`}${lista.map(([val, lab, x]) => `<option value="${esc(val)}"${atual === String(val) ? ' selected' : ''}${x && x.disabled ? ' disabled' : ''}>${esc(lab)}</option>`).join('')}</select>`;
  } else if (c.t === 'textarea') {
    inp = `<textarea id="${id}" name="${c.n}" rows="${c.linhas || 3}"${req}${dis}>${esc(v)}</textarea>`;
  } else if (c.t === 'number' || c.t === 'int') {
    inp = `<input id="${id}" name="${c.n}" type="text" inputmode="${c.t === 'int' ? 'numeric' : 'decimal'}" value="${v == null ? '' : esc(String(v).replace('.', ','))}"${req}${dis}>`;
  } else {
    const val = c.t === 'date' && v ? String(v).substring(0, 10) : (v ?? '');
    const lista = c.lista ? ` list="l_${c.n}"` : '';
    inp = `<input id="${id}" name="${c.n}" type="${c.t || 'text'}" value="${esc(val)}"${c.max ? ` maxlength="${c.max}"` : ''}${c.ph ? ` placeholder="${esc(c.ph)}"` : ''}${c.t === 'email' ? ' autocapitalize="off"' : ''}${lista}${req}${dis}>`
      + (c.lista ? `<datalist id="l_${c.n}">${c.lista.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '');
  }
  return `<div class="${cls}" data-campo="${c.n}">${rot}${inp}${ajuda}</div>`;
}
const formHtml = (campos, valores = {}) => `<div class="grelha">${campos.map(c => campoHtml(c, valores[c.n] ?? c.padrao)).join('')}</div>`;
const soLeitura = campos => campos.map(c => ({ ...c, so_leitura: true }));

function lerForm(raiz, campos) {
  const d = {}, erros = [];
  for (const c of campos) {
    if (c.so_leitura) continue;
    const el = raiz.querySelector(`[name="${c.n}"]`); if (!el) continue;
    let v;
    if (c.t === 'checkbox') v = el.checked;
    else {
      v = el.value.trim();
      if (v === '') v = null;
      else if (c.t === 'bool') v = v === 'true';
      else if (c.t === 'number' || c.t === 'int') {
        const x = Number(v.replace(/\s/g, '').replace(',', '.'));
        if (Number.isNaN(x) || (c.t === 'int' && !Number.isInteger(x))) { erros.push(`${c.r}: indique um número${c.t === 'int' ? ' inteiro' : ''}.`); continue; }
        if (x < 0) { erros.push(`${c.r}: não pode ser negativo.`); continue; }
        v = x;
      } else if (c.re && !c.re.test(v)) { erros.push(`${c.r}: ${c.reMsg}`); continue; }
    }
    if (c.obrig && v === null) erros.push(`${c.r}: campo obrigatório.`);
    d[c.n] = v;
  }
  return { dados: d, erros };
}
function mostrarErros(caixa, erros) {
  caixa.textContent = erros.join('\n'); caixa.hidden = !erros.length;
  if (erros.length) caixa.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Janela de edição genérica de um registo (fontes, catálogos, espaços, unidades…).
function modalRegisto({ titulo, tabela, campos, reg, fixos = {}, ro = false, extraHtml = '', aoAbrir, validar, depois }) {
  const lista = ro ? soLeitura(campos) : campos;
  return abrirModal({
    titulo, largo: campos.length > 6, aoAbrir,
    corpo: `<form novalidate>${formHtml(lista, reg || {})}${extraHtml}</form>`,
    acoes: ro ? [{ rotulo: 'Fechar', valor: null }] : [{ rotulo: 'Cancelar', valor: null }, {
      rotulo: 'Gravar', classe: 'btn-prim', fazer: async w => {
        const { dados: d, erros } = lerForm(w, campos);
        if (validar) validar(d, erros, w);
        if (erros.length) throw { message: erros.join('\n') };
        Object.assign(d, fixos);
        let r;
        if (reg && reg.id) {
          const res = await dados(sb.from(tabela).update(d).eq('id', reg.id).select());
          if (!res.length) throw semPermissao();
          r = res[0];
        } else r = await dados(sb.from(tabela).insert(d).select().single());
        if (depois) await depois(r, w);
        return r;
      },
    }],
  });
}

function proximoCodigo(codigos, prefixo) {
  let max = 0; const re = new RegExp(`^${prefixo}-(\\d+)$`);

}

  [/^#\/instalacoes\/nova$/, el => vInstalacao(el, null)],

function barraQualidade(titulo, lista) {
  const total = lista.length;
  if (!total) return `<p class="suave" style="margin:0 0 10px">${esc(titulo)}: sem registos.</p>`;
  const cont = Object.fromEntries(ESTADOS_ORDEM.map(e => [e, lista.filter(x => x.estado_dado === e).length]));
  const val = cont.validado;
  return `<div><strong>${esc(titulo)}</strong> <span class="suave">· ${fmtNum(val)} de ${fmtNum(total)} validados (${fmtNum(val / total * 100)}%)</span>
    <div class="barra" role="img" aria-label="${esc(ESTADOS_ORDEM.filter(e => cont[e]).map(e => `${ROT.estado_dado[e]}: ${cont[e]}`).join(', '))}">${ESTADOS_ORDEM.filter(e => cont[e]).map(e => `<span class="c-${e}" style="width:${cont[e] / total * 100}%" title="${ROT.estado_dado[e]}: ${cont[e]}"></span>`).join('')}</div></div>`;
}
function ligarLinhas(raiz) {
  raiz.addEventListener('click', ev => {
    const tr = ev.target.closest('tr[data-href]');
    if (tr && !ev.target.closest('a,button,input,select')) location.hash = tr.dataset.href;
  });
}

/* ---------------------------------------------------------------- instalações: lista */
const RAPIDOS = {
  sem_local: ['Sem localização no mapa', i => !i.localizacao],
  sem_tip: ['Sem tipologia', i => !i.tipologia_id],
  sem_freg: ['Sem freguesia', i => !i.freguesia_id],
  por_validar: ['Por validar', i => i.estado_dado !== 'validado'],
};
async function vInstalacoes(el, params) {
  const m = S.municipio.id, c = await carregarCache();
  const todas = await dados(sb.from('instalacao').select('id,codigo,designacao,tipologia_id,natureza,freguesia_id,localizacao,estado_dado,estado_operacional,morada,codigo_postal,abrangida_dl141_2009,data_recolha,fonte_id,proprietario_entidade_id,proprietario_texto,gestor_entidade_id,gestor_texto,atualizado_em,eliminado_em').eq('municipio_id', m).order('codigo'));
  const f = { texto: '', freg: params.get('freg') || '', tip: '', estado: '', nat: '', elim: false, rapido: RAPIDOS[params.get('f')] ? params.get('f') : '', vista: params.get('vista') === 'mapa' ? 'mapa' : 'lista' };
  const optsSel = (pairs, val) => pairs.map(([v, l]) => `<option value="${esc(v)}"${v === val ? ' selected' : ''}>${esc(l)}</option>`).join('');
  el.innerHTML = `
    <div class="cab-vista"><h1>Instalações</h1><div class="acoes">
      <button class="btn" id="exp" type="button">Exportar CSV</button>
      ${pode.editar() ? '<a class="btn btn-prim" href="#/instalacoes/nova">Nova instalação</a>' : ''}</div></div>
    <div class="filtros">
      <input type="search" id="f-texto" placeholder="Pesquisar código, designação ou morada" aria-label="Pesquisar">
      <select id="f-freg" aria-label="Freguesia"><option value="">Todas as freguesias</option><option value="__sem"${f.freg === '__sem' ? ' selected' : ''}>Sem freguesia</option>${optsSel(c.freguesias.map(x => [x.id, x.nome + (emVigor(x) ? '' : ' (extinta)')]), f.freg)}</select>
      <select id="f-tip" aria-label="Tipologia"><option value="">Todas as tipologias</option>${optsSel(c.tipologias.map(t => [t.id, t.nome]), '')}</select>
      <select id="f-estado" aria-label="Estado do dado"><option value="">Qualquer estado do dado</option>${optsSel(ops(ROT.estado_dado), '')}</select>
      <select id="f-nat" aria-label="Natureza"><option value="">Qualquer natureza</option>${optsSel(ops(ROT.natureza), '')}</select>
      <label class="chk"><input type="checkbox" id="f-elim"> Mostrar eliminadas</label>
      <div class="alternar" role="group" aria-label="Vista"><button type="button" data-vista="lista">Lista</button><button type="button" data-vista="mapa">Mapa</button></div>
    </div>
    ${f.rapido ? `<p class="filtro-rapido">Filtro: <strong>${esc(RAPIDOS[f.rapido][0])}</strong> · <a href="#/instalacoes">limpar</a></p>` : ''}
    <p class="contagem" id="cont"></p><div id="res"></div>`;

  const filtrar = () => {
    const t = f.texto.toLowerCase();
    return todas.filter(i => (f.elim || !i.eliminado_em)
      && (!t || [i.codigo, i.designacao, i.morada].some(x => (x || '').toLowerCase().includes(t)))
      && (!f.freg || (f.freg === '__sem' ? !i.freguesia_id : i.freguesia_id === f.freg))
      && (!f.tip || i.tipologia_id === f.tip) && (!f.estado || i.estado_dado === f.estado) && (!f.nat || i.natureza === f.nat)
      && (!f.rapido || RAPIDOS[f.rapido][1](i)));
  };
  const desenhar = async () => {
    const r = filtrar();
    $$('.alternar button', el).forEach(b => b.setAttribute('aria-pressed', b.dataset.vista === f.vista));
    $('#cont', el).textContent = `${fmtNum(r.length)} de ${fmtNum(todas.filter(i => !i.eliminado_em).length)} instalações`;
    const res = $('#res', el);
    limparMapas();
    if (f.vista === 'lista') {
      res.innerHTML = r.length ? `<div class="tabela-envolta"><table class="tabela resp"><thead><tr><th>Código</th><th>Designação</th><th>Tipologia</th><th>Freguesia</th><th>Natureza</th><th>Estado do dado</th></tr></thead><tbody>
        ${r.map(i => `<tr data-href="#/instalacoes/${i.id}"${i.eliminado_em ? ' class="eliminado"' : ''}>
          <td class="cod" data-l="Código">${esc(i.codigo)}</td>
          <td class="titulo" data-l="Designação"><a href="#/instalacoes/${i.id}">${esc(i.designacao)}</a>${i.eliminado_em ? ' <span class="etq e-eliminado">Eliminada</span>' : ''}</td>
          <td data-l="Tipologia">${esc(nomeDe(c.t, i.tipologia_id)) || '<span class="suave">—</span>'}</td>
          <td data-l="Freguesia">${esc(nomeDe(c.u, i.freguesia_id)) || '<span class="suave">—</span>'}</td>
          <td data-l="Natureza">${esc(ROT.natureza[i.natureza])}</td>
          <td data-l="Estado">${etqEstado(i.estado_dado)}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="cartao vazio">${todas.length ? 'Nenhuma instalação corresponde aos filtros.' : `Ainda não há instalações registadas.${pode.editar() ? ' <a href="#/instalacoes/nova">Registar a primeira</a>.' : ''}`}</div>`;
    } else {
      const comPonto = r.filter(i => i.localizacao);

      const mapa = novoMapa($('#mapa-lista', el), { scrollWheelZoom: true });
      const cor = getComputedStyle(document.documentElement).getPropertyValue('--acento').trim();
      const pts = comPonto.map(i => {
        const p = pontoDe(i.localizacao);
        L.circleMarker(p, { radius: 8, color: '#fff', weight: 2, fillColor: i.estado_dado === 'validado' ? cor : '#8a9690', fillOpacity: 1 }).addTo(mapa)
          .bindPopup(`<strong>${esc(i.designacao)}</strong><br>${esc(nomeDe(c.t, i.tipologia_id) || 'Sem tipologia')}<br>${etqEstado(i.estado_dado)}<br><a href="#/instalacoes/${i.id}">Abrir ficha</a>`);
        return p;
      });
      try {
        const geoms = await geometriasFreguesias();
        const camada = camadaFreguesias(mapa, geoms);
        if (pts.length) mapa.fitBounds(L.latLngBounds(pts).pad(0.15), { maxZoom: 16 });
        else if (camada) mapa.fitBounds(camada.getBounds());
      } catch (e) { if (pts.length) mapa.fitBounds(L.latLngBounds(pts).pad(0.15), { maxZoom: 16 }); }
    }
  };
  let tempo;
  $('#f-texto', el).oninput = ev => { clearTimeout(tempo); tempo = setTimeout(() => { f.texto = ev.target.value.trim(); desenhar(); }, 200); };
  [['#f-freg', 'freg'], ['#f-tip', 'tip'], ['#f-estado', 'estado'], ['#f-nat', 'nat']].forEach(([s, k]) => { $(s, el).onchange = ev => { f[k] = ev.target.value; desenhar(); }; });
  $('#f-elim', el).onchange = ev => { f.elim = ev.target.checked; desenhar(); };
  $$('.alternar button', el).forEach(b => b.onclick = () => { f.vista = b.dataset.vista; desenhar(); });
  $('#exp', el).onclick = async () => {

      ['Código', i => i.codigo], ['Designação', i => i.designacao], ['Tipologia', i => nomeDe(c.t, i.tipologia_id)],
      ['Natureza', i => ROT.natureza[i.natureza]], ['Freguesia', i => nomeDe(c.u, i.freguesia_id)], ['Morada', i => i.morada], ['Código postal', i => i.codigo_postal],
      ['Latitude', i => coord(i, 0)], ['Longitude', i => coord(i, 1)],
      ['Proprietário', i => nomeDe(c.e, i.proprietario_entidade_id) || i.proprietario_texto], ['Entidade gestora', i => nomeDe(c.e, i.gestor_entidade_id) || i.gestor_texto],
      ['Estado operacional', i => ROT.operacional[i.estado_operacional]], ['Abrangida DL 141/2009', i => ROT.snv[i.abrangida_dl141_2009]],
      ['Estado do dado', i => ROT.estado_dado[i.estado_dado]], ['Data de recolha', i => dataPT(i.data_recolha)], ['Fonte', i => nomeDe(c.f, i.fonte_id, 'titulo')],
      ['Atualizado em', i => dataHoraPT(i.atualizado_em)], ['Eliminada', i => i.eliminado_em ? 'Sim' : ''],
    ]);
    descarregar(`instalacoes_${S.municipio.codigo_dicofre}_${hojeISO()}.csv`, conteudo);
    registarExportacao('instalacoes', { ...f, linhas: r.length });
  };
  ligarLinhas(el);
  desenhar();
}

/* ---------------------------------------------------------------- ações comuns de ficha */
async function validarRegisto(tabela, id) {
  const r = await dados(sb.from(tabela).update({ estado_dado: 'validado' }).eq('id', id).select('id'));
  if (!r.length) throw semPermissao();
  aviso('Registo validado.');
}
async function eliminarRegisto(tabela, id, eliminar) {
  if (eliminar && !await confirmar('Eliminar registo', 'O registo deixa de aparecer nas listas, mas fica guardado e pode ser reposto. Continuar?', 'Eliminar', true)) return false;
  const r = await dados(sb.from(tabela).update({ eliminado_em: eliminar ? new Date().toISOString() : null }).eq('id', id).select('id'));
  if (!r.length) throw semPermissao();
  aviso(eliminar ? 'Registo eliminado.' : 'Registo reposto.');
  return true;
}
function botoesFicha(reg, tabela) {
  if (!reg) return '';
  const b = [];
  if (pode.validar() && reg.estado_dado !== 'validado' && !reg.eliminado_em) b.push('<button class="btn" type="button" data-f="validar">Validar dados</button>');
  if (pode.editar()) b.push(reg.eliminado_em ? '<button class="btn" type="button" data-f="repor">Repor</button>' : '<button class="btn btn-perigo" type="button" data-f="eliminar">Eliminar</button>');
  return b.join('');
}
function ligarBotoesFicha(el, tabela, reg) {
  $$('[data-f]', el).forEach(b => b.onclick = async () => {
    try {
      if (b.dataset.f === 'validar') await validarRegisto(tabela, reg.id);
      else if (!await eliminarRegisto(tabela, reg.id, b.dataset.f === 'eliminar')) return;
      invalidarCache(); navegar();
    } catch (e) { aviso(msgErro(e), 'erro'); }
  });
}
async function secaoHistorico(caixa, tabela, id) {
  if (!pode.auditar()) { caixa.remove(); return; }
  const [linhas, perfis] = await Promise.all([
    dados(sb.from('auditoria').select('em,operacao,autor,antes,depois').eq('tabela', tabela).eq('registo_id', id).order('em', { ascending: false }).limit(30)),
    dados(sb.from('perfil_utilizador').select('user_id,nome_exibicao').eq('municipio_id', S.municipio.id)),
  ]);
  const nomes = new Map(perfis.map(p => [p.user_id, p.nome_exibicao]));
  const ignorar = new Set(['atualizado_em', 'atualizado_por', 'criado_em', 'criado_por']);
  const alterados = l => l.operacao === 'INSERT' ? 'Registo criado' : Object.keys(l.depois || {}).filter(k => !ignorar.has(k) && JSON.stringify(l.antes?.[k]) !== JSON.stringify(l.depois[k])).map(k => ROT_CAMPOS[k] || k).join(', ') || 'Sem alterações de conteúdo';
  caixa.innerHTML = `<header><h2>Histórico de alterações</h2></header>${linhas.length ? `<ul class="hist">${linhas.map(l => `<li><strong>${dataHoraPT(l.em)}</strong> · ${esc(l.autor ? (nomes.get(l.autor) || 'Utilizador ' + l.autor.substring(0, 8)) : 'Sistema')}<br><span class="suave">${esc(alterados(l))}</span></li>`).join('')}</ul>` : '<p class="vazio">Sem registos.</p>'}`;
}

/* ---------------------------------------------------------------- instalação: ficha */
function camposInstalacao(reg) {
  const c = S.cache;
  return {
    ident: [
      { n: 'codigo', r: 'Código', obrig: true, max: 30, ajuda: 'Identificador legível, único no município.' },
      { n: 'natureza', r: 'Natureza', t: 'select', ops: ops(ROT.natureza), obrig: true },
      { n: 'designacao', r: 'Designação', obrig: true, larg: 'inteira' },
      { n: 'tipologia_id', r: 'Tipologia', t: 'select', ops: opsTip(reg?.tipologia_id), vazio: '— por classificar —', ajuda: c.tipologias.length ? '' : 'Ainda não há tipologias. Crie-as em Catálogos.' },
      { n: 'estado_operacional', r: 'Estado operacional', t: 'select', ops: ops(ROT.operacional), vazio: false, padrao: 'em_funcionamento' },

async function vInstalacao(el, id) {
  const m = S.municipio.id, c = await carregarCache();
  let reg = null;
  if (id) {
    reg = await dados(sb.from('instalacao').select('*').eq('id', id).maybeSingle());

  } else if (!pode.editar()) { location.replace('#/instalacoes'); return; }
  const ro = !pode.editar();
  let cs = camposInstalacao(reg);
  if (ro) cs = Object.fromEntries(Object.entries(cs).map(([k, v]) => [k, soLeitura(v)]));
  const valores = reg ? { ...reg } : {};
  if (!reg) {
    const cods = await dados(sb.from('instalacao').select('codigo').eq('municipio_id', m));
    valores.codigo = proximoCodigo(cods.map(x => x.codigo), 'INST');
    valores.data_recolha = hojeISO();
  }
  let ponto = pontoDe(reg?.localizacao);
  const manual = !!reg?.freguesia_manual;

  el.innerHTML = `
    <a class="voltar" href="#/instalacoes">‹ Instalações</a>
    <div class="cab-vista"><h1>${reg ? esc(reg.designacao) : 'Nova instalação'}</h1>
      ${reg ? `<span class="cod">${esc(reg.codigo)}</span> ${etqEstado(reg.estado_dado)}${reg.eliminado_em ? ' <span class="etq e-eliminado">Eliminada</span>' : ''}` : ''}
      <div class="acoes">${botoesFicha(reg, 'instalacao')}</div></div>
    <form id="f-inst" novalidate>
      <div class="erros" hidden></div>
      <section class="cartao"><header><h2>Identificação</h2></header>${formHtml(cs.ident, valores)}</section>
      <section class="cartao"><header><h2>Localização</h2></header>
        ${formHtml(cs.local, valores)}
        <div style="margin-top:12px"><div class="mapa" id="mapa-ficha"></div>
          <div class="mapa-acoes">${ro ? '' : '<span class="suave">Toque no mapa para marcar o local. Pode arrastar o ponto.</span><button class="btn btn-peq" type="button" id="gps">Usar a minha localização</button><button class="btn btn-peq" type="button" id="limpar-ponto">Limpar ponto</button>'}
            <span id="coords" class="suave cod"></span></div></div>
        <div class="grelha" style="margin-top:14px">
          <div class="campo"><label>Freguesia</label><div id="freg-auto" style="padding:10px 0"></div></div>
          <div class="campo campo-check"><label><input type="checkbox" id="f_freguesia_manual"${manual ? ' checked' : ''}${ro ? ' disabled' : ''}> Escolher a freguesia manualmente</label></div>
          <div class="campo" data-manual${manual ? '' : ' hidden'}><label for="f_freguesia_id">Freguesia escolhida</label><select id="f_freguesia_id"${ro ? ' disabled' : ''}><option value="">—</option>${opsFreg(reg?.freguesia_id).map(([v, l]) => `<option value="${v}"${reg?.freguesia_id === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
          <div class="campo" data-manual${manual ? '' : ' hidden'}><label for="f_freguesia_justificacao">Justificação</label><input id="f_freguesia_justificacao" value="${esc(reg?.freguesia_justificacao)}"${ro ? ' disabled' : ''}></div>
        </div>
      </section>
      <section class="cartao"><header><h2>Propriedade e gestão</h2></header>${formHtml(cs.gestao, valores)}</section>
      <section class="cartao"><header><h2>Proveniência e qualidade</h2></header>${formHtml(cs.qual, valores)}</section>
      ${ro ? '' : `<div class="barra-gravar"><span class="estado-grav">${reg ? `Atualizado em ${dataHoraPT(reg.atualizado_em)}` : ''}</span><a class="btn" href="#/instalacoes">Cancelar</a><button class="btn btn-prim" type="submit">${reg ? 'Gravar alterações' : 'Criar instalação'}</button></div>`}
    </form>
    ${reg ? `<section class="cartao" id="s-espacos"><div class="carregar">A carregar espaços…</div></section>
      <section class="cartao" id="s-caract"><div class="carregar">A carregar caracterizações…</div></section>
      <section class="cartao" id="s-anexos"><div class="carregar">A carregar anexos…</div></section>
      <section class="cartao" id="s-hist"><div class="carregar">A carregar histórico…</div></section>` : ''}`;

  // Freguesia automática
  const mostrarFreg = () => {
    const alvo = $('#freg-auto', el);
    if ($('#f_freguesia_manual', el).checked) { alvo.innerHTML = '<span class="suave">Escolhida manualmente (abaixo).</span>'; return; }
    alvo.innerHTML = reg?.freguesia_id && !reg.freguesia_manual && ponto && pontoDe(reg.localizacao)?.join() === ponto.join()
      ? `<strong>${esc(nomeDe(c.u, reg.freguesia_id))}</strong> <span class="suave">· atribuída pelo ponto</span>`
      : `<span class="suave">${ponto ? 'Será atribuída pelo ponto ao gravar' : 'Marque o ponto no mapa'} (exige os limites das freguesias em Território).</span>`;
  };
  $('#f_freguesia_manual', el).onchange = ev => { $$('[data-manual]', el).forEach(x => x.hidden = !ev.target.checked); mostrarFreg(); };

  // Mapa
  const mapa = novoMapa($('#mapa-ficha', el));
  const icone = L.divIcon({ className: '', html: '<div class="ponto-ficha"></div>', iconSize: [22, 22], iconAnchor: [11, 11] });
  let marcador = null;
  const colocar = (p, centrar) => {
    ponto = p;
    if (!p) { if (marcador) { marcador.remove(); marcador = null; } }
    else if (marcador) marcador.setLatLng(p);
    else {
      marcador = L.marker(p, { icon: icone, draggable: !ro }).addTo(mapa);
      marcador.on('dragend', () => { const ll = marcador.getLatLng(); ponto = [ll.lat, ll.lng]; atualizarCoords(); mostrarFreg(); });
    }
    if (p && centrar) mapa.setView(p, Math.max(mapa.getZoom(), 16));
    atualizarCoords(); mostrarFreg();
  };
  const atualizarCoords = () => { $('#coords', el).textContent = ponto ? `${ponto[0].toFixed(6)}, ${ponto[1].toFixed(6)}` : ''; };
  if (!ro) mapa.on('click', ev => colocar([ev.latlng.lat, ev.latlng.lng], false));
  geometriasFreguesias().then(g => {
    const camada = camadaFreguesias(mapa, g);
    if (!ponto && camada) mapa.fitBounds(camada.getBounds());
  }).catch(() => {});
  if (ponto) { colocar(ponto, false); mapa.setView(ponto, 16); } else mostrarFreg();
  if (!ro) {
    $('#limpar-ponto', el).onclick = () => colocar(null);
    $('#gps', el).onclick = () => {
      if (!navigator.geolocation) return aviso('Este dispositivo não indica a localização.', 'erro');
      aviso('A obter a localização…');
      navigator.geolocation.getCurrentPosition(
        pos => { colocar([pos.coords.latitude, pos.coords.longitude], true); aviso(`Localização obtida (precisão de cerca de ${Math.round(pos.coords.accuracy)} m).`); },
        () => aviso('Não foi possível obter a localização. Verifique as permissões do navegador.', 'erro'),
        { enableHighAccuracy: true, timeout: 15000 });
    };
  }

  // Gravar
  const form = $('#f-inst', el);
  form.onsubmit = async ev => {
    ev.preventDefault();
    const todos = [...cs.ident, ...cs.local, ...cs.gestao, ...cs.qual];
    const { dados: d, erros } = lerForm(form, todos);
    d.freguesia_manual = $('#f_freguesia_manual', el).checked;
    if (d.freguesia_manual) {
      d.freguesia_id = $('#f_freguesia_id', el).value || null;
      d.freguesia_justificacao = $('#f_freguesia_justificacao', el).value.trim() || null;
      if (!d.freguesia_id) erros.push('Freguesia escolhida: campo obrigatório na escolha manual.');
      if (!d.freguesia_justificacao) erros.push('Justificação da freguesia: obrigatória na escolha manual.');
    } else { d.freguesia_justificacao = null; if (!ponto) d.freguesia_id = null; }
    d.localizacao = ponto ? ewkt(ponto) : null;
    const caixa = $('.erros', form);
    if (erros.length) return mostrarErros(caixa, erros);
    mostrarErros(caixa, []);
    const b = $('button[type=submit]', form); b.disabled = true;
    try {
      if (!reg) {
        d.municipio_id = m;
        const r = await dados(sb.from('instalacao').insert(d).select('id').single());
        aviso('Instalação criada. Pode agora juntar espaços, caracterizações e fotografias.');
        location.replace('#/instalacoes/' + r.id);
      } else {
        const r = await dados(sb.from('instalacao').update(d).eq('id', reg.id).select('id'));
        if (!r.length) throw semPermissao();
        aviso('Alterações gravadas.'); navegar();
      }
    } catch (e) { mostrarErros(caixa, [msgErro(e)]); b.disabled = false; }
  };
  if (!reg) return;
  ligarBotoesFicha(el, 'instalacao', reg);
  const falha = (sel, e) => { const x = $(sel, el); if (x) x.innerHTML = `<p class="erros">${esc(msgErro(e))}</p>`; };
  secaoEspacos($('#s-espacos', el), reg).catch(e => falha('#s-espacos', e));
  secaoCaracterizacoes($('#s-caract', el), reg).catch(e => falha('#s-caract', e));
  secaoAnexos($('#s-anexos', el), { instalacao_id: reg.id }).catch(e => falha('#s-anexos', e));
  secaoHistorico($('#s-hist', el), 'instalacao', reg.id).catch(e => falha('#s-hist', e));
}

/* ---------------------------------------------------------------- espaços desportivos */
const TIPOS_ESPACO = ['Campo', 'Pista', 'Tanque', 'Sala', 'Nave', 'Ginásio', 'Court', 'Parede de escalada', 'Percurso', 'Rinque', 'Outro'];
async function secaoEspacos(caixa, inst) {
  const c = S.cache;
  const lista = await dados(sb.from('espaco_desportivo').select('*').eq('instalacao_id', inst.id).is('eliminado_em', null).order('designacao'));
  const ligacoes = lista.length ? await dados(sb.from('espaco_modalidade').select('espaco_id,modalidade_id').in('espaco_id', lista.map(e => e.id)).is('eliminado_em', null)) : [];
  const modsDe = id => ligacoes.filter(l => l.espaco_id === id).map(l => l.modalidade_id);
  const dim = e => e.comprimento_m && e.largura_m ? `${fmtNum(e.comprimento_m, 1)} × ${fmtNum(e.largura_m, 1)} m` : '';
  caixa.innerHTML = `<header><h2>Espaços desportivos</h2><div class="acoes">${pode.editar() && !inst.eliminado_em ? '<button class="btn btn-peq" type="button" id="novo-esp">Juntar espaço</button>' : ''}</div></header>
    ${lista.length ? `<div class="tabela-envolta"><table class="tabela resp"><thead><tr><th>Espaço</th><th>Tipo</th><th>Dimensões</th><th class="num">Área útil</th><th>Coberto</th><th>Modalidades</th></tr></thead><tbody>
      ${lista.map(e => `<tr data-editar="${e.id}"><td class="titulo" data-l="Espaço">${esc(e.designacao)}</td><td data-l="Tipo">${esc(e.tipo_espaco)}</td><td data-l="Dimensões">${dim(e)}</td>
        <td class="num" data-l="Área útil">${e.area_util_m2 != null ? `${fmtNum(e.area_util_m2, 0)} m² <span class="suave">(${esc(ROT.area_origem[e.area_origem] || '')})</span>` : '<span class="suave">—</span>'}</td>
        <td data-l="Coberto">${e.coberto == null ? '' : e.coberto ? 'Sim' : 'Não'}</td><td data-l="Modalidades">${esc(modsDe(e.id).map(id => nomeDe(c.mo, id)).join(', '))}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="vazio">Sem espaços registados. Um pavilhão com uma nave e uma sala, por exemplo, tem dois espaços.</p>'}`;
  const editar = async esp => {
    const campos = [
      { n: 'designacao', r: 'Designação', obrig: true, ph: 'Ex.: Nave principal' },
      { n: 'tipo_espaco', r: 'Tipo de espaço', obrig: true, lista: TIPOS_ESPACO },
      { n: 'comprimento_m', r: 'Comprimento (m)', t: 'number' }, { n: 'largura_m', r: 'Largura (m)', t: 'number' },
      { n: 'area_util_m2', r: 'Área útil (m²)', t: 'number' }, { n: 'area_origem', r: 'Origem da área', t: 'select', ops: ops(ROT.area_origem), ajuda: 'Obrigatória quando indica a área.' },
      { n: 'coberto', r: 'Coberto', t: 'bool' }, { n: 'iluminacao', r: 'Iluminação artificial', t: 'bool' },
      { n: 'piso', r: 'Tipo de piso', larg: 'inteira' },
      { n: 'fonte_id', r: 'Fonte', t: 'select', ops: opsFonte(esp?.fonte_id) }, { n: 'estado_dado', r: 'Estado do dado', t: 'select', vazio: false, ops: opsEstado(esp?.estado_dado), padrao: 'nao_verificado' },
      { n: 'observacoes', r: 'Observações', t: 'textarea', larg: 'inteira' },
    ];
    const atuais = esp ? modsDe(esp.id) : [];
    const mods = c.modalidades.filter(x => x.ativa || atuais.includes(x.id));
    const ro = !pode.editar();
    const extra = `<div style="margin-top:14px"><h3>Modalidades praticáveis</h3>${mods.length ? `<div class="chips">${mods.map(x => `<label><input type="checkbox" name="mod" value="${x.id}"${atuais.includes(x.id) ? ' checked' : ''}${ro ? ' disabled' : ''}><span>${esc(x.nome)}</span></label>`).join('')}</div>` : '<p class="suave">Ainda não há modalidades. Crie-as em Catálogos.</p>'}</div>
      ${ro ? '' : '<p style="margin:12px 0 0"><button type="button" class="btn btn-peq" id="calc-area">Calcular área (comprimento × largura)</button></p>'}
      ${esp && !ro ? '<p style="margin:12px 0 0"><button type="button" class="btn btn-perigo btn-peq" id="rem-esp">Eliminar este espaço</button></p>' : ''}`;
    const r = await modalRegisto({
      titulo: esp ? esp.designacao : 'Novo espaço desportivo', tabela: 'espaco_desportivo', campos, reg: esp, ro, extraHtml: extra,
      fixos: { municipio_id: S.municipio.id, instalacao_id: inst.id },
      validar: (d, erros) => { if (d.area_util_m2 != null && !d.area_origem) erros.push('Origem da área: obrigatória quando indica a área útil.'); },
      aoAbrir: w => {
        const calc = $('#calc-area', w);
        if (calc) calc.onclick = () => {
          const n = s => Number(($(`[name=${s}]`, w).value || '').replace(',', '.'));
          const a = n('comprimento_m') * n('largura_m');
          if (!a) return aviso('Indique primeiro o comprimento e a largura.', 'erro');
          $('[name=area_util_m2]', w).value = String(Math.round(a * 100) / 100).replace('.', ',');
          $('[name=area_origem]', w).value = 'calculada';
        };
        const rem = $('#rem-esp', w);
        if (rem) rem.onclick = async () => {
          try { if (await eliminarRegisto('espaco_desportivo', esp.id, true)) { w.querySelector('[data-fechar]').click(); secaoEspacos(caixa, inst); } }
          catch (e) { aviso(msgErro(e), 'erro'); }
        };
      },
      depois: async (gravado, w) => {
        const escolhidas = $$('[name=mod]:checked', w).map(x => x.value);
        const novas = escolhidas.filter(x => !atuais.includes(x)), retiradas = atuais.filter(x => !escolhidas.includes(x));
        if (novas.length) await dados(sb.from('espaco_modalidade').upsert(novas.map(mid => ({ municipio_id: S.municipio.id, espaco_id: gravado.id, modalidade_id: mid, eliminado_em: null })), { onConflict: 'espaco_id,modalidade_id' }));
        if (retiradas.length) await dados(sb.from('espaco_modalidade').update({ eliminado_em: new Date().toISOString() }).eq('espaco_id', gravado.id).in('modalidade_id', retiradas));
      },
    });
    if (r) { aviso('Espaço gravado.'); secaoEspacos(caixa, inst); }
  };
  $('#novo-esp', caixa)?.addEventListener('click', () => editar(null));
  caixa.onclick = ev => { const tr = ev.target.closest('tr[data-editar]'); if (tr) editar(lista.find(e => e.id === tr.dataset.editar)); };
}

      { n: 'conservacao', r: 'Estado de conservação', larg: 'inteira', ajuda: 'Descreva o estado observado. A escala de classificação será definida e validada na Fase 3.' },
      { n: 'capacidade_utentes', r: 'Capacidade (utentes em simultâneo)', t: 'int' }, { n: 'lugares_bancada', r: 'Lugares de bancada', t: 'int' },
      { n: 'balnearios', r: 'Balneários', t: 'int' }, { n: 'taxas', r: 'Taxas / preços' },
      { n: 'horario_texto', r: 'Horário de funcionamento', t: 'textarea', larg: 'inteira', linhas: 2 },
      { n: 'necessidades_manutencao', r: 'Necessidades de manutenção', t: 'textarea', larg: 'inteira' },
      { n: 'fonte_id', r: 'Fonte', t: 'select', ops: opsFonte(car?.fonte_id) }, { n: 'estado_dado', r: 'Estado do dado', t: 'select', vazio: false, ops: opsEstado(car?.estado_dado), padrao: 'nao_verificado' },
      { n: 'observacoes', r: 'Observações', t: 'textarea', larg: 'inteira' },
    ];
    const reg = car ? { ...car, horario_texto: car.horario?.texto ?? '' } : null;
    const tabelaCampos = campos.filter(x => x.n !== 'horario_texto');
    const r = await abrirModal({
      titulo: car ? `Levantamento de ${dataPT(car.data_levantamento)}` : 'Novo levantamento', largo: true,
      corpo: `<form novalidate>${formHtml(pode.editar() ? campos : soLeitura(campos), reg || {})}</form>`,
      acoes: !pode.editar() ? [{ rotulo: 'Fechar', valor: null }] : [{ rotulo: 'Cancelar', valor: null }, { rotulo: 'Gravar', classe: 'btn-prim', fazer: async w => {
        const { dados: d, erros } = lerForm(w, campos);
        if (erros.length) throw { message: erros.join('\n') };
        const linha = Object.fromEntries(tabelaCampos.map(x => [x.n, d[x.n]]));
        linha.horario = d.horario_texto ? { texto: d.horario_texto } : null;
        if (car) { const x = await dados(sb.from('caracterizacao').update(linha).eq('id', car.id).select('id')); if (!x.length) throw semPermissao(); }
        else await dados(sb.from('caracterizacao').insert({ ...linha, municipio_id: S.municipio.id, instalacao_id: inst.id }));

/* ---------------------------------------------------------------- anexos */
const nomeSeguro = n => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9._-]+/g, '_').slice(-80);
async function secaoAnexos(caixa, dono) {
  const [chave, idDono] = Object.entries(dono)[0];
  const lista = await dados(sb.from('anexo').select('*').eq(chave, idDono).is('eliminado_em', null).order('criado_em', { ascending: false }));
  const imagens = lista.filter(a => (a.mime || '').startsWith('image/'));
  let urls = {};
  if (lista.length) {
    const { data } = await sb.storage.from('anexos').createSignedUrls(lista.map(a => a.caminho_storage), 3600);
    (data || []).forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; });
  }
  const ed = pode.editar();
  caixa.innerHTML = `<header><h2>Fotografias e documentos</h2></header>
    ${ed ? `<div class="filtros"><select id="an-tipo" aria-label="Tipo de anexo">${ops(ROT.tipo_anexo).map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
      <label class="btn btn-peq">Juntar ficheiros<input type="file" id="an-fich" multiple accept="image/*,application/pdf" hidden></label><span class="suave ajuda" id="an-estado"></span></div>` : ''}
    ${lista.length ? `<div class="anexos">${lista.map(a => {
      const u = urls[a.caminho_storage], img = imagens.includes(a);
      return `<div class="anexo"><a class="previa" href="${esc(u || '#')}" target="_blank" rel="noopener" ${img && u ? `style="background-image:url('${esc(u)}')"` : ''}>${img ? '' : esc((a.nome_original.split('.').pop() || '').toUpperCase())}</a>
        <div class="info"><div title="${esc(a.nome_original)}">${esc(a.nome_original)}</div><div class="suave">${esc(ROT.tipo_anexo[a.tipo])} · ${dataPT(a.criado_em)}</div>
        ${ed ? `<button class="btn-texto" type="button" data-rem="${a.id}" style="padding:4px 0">Remover</button>` : ''}</div></div>`;
    }).join('')}</div>` : '<p class="vazio">Sem anexos.</p>'}`;
  const fich = $('#an-fich', caixa);
  if (fich) fich.onchange = async () => {
    const ficheiros = [...fich.files]; if (!ficheiros.length) return;
    const tipo = $('#an-tipo', caixa).value, est = $('#an-estado', caixa);
    let ok = 0;
    for (const [i, f] of ficheiros.entries()) {
      est.textContent = `A enviar ${i + 1} de ${ficheiros.length}…`;
      if (f.size > 20 * 1024 * 1024) { aviso(`${f.name}: excede 20 MB.`, 'erro'); continue; }
      const caminho = `${S.municipio.id}/${chave.replace('_id', '')}/${idDono}/${Date.now()}-${nomeSeguro(f.name)}`;
      try {
        const up = await sb.storage.from('anexos').upload(caminho, f, { contentType: f.type || 'application/octet-stream', upsert: false });
        if (up.error) throw up.error;
        await dados(sb.from('anexo').insert({ municipio_id: S.municipio.id, [chave]: idDono, tipo, caminho_storage: caminho, nome_original: f.name, mime: f.type || null, tamanho_bytes: f.size }));
        ok++;
      } catch (e) { aviso(`${f.name}: ${msgErro(e)}`, 'erro'); }
    }
    if (ok) aviso(`${ok} ficheiro(s) juntados.`);
    secaoAnexos(caixa, dono);
  };
  $$('[data-rem]', caixa).forEach(b => b.onclick = async () => {
    try { if (await eliminarRegisto('anexo', b.dataset.rem, true)) secaoAnexos(caixa, dono); } catch (e) { aviso(msgErro(e), 'erro'); }
  });
}

        $('#g-previa', w).textContent = `A importar ${i + 1} de ${sel.length}…`;
        const nome = String(f.properties?.[kn] ?? '').trim() || `Sem nome ${i + 1}`, cod = kc ? String(f.properties?.[kc] ?? '').trim() : '';
        const ex = cod && existentes.find(u => u.codigo_oficial === cod);
        const { error } = await sb.rpc('importar_unidade_geojson', { p_municipio: S.municipio.id, p_tipo: tipo, p_nome: nome, p_codigo: cod || null, p_vigente_de: desde, p_geojson: f.geometry, p_srid: srid, p_id: ex ? ex.id : null });
        if (error) falhas.push(`${nome}: ${msgErro(error)}`); else if (ex) atualizados++; else novos++;
      }
      let reatr = 0;
      if (tipo === 'freguesia' && novos + atualizados) { const { data } = await sb.rpc('reatribuir_freguesias', { p_municipio: S.municipio.id }); reatr = data || 0; }
      if (falhas.length) throw { message: `Importadas ${novos + atualizados}; falharam ${falhas.length}:\n${falhas.join('\n')}` };
      return { novos, atualizados, reatr };
    } }],
  });
  if (r) { aviso(`${r.novos} unidades criadas, ${r.atualizados} atualizadas${r.reatr ? `, ${r.reatr} instalações com freguesia recalculada` : ''}.`); invalidarCache(); navegar(); }
  else { invalidarCache(); navegar(); }
}

/* ---------------------------------------------------------------- catálogos */
async function vCatalogos(el) {
  const c = await carregarCache(true), m = S.municipio.id;
  const ambito = x => x.municipio_id ? 'Este município' : 'Comum';
  const podeTip = x => x ? (x.municipio_id ? pode.admin() : S.adminPlataforma) : (pode.admin() || S.adminPlataforma);
  const podeMod = x => x ? (x.municipio_id ? pode.editar() : S.adminPlataforma) : (pode.editar() || S.adminPlataforma);
  el.innerHTML = `<div class="cab-vista"><h1>Catálogos</h1></div>
    <p class="nota">As tipologias são critérios metodológicos. Indique na descrição a fonte da classificação (por exemplo, DL 141/2009, art.º 5.º). O alinhamento com o SNID fica por confirmar.</p>
    <section class="cartao"><header><h2>Tipologias de instalações</h2><div class="acoes">${podeTip(null) ? '<button class="btn btn-peq" type="button" id="nova-tip">Nova tipologia</button>' : ''}</div></header>
      ${c.tipologias.length ? `<div class="tabela-envolta"><table class="tabela resp"><thead><tr><th>Código</th><th>Nome</th><th>Classe</th><th>Âmbito</th><th>Ativa</th></tr></thead><tbody>
      ${c.tipologias.map(t => `<tr data-editar="t:${t.id}"><td class="cod" data-l="Código">${esc(t.codigo)}</td><td class="titulo" data-l="Nome">${esc(t.nome)}</td><td data-l="Classe">${esc(ROT.classe[t.classe])}</td><td data-l="Âmbito">${ambito(t)}</td><td data-l="Ativa">${t.ativa ? 'Sim' : 'Não'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="vazio">Ainda não há tipologias.</p>'}
    </section>
    <section class="cartao"><header><h2>Modalidades</h2><div class="acoes">${podeMod(null) ? '<button class="btn btn-peq" type="button" id="nova-mod">Nova modalidade</button>' : ''}</div></header>
      ${c.modalidades.length ? `<div class="tabela-envolta"><table class="tabela resp"><thead><tr><th>Nome</th><th>Federação</th><th>Âmbito</th><th>Ativa</th></tr></thead><tbody>
      ${c.modalidades.map(x => `<tr data-editar="m:${x.id}"><td class="titulo" data-l="Nome">${esc(x.nome)}</td><td data-l="Federação">${esc(x.federacao)}</td><td data-l="Âmbito">${ambito(x)}</td><td data-l="Ativa">${x.ativa ? 'Sim' : 'Não'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="vazio">Ainda não há modalidades.</p>'}
    </section>`;
  const campoAmbito = { n: 'ambito', r: 'Âmbito', t: 'select', vazio: false, ops: [['municipio', 'Só este município'], ['comum', 'Comum a todos os municípios']] };
  const editarTip = async t => {
    let campos = [
      { n: 'codigo', r: 'Código', obrig: true, max: 30 }, { n: 'nome', r: 'Nome', obrig: true },
      { n: 'classe', r: 'Classe', t: 'select', ops: ops(ROT.classe), obrig: true }, { n: 'versao_catalogo', r: 'Versão do catálogo', padrao: 'v1' },
      { n: 'codigo_snid', r: 'Código SNID', ajuda: 'Preencha só depois de confirmado no SNID.' }, { n: 'ativa', r: 'Ativa', t: 'checkbox', padrao: true },
      { n: 'descricao', r: 'Descrição e fonte', t: 'textarea', larg: 'inteira' },
    ];
    if (!t && S.adminPlataforma) campos = [campoAmbito, ...campos];
    const r = await modalRegisto({
      titulo: t ? t.nome : 'Nova tipologia', tabela: 'tipologia', campos, reg: t, ro: !podeTip(t),
      validar: d => { if ('ambito' in d) { if (d.ambito === 'municipio') d.municipio_id = m; else d.municipio_id = null; delete d.ambito; } else if (!t) d.municipio_id = m; },
    });
    if (r) { aviso('Tipologia gravada.'); invalidarCache(); navegar(); }
  };
  const editarMod = async x => {
    let campos = [{ n: 'nome', r: 'Nome', obrig: true }, { n: 'federacao', r: 'Federação' }, { n: 'codigo', r: 'Código' }, { n: 'ativa', r: 'Ativa', t: 'checkbox', padrao: true }];
    if (!x && S.adminPlataforma) campos = [campoAmbito, ...campos];
    const r = await modalRegisto({
      titulo: x ? x.nome : 'Nova modalidade', tabela: 'modalidade', campos, reg: x, ro: !podeMod(x),
      validar: d => { if ('ambito' in d) { d.municipio_id = d.ambito === 'municipio' ? m : null; delete d.ambito; } else if (!x) d.municipio_id = m; },
    });
    if (r) { aviso('Modalidade gravada.'); invalidarCache(); navegar(); }
  };
  $('#nova-tip', el)?.addEventListener('click', () => editarTip(null));
  $('#nova-mod', el)?.addEventListener('click', () => editarMod(null));
  el.addEventListener('click', ev => {
    const tr = ev.target.closest('tr[data-editar]'); if (!tr) return;
    const [k, id] = tr.dataset.editar.split(':');
    if (k === 't') editarTip(c.t.get(id)); else editarMod(c.mo.get(id));
  });
}

/* ---------------------------------------------------------------- fontes */
async function vFontes(el) {
  const m = S.municipio.id;
  const lista = await dados(sb.from('fonte').select('*').eq('municipio_id', m).is('eliminado_em', null).order('titulo'));
  el.innerHTML = `<div class="cab-vista"><h1>Fontes</h1><div class="acoes">${pode.editar() ? '<button class="btn btn-prim" type="button" id="nova-fonte">Nova fonte</button>' : ''}</div></div>
    <p class="nota">Cada dado da plataforma pode indicar de onde vem. Registe aqui a legislação, as estatísticas, a cartografia e os levantamentos municipais usados.</p>
    ${lista.length ? `<div class="tabela-envolta"><table class="tabela resp"><thead><tr><th>Título</th><th>Tipo</th><th>Entidade emissora</th><th>Data</th><th>Vigência</th></tr></thead><tbody>
      ${lista.map(f => `<tr data-editar="${f.id}"><td class="titulo" data-l="Título">${esc(f.titulo)}${f.url ? ` · <a href="${esc(f.url)}" target="_blank" rel="noopener">abrir</a>` : ''}</td><td data-l="Tipo">${esc(ROT.tipo_fonte[f.tipo])}</td>
        <td data-l="Emissora">${esc(f.entidade_emissora)}</td><td data-l="Data">${dataPT(f.data_publicacao)}</td><td data-l="Vigência">${esc(ROT.vigencia[f.vigencia] || '')}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="cartao vazio">Ainda não há fontes registadas. Comece pelo levantamento municipal de instalações.</div>'}`;
  const editar = async f => {
    const campos = [
      { n: 'titulo', r: 'Título', obrig: true, larg: 'inteira' }, { n: 'tipo', r: 'Tipo', t: 'select', ops: ops(ROT.tipo_fonte), obrig: true },
      { n: 'entidade_emissora', r: 'Entidade emissora' }, { n: 'url', r: 'Endereço (URL)', t: 'url', larg: 'inteira' },
      { n: 'data_publicacao', r: 'Data de publicação', t: 'date' }, { n: 'versao', r: 'Versão' },
      { n: 'ambito_territorial', r: 'Âmbito territorial' }, { n: 'data_consulta', r: 'Data de consulta', t: 'date' },
      { n: 'vigencia', r: 'Vigência', t: 'select', ops: ops(ROT.vigencia) },
      { n: 'notas', r: 'Notas', t: 'textarea', larg: 'inteira' },
    ];
    const extra = f && pode.editar() ? '<p style="margin:12px 0 0"><button type="button" class="btn btn-perigo btn-peq" id="rem-fonte">Eliminar esta fonte</button></p>' : '';
    const r = await modalRegisto({
      titulo: f ? f.titulo : 'Nova fonte', tabela: 'fonte', campos, reg: f, ro: !pode.editar(), fixos: f ? {} : { municipio_id: m }, extraHtml: extra,
      aoAbrir: w => { const b = $('#rem-fonte', w); if (b) b.onclick = async () => { try { if (await eliminarRegisto('fonte', f.id, true)) { w.querySelector('[data-fechar]').click(); invalidarCache(); navegar(); } } catch (e) { aviso(msgErro(e), 'erro'); } }; },
    });
    if (r) { aviso('Fonte gravada.'); invalidarCache(); navegar(); }
  };
  $('#nova-fonte', el)?.addEventListener('click', () => editar(null));
  el.addEventListener('click', ev => { const tr = ev.target.closest('tr[data-editar]'); if (tr && !ev.target.closest('a')) editar(lista.find(x => x.id === tr.dataset.editar)); });
}

/* ---------------------------------------------------------------- arranque */
async function iniciar() {
  sb.auth.onAuthStateChange((evento, sessao) => {
    // Não chamar o Supabase dentro deste callback (pode bloquear); adiar.
    if (evento === 'PASSWORD_RECOVERY') setTimeout(pedirNovaPalavraPasse, 0);
    if (evento === 'SIGNED_OUT' && S.user) setTimeout(() => { S.user = null; navegar(); }, 0);
  });
  window.addEventListener('hashchange', navegar);
  try {
    const { data } = await sb.auth.getSession();
    await definirSessao(data.session);
  } catch (e) {
    console.error(e);
    aviso(msgErro(e), 'erro');
  }
  navegar();
}
iniciar();
</script>
